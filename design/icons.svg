<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <!--
    旅行助手 · 功能图标精灵图
    ==================================================================
    用法：把本文件内容内联进页面，再用
      <svg class="ico"><use href="#i-map"/></svg>
    引用。也可由构建脚本抽取成独立符号文件。
    全部 24x24 网格，描边 1.8，圆角端点，currentColor 继承文字色。

    统一图标语言（不是通用线性图标集）：
      1. 凡有外框，右下角一律 45 度斜切，呼应品牌主标的刻石印章；
      2. 凡表「位置」，用实心落点 + 纸色内点，不用水滴形定位针；
      3. 凡表「路径」，用折线而非曲线，与等高线山径同源；
      4. 每个图标承载一个产品语义，不用于纯装饰。
    色值不写死，由外层 CSS 变量控制；状态色走 tokens.css 的 clay / ok / err。
    XML 注释内不可出现双连字符，变量名一律省去前缀。
  -->

  <symbol id="i-ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
