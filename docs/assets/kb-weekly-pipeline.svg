<text x="678" y="486" font-size="12" fill="#475569" font-family="'SFMono-Regular', Consolas, monospace">backup/ + audit.jsonl</text>
</g>
<path d="M330 512 L330 528" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="528" width="580" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="528" width="4" height="64" rx="2" fill="#16a34a"/>
