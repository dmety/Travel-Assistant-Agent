    if(list.length > shown.length){
      foldBlock(box, '展开其余 ' + (list.length - shown.length) + ' 个景点', function(body){
        list.slice(shown.length).forEach(function(r){ addRow(body, r); });
      });
    }
    links.slice(0, 4).forEach(function(c){
      var line = el('div','wx-link');
      var a = document.createElement('a');
      a.textContent = c.name + ' ↗';
      a.setAttribute('href', c.url);
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
      if(c.note) a.setAttribute('title', c.note);
      line.appendChild(a);
      box.appendChild(line);
    });
    box.appendChild(el('div','wx-tip', links.length
      ? '票价按数据源原文整段显示，未核验的不补数字，可能已变更；标「票价未收录」的是知识库没有这条记录，不是查了但没核到。点评价数可看官方评论入口，评论正文不在本系统。上方为人工核验的官方入口，余票未核验，本系统不代下单、不查库存。'
      : '票价按数据源原文整段显示，未核验的不补数字；标「票价未收录」的是知识库没有这条记录。点评价数可看官方评论入口，评论正文不在本系统。购票请到景区官方公众号/官网或现场窗口，本系统不代下单、不查余票、不生成猜测链接。'));
    return box;
  }

  /**
   * 卡片 → DOM。行程与餐馆直接复用既有渲染器：
   * Agent 的工具结果和 /api/agent/invoke 是同一个信封，形状一致才能不写第二套渲染。
   */
  function paintCard(card, baseText){
    if(!card) return null;
    if(card.type === 'weather') return weatherBlock(card.data);
    if(card.type === 'route') return routeBlock(card.data);
    if(card.type === 'places') return placesBlock(card.data);
    if(card.type === 'vote') return voteBlock(card.data);
    if(card.type === 'envelope'){
      var env = card.data || {};
      if(card.intent === 'TICKET_ADVICE'){
        return ticketGuidanceBlock(env.ticketGuidance);
      }
      if(card.intent === 'FOOD_RECOMMEND'){
        var food = foodFromEnvelope(env);
        if(!food) return null;
        var foodBox = el('div','');
        if(food.advice){
          foodBox.appendChild(el('div','warn', escapeHtml(food.advice)));
        }
        noticeNodes(food.notices).forEach(function(n){ foodBox.appendChild(n); });
        if(food.items.length){
          var fc = foodCard(food.items, food.items.length);
          fc.style.marginTop = 'var(--sp-2)';
          foodBox.appendChild(fc);
        }
        return foodBox;
      }
      var view = draftFromEnvelope(env);
      if(!view) return null;
      var planBox = el('div','');
      appendDraftBlocks(planBox, view, { baseText: baseText || '' });
      return planBox.childNodes.length ? planBox : null;
    }
    return null;
  }

  /**
   * 先把整句话交给后端解析：意图、目的地、天数、人数、预算、日期、偏好一次拿全。
   * 后端用模型理解语言、用 Java 校验范围，前端不再自己猜「几个字算天数」。
   * 接口不可用（老版本后端、网络异常）时返回 null，由 buildRequest 走降级路径。
   */
  function understand(text, session){
    return fetch('/api/intent/parse', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: String(text || '').slice(0, 300),
        history: historyOf(session, text),
        state: stateOf(session)
      })
    }).then(function(r){
      if(r.status === 401){
        location.replace('/?next=' + encodeURIComponent('/chat.html'));
        return null;
      }
      return r.ok ? r.json() : null;
    }).catch(function(){ return null; });
  }

  /** 解析结果 → 规划请求。字段全部来自后端，前端只做透传与覆盖。 */
  function requestFromIntent(u, extra){
    if(!u.resolved){
      return {
        missing: true,
        // 只有模型真的给出了地名才当作「没认出的词」，否则别把整句话拿去当标签
        tried: u.destination ? [u.destination] : [],
        alternatives: u.alternatives || [],
        note: u.note || '',
        intent: u.intent
      };
    }
    var req = { destination: u.city };
    if(u.days) req.days = u.days;
    if(u.travelers) req.travelers = u.travelers;
    if(u.budget) req.budget = u.budget;
    if(u.departDate) req.departDate = u.departDate;
    if(u.returnDate) req.returnDate = u.returnDate;
    if(u.preferences && u.preferences.length) req.preferences = u.preferences;
    // 点选补问卡片 / 选项卡时带来的结构化字段优先于解析结果
    if(extra) applyExtra(req, extra);
    var place = { name: u.city, via: u.spot || u.destination || '', note: u.note || '' };
    // 说景区名也能查：告诉用户实际按哪个城市检索，避免「我明明说了武当山」的困惑
    if(place.via && place.via !== place.name){
      place.note = place.note || ('按「' + place.via + '」所在城市 ' + place.name + ' 检索');
    }
    return { request: req, place: place, intent: u.intent, parsed: u };
  }

  function applyExtra(req, extra){    ['days','travelers','budget','departDate','returnDate'].forEach(function(k){
      if(extra[k] != null && extra[k] !== '') req[k] = extra[k];
    });
    if(extra.prefs && extra.prefs.length) req.preferences = extra.prefs;
  }

  async function buildRequest(text, extra){
    var place = await resolvePlace(text);
    // 解析不出地名时把猜到的片段带回去，好让追问说清是「哪个词没查到」
    if(!place || place.miss){
      return {
        missing: true,
        tried: (place && place.tried) || placeCandidates(text),
        alternatives: (place && place.alternatives) || [],
        note: (place && place.note) || ''
      };
    }
    var req = { destination: place.name };
    var days = parseDays(text);
    if(days) req.days = days;
    var people = parseTravelers(text);
    if(people) req.travelers = people;
    var budget = parseBudget(text);
    if(budget) req.budget = budget;
    var prefs = parsePrefs(text);
    if(prefs.length) req.preferences = prefs;
    // 点选补问卡片时带来的结构化字段，优先于从文本里解析的结果
    if(extra) applyExtra(req, extra);
    // 说景区名也能查：告诉用户实际按哪个城市检索，避免「我明明说了武当山」的困惑
    if(place.via && place.via !== place.name){
      place.note = place.note || ('按「' + place.via + '」所在城市 ' + place.name + ' 检索');
    }
    return { request: req, place: place };
  }

  /**
   * 走 L1 编排层：按 intent 查注册表、逐个 invoke、响应过契约校验，失败切兜底。
   * 返回的是契约信封（intent / status / providerId / result / attempts），
   * 结构化草案在 result.facts 里以 CONTENT fact（category=PLAN_DRAFT）带回。
   */
  async function callAgent(req, intent){
    var res = await fetch('/api/agent/invoke', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ intent: intent || 'PLAN_DRAFT', context: req })
    });
    if(res.status === 401){
      location.replace('/?next=' + encodeURIComponent('/chat.html'));
      throw new Error('登录已过期');
    }
    var body = null;
    try{ body = await res.json(); }catch(e){ /* 非 JSON 响应 */ }
    if(!res.ok){
      var msg = (body && (body.error || body.message)) || ('请求失败（HTTP ' + res.status + '）');
      throw new Error(msg);
    }
    if(!body) throw new Error('响应为空');
    return body;
  }

  /** 契约信封 → 渲染视图。字段名与 plan 接口一致，渲染代码不必分叉。 */
  function draftFromEnvelope(env){
    var payload = (env && env.result) ? env.result : null;
    if(!payload) return null;
    var facts = payload.facts || [];
    var draft = null;
    for(var i=0;i<facts.length;i++){
      var f = facts[i];
      if(f && f.type === 'CONTENT' && f.value && f.value.category === 'PLAN_DRAFT'){ draft = f.value; break; }
    }
    var view = draft ? slimDraft(draft) : null;
    if(!view){
      // 兜底 Provider（例如 builtin.rules）只回 advice/notices，没有结构化草案
      view = { advice:null, notices:(payload.notices || []).slice(0,5), sources:[],
               questions:[], checks:[], candidates:[], dailySchedules:[],
               budgetEstimate:null, generatedAt:null };
    }
    if(!view.advice && payload.advice) view.advice = payload.advice;
    view.agent = {
      providerId: env.providerId || payload.providerId || '',
      status: env.status || payload.status || '',
      attempts: env.attempts || [],
      registryVersion: env.registryVersion || null
    };
    view.refused = view.agent.status === 'REFUSED' && !view.advice && !view.candidates.length;
    return view;
  }

  function noticeNodes(notices){
    return (notices || []).slice(0, 3).map(function(t){
      var n = el('div','warn');
      n.textContent = t;
      return n;
    });
  }

  /** 助手富内容统一入口：实时回复与历史回放共用，避免两套渲染漂移。 */
  function appendDraftBlocks(body, view, ctx){
    if(!view) return;
    // 有模型建议时不再重复列 notices：正文通常已覆盖同样的缺失项
    if(!view.advice){
      noticeNodes(view.notices).forEach(function(n){
        n.style.marginTop = 'var(--sp-2)';
        body.appendChild(n);
      });
    }
    // 收敛到 0 天时也要交代一句，否则用户只看到正文、不知道卡片去哪了
    var trimmedDays = Number(((view.dayScope || {}).trimmedDays) || 0);
    if((view.dailySchedules && view.dailySchedules.length) || trimmedDays){
      var card = planCard(view.dailySchedules || [], view);
      card.style.marginTop = 'var(--sp-2)';
      body.appendChild(card);
    }
    // 检查项也可能堆五六条：先给最要紧的两条，其余折叠，不把卡片顶成一屏警告
    var warns = warnNodes(view.checks || []);
    warns.slice(0, 2).forEach(function(n){
      n.style.marginTop = 'var(--sp-2)';
      body.appendChild(n);
    });
    if(warns.length > 2){
      var moreChecks = el('div','plan');
      moreChecks.style.marginTop = 'var(--sp-2)';
      foldBlock(moreChecks, '展开其余 ' + (warns.length - 2) + ' 项检查提示', function(fbody){
        warns.slice(2).forEach(function(n){ fbody.appendChild(n); });
      });
      body.appendChild(moreChecks);
    }
    if(view.candidates && view.candidates.length){
      var cands = candCard(view.candidates);
      cands.style.marginTop = 'var(--sp-2)';
      body.appendChild(cands);
    }
    if(view.questions && view.questions.length){
      var qa = qaCard(view.questions, ctx);
      qa.style.marginTop = 'var(--sp-2)';
      body.appendChild(qa);
    }
  }

  function finishMeta(shell, src){
    var meta = el('div','msg-meta');
    meta.appendChild(document.createTextNode(nowTime() + (src ? ' · ' + src : '')));
    meta.appendChild(copyBtn(shell.bubble));
    shell.body.appendChild(meta);
  }

  /* ---------- 生成回复 ---------- */
  async function respond(session, text, skipChoice, extra){
    busy = true;
    refreshSend();

    var typing = typingMsg();
    stream.appendChild(typing);
    scrollBottom();

    // 点选补问卡（extra）说明槽位已经齐了，直接走确定性链路，不必再让模型猜
    if(!extra){
      var agent = await chatAgent(text, session);
      if(agent && agent.reply){
        typing.remove();
        var shell0 = assistantShell();
        shell0.bubble.style.minHeight = '1.7em';
        stream.appendChild(shell0.wrap);
        await typeText(shell0.bubble, plainText(agent.reply));
        shell0.bubble.innerHTML = formatRich(agent.reply);
        var savedCards = [];
        var savedDraft = null;
        (agent.cards || []).forEach(function(card){
          var node = paintCard(card, text);
          if(node){
            node.style.marginTop = 'var(--sp-2)';
            shell0.body.appendChild(node);
          }
          // 回放只保留体积小的卡片：行程存精简草案，餐馆三十条不进 localStorage
          if(card.type !== 'envelope'){
            savedCards.push(card);
          }else if(card.intent !== 'FOOD_RECOMMEND' && !savedDraft){
            savedDraft = draftFromEnvelope(card.data);
          }
        });
        var traces = (agent.trace || []).map(function(t){ return t.label; });
        var meta = 'Agent';
        if(traces.length) meta += ' · 查了 ' + traces.join('、');
        if(agent.note) meta += ' · ' + brief(agent.note, 24);
        finishMeta(shell0, meta);
        saveState(session, agent.state);
        addMessage(session, { role:'assistant', text:agent.reply, at:nowTime(),
          cards:savedCards, draft:savedDraft,
          agent:{ providerId:'chat.agent', status:'OK' } });
        scrollBottom();
        busy = false;
        refreshSend();
        return;
      }
    }

    // 模型不可用（未配密钥 / 调用失败）：回落到「解析 + 编排」这条确定性链路
    var parsed = await understand(text, session);

    // 闲聊：不查知识库也不调编排层，优先用模型结合上文的回复
    if(parsed && parsed.intent === 'CHAT'){
      typing.remove();
      var chatShell = assistantShell();
      stream.appendChild(chatShell.wrap);
      var hello = parsed.reply
        || '我在。说个目的地和大概几天就能排行程，也可以问我某地有什么好吃的、有哪些景点。';
      await typeText(chatShell.bubble, plainText(hello));
      chatShell.bubble.innerHTML = formatRich(hello);
      // 已经聊过几轮就不再塞开场按钮：那是第一次见面才需要的台阶
      var turns = historyOf(session, text).length;
      if(!turns){
        var starters = chipCard('也可以直接点这些', [
          { text:'武汉 3 天', send:'武汉 3 天，2 个人，预算 3000' },
          { text:'武当山 2 天', send:'武当山 2 天' },
          { text:'武汉有什么好吃的', send:'武汉有什么好吃的' }
        ]);
        starters.style.marginTop = 'var(--sp-2)';
        chatShell.body.appendChild(starters);
      }
      finishMeta(chatShell, '闲聊');
      addMessage(session, { role:'assistant', text:hello, at:nowTime() });
      scrollBottom();
      busy = false;
      refreshSend();
      return;
    }

    // 解析接口不可用（老后端 / 网络异常）时退回原来的正则解析，不至于整页不可用
    var built = parsed ? requestFromIntent(parsed, extra) : await buildRequest(text, extra);
    if(!built || built.missing){
      typing.remove();
      var s0 = assistantShell();
      stream.appendChild(s0.wrap);
      var tried = (built && built.tried && built.tried.length) ? built.tried[0] : '';
      var alts = (built && built.alternatives) || [];
      var note = (built && built.note) || '';
      // 三种情况要说清：后端给了判断依据 / 能给出相近城市 / 完全没线索
      var ask;
      if(note){
        ask = note + (alts.length ? '。也可以从下面选一个：' : '。');
      }else if(alts.length){
        ask = '没认出「' + tried + '」，你是不是想去下面某个地方？';
      }else if(tried){
        ask = '「' + tried + '」不在知识库的景点条目里。知识库还在扩充（目前覆盖部分城市），'
            + '可以说它上一级的地名，或者直接选个城市。';
      }else{
        ask = '告诉我要去哪座城市或省份，比如「武汉两天怎么玩」「云南 5 天」；也可以直接说景区名，比如「武当山」。';
      }
      s0.bubble.textContent = ask;
      if(alts.length){
        var dest = destCard(alts, tried);
        dest.style.marginTop = 'var(--sp-2)';
        s0.body.appendChild(dest);
      }
      finishMeta(s0, '等待目的地');
      addMessage(session, { role:'assistant', text:ask, kind:'dest', at:nowTime(), alts:alts });
      busy = false;
      refreshSend();
      return;
    }

    // 意图决定走哪条链路：找吃的去美食 Provider，其余排行程
    var capability = built.intent === 'FOOD_RECOMMEND' ? 'FOOD_RECOMMEND' : 'PLAN_DRAFT';

    // 记住这一轮确认了什么：下一句省略城市/天数时可以直接沿用
    saveState(session, {
      city: built.place.name,
      days: built.request.days,
      travelers: built.request.travelers,
      budget: built.request.budget,
      preferences: built.request.preferences
    });

    // 美食 Provider 只按坐标找周边餐馆，不接受「按城市中心」兜底：
    // 先拿该城市景点库第一条当锚点，拿不到就明确说明找不到，不编地址。
    if(capability === 'FOOD_RECOMMEND'){
      built.request.city = built.place.name;
      var anchorId = await foodAnchor(built.place.name);
      if(anchorId) built.request.attractionIds = [anchorId];
    }

    // 排行程但没说天数：先给选项，选完再排（点「先看看景点」则不拦）
    if(capability === 'PLAN_DRAFT' && !skipChoice && !built.request.days){
      typing.remove();
      var cs = assistantShell();
      stream.appendChild(cs.wrap);
      var intro = (built.place.via && built.place.via !== built.place.name)
        ? '你说的是「' + built.place.via + '」，我按它所在的 ' + built.place.name + ' 找景点。'
        : '好，按「' + built.place.name + '」来。';
      intro += '先选一下天数，其余可以跳过，选完我就排行程。';
      await typeText(cs.bubble, plainText(intro));
      cs.bubble.innerHTML = formatRich(intro);
      var opts = choiceCard(text, built.place, {
        // 已经说过的信息预选回来，不重复问
        travelers: built.request.travelers,
        prefs: built.request.preferences
      });
      opts.style.marginTop = 'var(--sp-2)';
      cs.body.appendChild(opts);
      finishMeta(cs, '等待补充信息');
      addMessage(session, { role:'assistant', text:intro, kind:'choice', at:nowTime(),
        choice:{ base:text, place:{ name:built.place.name, via:built.place.via } } });
      scrollBottom();
      busy = false;
      refreshSend();
      return;
    }

    var view = null;
    var failure = null;
    try{
      var envelope = await callAgent(built.request, capability);
      view = capability === 'FOOD_RECOMMEND' ? foodFromEnvelope(envelope) : draftFromEnvelope(envelope);
    }catch(e){
      failure = e.message || '请求失败';
    }
    typing.remove();

    var shell = assistantShell();
    shell.bubble.style.minHeight = '1.7em';
    stream.appendChild(shell.wrap);
    scrollBottom();

    if(failure || !view){
      var failText = '这次没拿到结果：' + (failure || '编排层没有返回结果') + '。可以稍后再问一次。';
      shell.bubble.textContent = failText;
      finishMeta(shell, '请求失败');
      addMessage(session, { role:'assistant', text:failText, at:nowTime() });
      busy = false;
      refreshSend();
      return;
    }

    // 美食：只渲染真实查到的餐馆，没有候选就如实说没找到
    if(capability === 'FOOD_RECOMMEND'){
      var foodHead = view.items.length
        ? '在 ' + built.place.name + ' 找到 ' + view.items.length + ' 家可以去的餐馆。'
        : '这次没有拿到 ' + built.place.name + ' 的餐馆候选。';
      await typeText(shell.bubble, plainText(foodHead));
      shell.bubble.innerHTML = formatRich(foodHead);
      if(view.advice){
        var ad = el('div','warn');
        ad.textContent = view.advice;
        ad.style.marginTop = 'var(--sp-2)';
        shell.body.appendChild(ad);
      }
      noticeNodes(view.notices).forEach(function(n){
        n.style.marginTop = 'var(--sp-2)';
        shell.body.appendChild(n);
      });
      if(view.items.length){
        var fc = foodCard(view.items, view.items.length);
        fc.style.marginTop = 'var(--sp-2)';
        shell.body.appendChild(fc);
      }
      finishMeta(shell, '美食推荐 · Agent ' + (view.agent.providerId || 'builtin.food'));
      addMessage(session, { role:'assistant', text:foodHead, at:nowTime(),
        agent: { providerId: view.agent.providerId, status: view.agent.status } });
      scrollBottom();
      busy = false;
      refreshSend();
      return;
    }

    if(view.refused){
      var why = (view.notices && view.notices.length) ? view.notices[0] : '没有给出原因';
      var refusedText = '编排层的 Agent 这次都没能给出结果（' + why + '）。可以稍后再问一次。';
      shell.bubble.textContent = refusedText;
      finishMeta(shell, 'Agent ' + (view.agent.providerId || '兜底') + ' · REFUSED');
      addMessage(session, { role:'assistant', text:refusedText, at:nowTime() });
      busy = false;
      refreshSend();
      return;
    }

    var head = headline(view, built.place.name);
    await typeText(shell.bubble, plainText(head));
    // 打完再换成排版好的文本：模型输出带粗体与列表，直接展示会露出 ** 和 -
    shell.bubble.innerHTML = formatRich(head);
    appendDraftBlocks(shell.body, view, { baseText: text });
    // 编排链路要能看到：谁处理的、有没有切兜底
    if(view.agent && view.agent.attempts.length > 1){
      var chain = el('div','warn');
      chain.style.marginTop = 'var(--sp-2)';
      chain.textContent = '编排层依次尝试 ' + view.agent.attempts.length + ' 个 Provider：' +
        view.agent.attempts.map(function(a){
          return a.providerId + '（' + a.status + (a.reason ? ' · ' + a.reason : '') + '）';
        }).join(' → ');
      shell.body.appendChild(chain);
    }
    var src = view.sources.length ? view.sources.join(' · ') : '景区知识库';
    if(built.place.note) src = built.place.note + ' · ' + src;
    if(view.agent && view.agent.providerId){
      src += ' · Agent ' + view.agent.providerId + (view.agent.status ? '（' + view.agent.status + '）' : '');
    }
    finishMeta(shell, src);

    addMessage(session, { role:'assistant', text:head, draft:view, at:nowTime(), baseText:text,
      agent: view.agent ? { providerId: view.agent.providerId, status: view.agent.status } : null });
    scrollBottom();
    busy = false;
    refreshSend();
  }

  /* ---------- 发送 ---------- */
  function refreshSend(){
    var has = input.value.trim().length > 0;
    sendBtn.disabled = !has || busy;
  }
  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 168) + 'px';
  }
  /** 统一入口：输入框发送、推荐卡、选项卡都走这里，行为不分叉。 */
  async function sendText(text, skipChoice, extra){
    text = String(text == null ? '' : text).trim();
    if(!text || busy) return;
    hideEmpty();
    // 新对话的第一条消息才真正落成会话，避免侧栏堆一串空条目
    var s = currentSession() || createSession();
    stream.appendChild(userMsg(text));
    addMessage(s, { role:'user', text:text, at:nowTime() });
    chatTitle.textContent = s.title;
    input.value = '';
    autoGrow();
    refreshSend();
    scrollBottom();
    await respond(s, text, skipChoice, extra);
  }
  function submit(){
    sendText(input.value);
  }

  /* ---------- 事件绑定 ---------- */
  sendBtn.addEventListener('click', submit);

  input.addEventListener('input', function(){ autoGrow(); refreshSend(); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      submit();
    }
  });

  // 推荐卡会随空状态重建，监听挂在容器上做委托，避免重建后失效
  stream.addEventListener('click', function(e){
    var btn = e.target.closest && e.target.closest('.suggest');
    if(!btn) return;
    input.value = btn.getAttribute('data-q') || '';
    autoGrow();
    refreshSend();
    submit();
  });

  /* ---------- 新对话：立刻在侧栏出现一条空条目，刷新可见 ---------- */
  newChat.addEventListener('click', function(){
    var cur = currentSession();
    if(!cur || cur.messages.length){
      createSession();
    }
    resetToEmpty();
    closeSidebar();
    input.focus();
  });

  function resetToEmpty(){
    stream.innerHTML = '';
    stream.appendChild(emptyState());
    empty = document.getElementById('empty');
    chatTitle.textContent = '新的对话';
    input.value = '';
    autoGrow();
    refreshSend();
    renderConvList();
  }

  /** 欢迎区；推荐卡只是快捷输入，点进去仍然真实请求后端。 */
  function emptyState(){
    var d = el('div','empty');
    d.id = 'empty';
    d.innerHTML =
      '<div class="mark-lg" aria-hidden="true">旅</div>'+
      '<h1>今天想去哪儿？</h1>'+
      '<p>告诉我要去哪座城市或省份、玩几天。我会检索景区知识库的候选，按天给出草案；票价与开放时间没有可靠来源时，直接标「未知」。</p>'+
      '<div class="suggests" id="suggests">'+
        '<button class="suggest" type="button" data-q="云南 5 天行程，第一次去"><b>云南 5 天</b><span>按省份检索候选，逐日排草案</span></button>'+
        '<button class="suggest" type="button" data-q="武汉周末两天怎么玩"><b>武汉两日游</b><span>黄鹤楼、东湖与省博物馆</span></button>'+
        '<button class="suggest" type="button" data-q="杭州两天，预算 1500，两个人"><b>带预算问</b><span>附预算与人数，触发超支检查</span></button>'+
        '<button class="suggest" type="button" data-q="成都三天，带老人小孩，节奏慢一点"><b>定制节奏</b><span>偏好会影响候选排序与补问</span></button>'+
      '</div>';
    return d;
  }

  /* ---------- 侧栏会话列表 ---------- */
  function renderConvList(){
    convList.innerHTML = '';
    sessions.forEach(function(s){
      var row = el('div','conv-row');

      var btn = el('button','conv');
      btn.type = 'button';
      if(s.id === currentId) btn.classList.add('active');
      var ico = el('span','ico');
      ico.textContent = '▸';
      var txt = el('span','txt');
      txt.textContent = s.title || '新的对话';
      btn.appendChild(ico);
      btn.appendChild(txt);
      btn.addEventListener('click', function(){ openSession(s.id); });

      var del = el('button','conv-del');
      del.type = 'button';
      del.textContent = '×';
      del.title = '删除这条对话';
      del.setAttribute('aria-label', '删除对话：' + (s.title || '新的对话'));
      del.addEventListener('click', function(ev){
        ev.stopPropagation();
        removeSession(s.id);
      });

      row.appendChild(btn);
      row.appendChild(del);
      convList.appendChild(row);
    });
    convEmpty.style.display = sessions.length ? 'none' : 'block';
  }

  /** 打开历史会话：静态回放，不再请求后端。 */
  function openSession(id){
    var s = null;
    for(var i=0;i<sessions.length;i++){ if(sessions[i].id === id) s = sessions[i]; }
    if(!s) return;

    currentId = id;
    chatTitle.textContent = s.title || '新的对话';
    empty = null;
    stream.innerHTML = '';

    s.messages.forEach(function(m){
      if(m.role === 'user'){
        var um = userMsg(m.text);
        um.style.animation = 'none';
        stream.appendChild(um);
      } else {
        var shell = assistantShell();
        shell.wrap.style.animation = 'none';
        shell.bubble.innerHTML = formatRich(m.text);
        if(m.kind === 'choice' && m.choice){
          // 回放也重建可点的卡片：历史会话里继续补选仍然能生成行程
          var replayOpts = choiceCard(m.choice.base, m.choice.place, null);
          replayOpts.style.marginTop = 'var(--sp-2)';
          shell.body.appendChild(replayOpts);
        } else if(m.kind === 'dest' && m.alts && m.alts.length){
          // 未识别时的城市候选同样保留，历史里点一下就能换目的地
          var replayDest = destCard(m.alts, '');
          replayDest.style.marginTop = 'var(--sp-2)';
          shell.body.appendChild(replayDest);
        } else {
          // Agent 回复里的天气/景点卡可以原样重建，行程卡走精简草案
          (m.cards || []).forEach(function(card){
            var node = paintCard(card, m.baseText || m.text);
            if(node){
              node.style.marginTop = 'var(--sp-2)';
              shell.body.appendChild(node);
            }
          });
          appendDraftBlocks(shell.body, m.draft, { baseText: m.baseText || m.text });
        }
        var meta = el('div','msg-meta');
        // 回放也标出当时是哪个 Provider 处理的，链路可追溯
        var replay = (m.at || '') + ' · 历史记录';
        if(m.agent && m.agent.providerId){
          replay += ' · Agent ' + m.agent.providerId + (m.agent.status ? '（' + m.agent.status + '）' : '');
        }
        meta.appendChild(document.createTextNode(replay));
        meta.appendChild(copyBtn(shell.bubble));
        shell.body.appendChild(meta);
        stream.appendChild(shell.wrap);
      }
    });

    if(!s.messages.length) resetToEmpty();
    // 没有状态的历史会话：从消息里捡回最后一次提到的城市，下一句省略时还能接上
    if(!s.state){
      var picked = null;
      s.messages.forEach(function(m){
        if(m && m.role === 'user' && m.text){
          var hit = pickPlaceStatic(m.text);
          if(hit && hit.name) picked = hit.name;
        }
      });
      if(picked) saveState(s, { city:picked });
    }
    renderConvList();
    closeSidebar();
    scrollBottom();
  }

  /* 移动端侧栏 */
  function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
  function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
  menuBtn.addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);

  /* ---------- 会话：未登录回登录页，登录后显示用户名 ---------- */
  var whoName   = document.getElementById('whoName');
  var logoutBtn = document.getElementById('logoutBtn');

  fetch('/api/account/me', { credentials: 'same-origin' })
    .then(function (res) {
      if (res.status === 401) {
        location.replace('/?next=' + encodeURIComponent(location.pathname));
        return null;
      }
      return res.ok ? res.json() : null;
    })
    .then(function (u) {
      if (u && u.username) whoName.textContent = u.username;
    })
    .catch(function () { /* 服务未就绪时先停在本页，避免跳转循环 */ });

  logoutBtn.addEventListener('click', function () {
    logoutBtn.disabled = true;
    logoutBtn.textContent = '退出中…';
    fetch('/api/logout', { method: 'POST', credentials: 'same-origin' })
      .catch(function () { /* 会话已失效也照常回登录页 */ })
      .then(function () { location.replace('/'); });
  });

  /* 初始 */
  renderConvList();
  autoGrow();
  refreshSend();
  input.focus();
})();
</script>
</body>
