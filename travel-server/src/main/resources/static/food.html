<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>旅行助手 · 美食推荐</title>
<meta name="description" content="美食推荐（Agent FOOD_RECOMMEND）：餐馆列表、评分人均、距离标签、AI 建议卡。" />
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="components.css" />
<script>
(function () {
  try {
    var t = localStorage.getItem('travel.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* 忽略 */ }
})();
</script>
<style>
/* 灵感层特色菜：百度 Agent Plan 语义检索 → 模型整理成菜名，与对话口径一致 */
.dish-hints{padding:11px 13px;margin:10px 0 14px;background:var(--clay-soft);
  border:1px solid #E4C4AE;border-radius:var(--r-card)}
.dish-h-t{font-size:var(--fs-xs);font-weight:600;color:var(--clay);margin-bottom:7px}
.dish-h-list{display:flex;gap:6px;flex-wrap:wrap}
.dish-h-chip{font-size:var(--fs-xs);padding:3px 10px;border-radius:var(--r-pill);
  background:var(--surface);border:1px solid var(--line-strong);color:var(--text-2)}
</style>
</head>
<body>
<header class="app-topbar">
  <a class="back" href="/planner.html" title="返回工作台" aria-label="返回工作台">‹</a>
  <h1>美食推荐</h1>
  <span class="sub" id="locLabel">实时检索</span>
  <span class="sp"></span>
  <button class="iconbtn" type="button" id="themeBtn" title="外观：跟随系统" aria-label="切换外观">
    <svg class="ico" id="themeIcon"><use href="#i-moon"/></svg>
  </button>
</header>

<main class="app-wrap">
  <div class="food-head">
    <h2>想吃这一口</h2>
    <span class="sp"></span>
    <span class="loc">城市或景点 · 实时检索</span>
  </div>
  <form class="set-row" id="askForm" style="background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:6px">
    <svg class="ico" aria-hidden="true"><use href="#i-ai"/></svg>
    <input class="field" id="askInput" style="margin:0;flex:1" placeholder="例如：武当山 / 杭州" autocomplete="off" />
    <button class="btn btn-primary btn-sm" type="submit" id="askBtn">找吃的</button>
  </form>
  <p class="notice-bar" id="askNote" style="margin-top:8px">输入城市或景点后点「找吃的」。餐馆、评分、人均、距离都来自美食 Agent 实时检索；没查到就留空，不编造店名。</p>

  <div id="advice"></div>
  <div class="food-grid" id="restList"></div>
</main>

<svg id="glyphDefs" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
<symbol id="i-bowl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 H20 a8 8 0 0 1 -16 0 Z"/><path d="M8 4 C8 6 6 6 6 8 M12 3 C12 5 10 5 10 7.5 M16 4 C16 6 14 6 14 8" opacity=".6"/></symbol>
<symbol id="i-ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17.5 L8 10 L6.5 6.5 L12 8.5 L17 4.5"/><path d="M3.5 20.5 H20.5"/><circle cx="17" cy="4.5" r="2.2" fill="currentColor" stroke="none"/><path d="M17 12.5 L20.5 9" opacity=".55"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3.5 H18 A2 2 0 0 1 20 5.5 V14 L14 20.5 H5.5 A2 2 0 0 1 3.5 18.5 V5.5 A2 2 0 0 1 4.5 3.5 Z"/><path d="M6.5 15 L10 9 L9 12 L14 13 L17 8"/><circle cx="17" cy="8" r="1.7" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12 A8.5 8.5 0 1 1 12 3.5 A8.5 8.5 0 0 1 20.5 12 Z"/><circle cx="12" cy="12" r="3.4"/><path d="M12 2 V3.7 M12 20.3 V22 M2 12 H3.7 M20.3 12 H22 M5.4 5.4 L6.6 6.6 M17.4 17.4 L18.6 18.6 M18.6 5.4 L17.4 6.6 M6.6 17.4 L5.4 18.6" opacity=".7"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.8 3.6 A8.7 8.7 0 1 0 20.3 15.4 A6.9 6.9 0 0 1 15.8 3.6 Z"/></symbol>
</svg>

<script src="mascot-widget.js?v=4.4"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 主题（与设置页同源） ---------- */
  var THEME_KEY = 'travel.theme';
  var ORDER = ['auto', 'light', 'dark'];
  function currentTheme() {
    try { var t = localStorage.getItem(THEME_KEY); return ORDER.indexOf(t) >= 0 ? t : 'auto'; }
    catch (e) { return 'auto'; }
  }
  function paintIcon(mode) {
    var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var use = $('themeIcon').firstChild;
    if (use && use.setAttribute) use.setAttribute('href', '#' + (dark ? 'i-sun' : 'i-moon'));
    $('themeBtn').title = '外观：' + (mode === 'auto' ? '跟随系统' : (mode === 'light' ? '浅色' : '深色'));
  }
  function applyTheme(mode) {
    if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* 忽略 */ }
    paintIcon(mode);
  }
  applyTheme(currentTheme());
  $('themeBtn').addEventListener('click', function () {
    applyTheme(ORDER[(ORDER.indexOf(currentTheme()) + 1) % ORDER.length]);
  });

  /* ---------- 美食推荐：真实接口，无数据空占位，不编造店名 ----------
     ① /api/attractions?city= 取一条带坐标系的真实景点作锚点；
     ② /api/agent/invoke(FOOD_RECOMMEND, {city, anchor}) 取契约信封；
     ③ 只渲染 result.facts 里 category=FOOD 的条目。 */
  function stars(r) {
    var full = Math.max(0, Math.min(5, Math.round(Number(r) || 0)));
    return '★★★★★'.slice(0, full) + '☆☆☆☆☆'.slice(0, 5 - full);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clear() { $('advice').innerHTML = ''; $('restList').innerHTML = ''; }
  function render(result, city) {
    clear();
    if (result.advice) {
      $('advice').innerHTML = '<div class="who"><svg class="ico"><use href="#i-bowl"/></svg>旅行助手 · 美食建议</div>' + esc(result.advice);
    }
    var all = (result.facts || []).filter(function (f) {
      return f && f.type === 'CONTENT' && f.value && f.value.category === 'FOOD';
    });
    var facts = [], hints = [], hintSource = '';
    all.forEach(function (f) {
      if (f.value.kind === 'DISH_HINT') {
        if (Array.isArray(f.value.names)) {
          hints = f.value.names.slice(0, 8);
          hintSource = String(f.value.source || '');
        }
        return;
      }
      facts.push(f);
    });
    if (hints.length) {
      var label = hintSource === 'BAIDU_AGENT_PLAN' ? '百度地图 Agent Plan 灵感层' : '通用资料线索';
      var box = document.createElement('div');
      box.className = 'dish-hints';
      box.innerHTML = '<div class="dish-h-t">当地特色 · 来自' + esc(label) + '</div>' +
        '<div class="dish-h-list">' + hints.map(function (n) {
          return '<span class="dish-h-chip">' + esc(n) + '</span>';
        }).join('') + '</div>';
      $('advice').appendChild(box);
    }
    var list = $('restList');
    facts.forEach(function (f) {
      var v = f.value;
      var verified = String((f.evidence || {}).verificationStatus || '') === 'verified';
      var stTag = verified ? '<span class="st st-verified">已核验</span>' : '<span class="st st-pending">待核</span>';
      var rec = v.locality === 'LOCAL' ? '<span class="tag">本地口味</span>' : '';
      var rating = v.rating != null ? stars(v.rating) + ' <span class="rating">' + Number(v.rating).toFixed(1) + '</span>' : '评分未提供';
      var price = v.pricePerPersonCny != null ? '人均 ¥' + esc(v.pricePerPersonCny) : '人均未提供';
      var dist = v.distanceMeters != null ? '距参考点约 ' + Math.round(v.distanceMeters) + ' 米' : '距离未提供';
      var card = document.createElement('div');
      card.className = 'rest';
      card.innerHTML =
        '<div class="rh"><span class="nm">' + esc(v.name || '未命名') + '</span><span class="sp"></span>' + rec + '</div>' +
        '<div class="rb">' +
          '<div class="row"><span class="star">' + rating + '</span> · ' + price + ' · ' + esc(dist) + '</div>' +
          (v.openHours ? '<div class="row">营业 ' + esc(v.openHours) + '</div>' : '') +
          ((v.source || v.queriedAt) ? '<div class="row">' + (v.source ? '来源 ' + esc(v.source) : '') + (v.queriedAt ? ' · ' + esc(v.queriedAt) : '') + '</div>' : '') +
          '<div class="tag-row">' + (v.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + stTag + '</div>' +
        '</div>';
      list.appendChild(card);
    });
    return facts.length;
  }
  $('askForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var q = $('askInput').value.trim();
    if (!q) return;
    var note = $('askNote');
    note.textContent = '正在检索「' + q + '」附近的餐馆…';
    note.style.color = '';
    clear();
    $('askBtn').disabled = true;
    try {
      async function anchorBy(key) {
        return await fetch('/api/attractions?limit=1&' + key + '=' + encodeURIComponent(q),
          { credentials: 'same-origin' })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); });
      }
      var anchorRes = await anchorBy('city');
      var a0 = anchorRes && anchorRes.items && anchorRes.items[0];
      if (!a0) {
        var byName = await anchorBy('name');
        a0 = byName && byName.items && byName.items[0];
      }
      if (!a0 || a0.lat == null || a0.lon == null || !a0.coordinateSystem) {
        note.style.color = 'var(--err)';
        note.textContent = '知识库里没有「' + q + '」的可用坐标锚点；未默认按城市中心检索，也没有编造餐馆。可换个收录的城市试试。';
        return;
      }
      var city = a0.city || q.replace(/景区|风景名胜区|市$/g, '');
      var d = await fetch('/api/agent/invoke', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ intent: 'FOOD_RECOMMEND', context: {
          city: city, includeInspiration: true,
          anchor: { lat: a0.lat, lon: a0.lon, coordinateSystem: a0.coordinateSystem,
            source: 'KB', referenceName: a0.name }
        } })
      }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); });
      var result = (d && d.result) || {};
      if (result.status === 'REFUSED') {
        note.style.color = 'var(--err)';
        note.textContent = '本次未返回餐馆（' + ((result.unknownFields || []).join('、') || (result.advice || '条件不足')) + '）。未编造店名或价格。';
        return;
      }
      var n = render(result, city);
      if (!n) {
        note.style.color = 'var(--err)';
        note.textContent = '本次没有找到可展示的餐馆。未编造店名或价格。';
        if ((result.notices || []).length) note.textContent += ' ' + result.notices.join(' ');
        return;
      }
      $('locLabel').textContent = city;
      note.style.color = '';
      note.textContent = '已返回 ' + n + ' 家餐馆；人均与营业状态出行前请再核实。' +
        ((result.notices || []).length ? ' ' + result.notices.join(' ') : '');
    } catch (err) {
      note.style.color = 'var(--err)';
      note.textContent = '检索失败：' + (err && err.message ? err.message : '未知错误') + '。未展示任何编造数据。';
    } finally {
      $('askBtn').disabled = false;
    }
  });
})();
</script>
</body>
</html>
