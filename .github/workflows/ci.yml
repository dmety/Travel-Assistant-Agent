name: CI

# 交付门禁流水线（P2）：在干净环境跑 tools/gate.sh —— 分片/索引一致性、知识库治理、
# Agent G0 静态准入、Maven 全量测试与 JaCoCo 覆盖率、真实服务 acceptance 验收。
# 不注入任何密钥：AMAP/DeepSeek/Baidu 留空走降级与本地桩，与本地无 .env 的门禁口径一致。
on:
  push:
    branches: [main, zipei]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run full delivery gate
        env:
          PYTHON: python3
          MVN: mvn
        run: bash tools/gate.sh