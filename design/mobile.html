<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>旅行助手 · 手机端</title>
<meta name="description" content="旅行助手移动端：全屏 AI 规划对话、草案确认、列表与地图双模式、候选协作。" />
<link rel="stylesheet" href="tokens.css" />
<style>
.board {
  display: flex; flex-wrap: wrap; gap: 40px 32px;
  padding: 40px 32px 80px; max-width: 1400px; margin: 0 auto;
  align-items: flex-start;
}
.unit { margin: 0; }
.phone {
  width: 375px; height: 812px; position: relative; overflow: hidden;
  background: var(--bg); border: 1px solid var(--line-strong);
  border-radius: var(--r-lg); box-shadow: var(--shadow-2);
  transition: box-shadow 160ms linear;
}
.phone.is-linked { box-shadow: 0 0 0 3px var(--pine-line), var(--shadow-2); }
.screen { height: 100%; display: flex; flex-direction: column; }
figcaption { margin-top: 8px; font-size: 11px; color: var(--text-3); text-align: center; }

.appbar {
  height: 52px; flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
  padding: 0 16px; background: var(--surface-warm); border-bottom: 1px solid var(--line);
}
.appbar h2 { font-size: var(--fs-md); }
.appbar .sp { margin-left: auto; }
.appbar .back { font-size: var(--fs-sm); color: var(--text-3); }
.scroll { flex: 1; overflow-y: auto; padding: 12px; }
.scroll::-webkit-scrollbar { width: 4px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 2px; }
.foot {
  flex: 0 0 auto; padding: 10px 12px 14px;
  background: var(--surface-warm); border-top: 1px solid var(--line);
}
.foot .btn { width: 100%; }
.foot .row { display: flex; gap: 8px; }
.foot .row .btn { flex: 1; }

/* 底部导航：中间 + 是唯一主入口 */
.tabbar {
  height: 56px; flex: 0 0 auto; position: relative;
  display: flex; align-items: center; justify-content: space-around;
  background: var(--surface-warm); border-top: 1px solid var(--line);
}
.tabbar .t { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--text-3); min-width: 52px; }
.tabbar .t[aria-current="page"] { color: var(--pine); font-weight: var(--w-strong); }
.tabbar .t .ico { font-size: 16px; line-height: 1; }
.plus {
  width: 46px; height: 46px; margin-top: -24px;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--pine); color: #fff; font-size: 24px;
  border: 3px solid var(--surface-warm); box-shadow: var(--shadow-2);
}
.plus:hover { background: var(--pine-hover); }

.blk { margin-bottom: 12px; }
.blk-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 8px 2px; font-size: var(--fs-xs); color: var(--text-3); }
.mini { font-size: var(--fs-xs); color: var(--text-3); }
.trip-item { padding: 12px; margin-bottom: 8px; }
.trip-item h3 { font-size: var(--fs-md); }
.trip-item .meta { font-size: var(--fs-xs); color: var(--text-3); margin-top: 4px; }
.trip-item .row2 { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

/* ---------- 全屏 AI 对话 ---------- */
.tripbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--pine-soft);
  border-bottom: 1px solid var(--pine-line); font-size: var(--fs-xs); color: var(--pine-hover);
}
.tripbar b { font-weight: var(--w-strong); }
.tripbar .sp { margin-left: auto; }
.thread { flex: 1; overflow-y: auto; padding: 14px 12px; }
.msg { margin-bottom: 14px; }
.msg-me { text-align: right; }
.msg-me .bubble {
  display: inline-block; text-align: left; max-width: 86%;
  padding: 10px 12px; background: var(--pine); color: #fff;
  border-radius: var(--r-card) var(--r-card) var(--r-sm) var(--r-card);
  font-size: var(--fs-sm); line-height: 1.7;
}
.msg-ai .who { font-size: var(--fs-xs); color: var(--text-3); margin-bottom: 5px; }
.msg-ai .bubble {
  padding: 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-card) var(--r-card) var(--r-card) var(--r-sm);
  font-size: var(--fs-sm); line-height: 1.75; color: var(--text-2);
  box-shadow: var(--shadow-1);
}
.draft-mini { margin-top: 10px; padding: 10px; border-radius: var(--r-ctl); background: var(--pine-soft); border: 1px solid var(--pine-line); }
.draft-mini .r { display: flex; justify-content: space-between; font-size: var(--fs-xs); padding: 3px 0; }
.draft-mini .r b { color: var(--pine-hover); }
.qa { margin-top: 12px; }
.qa .lbl { margin-bottom: 6px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.quick .chip { min-height: 28px; font-size: var(--fs-xs); padding: 0 10px; }
.composer {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 10px 12px 14px; background: var(--surface-warm);
  border-top: 1px solid var(--line);
}
.composer input {
  flex: 1; min-height: 38px; padding: 8px 12px;
  background: var(--surface); border: 1px solid var(--field-line);
  border-radius: var(--r-pill); font-size: var(--fs-sm); outline: none;
}
.composer input:focus { border-color: var(--clay); }
.send {
  width: 38px; height: 38px; flex: 0 0 auto; display: grid; place-items: center;
  border-radius: 50%; background: var(--pine); color: #fff; font-size: var(--fs-md);
}

/* ---------- 草案 / 行程 ---------- */
.advice { font-size: var(--fs-sm); color: var(--text-2); padding: 2px 2px 10px; line-height: 1.75; }
.day-card { margin-bottom: 8px; overflow: hidden; }
.check-stack { display: flex; flex-direction: column; gap: 6px; }
.check { cursor: pointer; }
.peek {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: var(--pine-soft); border-top: 1px solid var(--pine-line); font-size: var(--fs-xs);
}
.peek b { color: var(--pine-hover); }
.peek .sp { margin-left: auto; }
.map-wrap { position: relative; flex: 1; overflow: hidden; }
.map-real { position: absolute; inset: 0; z-index: 2; }
.map-bg { position: absolute; inset: 0; }
.pin-sm { width: 26px; height: 26px; font-size: 11px; }

/* ---------- 抽屉 / 弹层 ---------- */
.sheet-mask { position: absolute; inset: 0; z-index: 20; display: none; background: rgba(32, 36, 30, .3); }
.sheet-mask.open { display: block; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--surface-warm); border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 16px 16px 22px; box-shadow: var(--shadow-3);
}
.sheet h3 { font-size: var(--fs-md); margin-bottom: 4px; }
.sheet .opt {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px 4px; border-bottom: 1px solid var(--line); text-align: left; font-size: var(--fs-sm);
}
.sheet .opt:last-of-type { border-bottom: 0; }
.sheet .opt .badge {
  width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center;
  border-radius: var(--r-ctl); background: var(--pine-soft); color: var(--pine); font-size: var(--fs-sm);
}
.sheet .opt small { display: block; font-size: var(--fs-xs); color: var(--text-3); }
.toast {
  position: absolute; z-index: 30; left: 50%; bottom: 76px; transform: translateX(-50%);
  padding: 8px 14px; background: var(--ink-warm); color: var(--paper);
  border-radius: var(--r-ctl); font-size: var(--fs-xs); white-space: nowrap;
  opacity: 0; transition: opacity 160ms linear; pointer-events: none;
}
.toast.show { opacity: 1; }
.kv { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.kv:last-child { border-bottom: 0; }
.kv .v { font-weight: var(--w-strong); }
.vote-row { display: flex; gap: 6px; margin-top: 8px; }
.cand { padding: 12px; margin-bottom: 8px; }
.cand .top { display: flex; align-items: center; gap: 8px; }
.cand .meta { font-size: var(--fs-xs); color: var(--text-3); margin-top: 4px; }
.pool { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.pool .sp { margin-left: auto; }


/* 02 AI 对话：上半地图 + 下半对话面板 */
.ai-map { flex: 0 0 292px; position: relative; overflow: hidden; background: var(--paper-2); }
.ai-map > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-pill {
  position: absolute; z-index: 4; left: 50%; top: 10px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; padding: 4px 12px;
  background: rgba(252,250,245,.95); border: 1px solid var(--line);
  border-radius: var(--r-pill); font-size: var(--fs-xs); box-shadow: var(--shadow-1);
}
.daytag {
  position: absolute; z-index: 3; padding: 1px 6px;
  font-size: 10px; color: var(--pine-hover); background: var(--pine-soft);
  border: 1px solid var(--pine-line); border-radius: var(--r-sm);
}
.ai-sheet {
  flex: 1; min-height: 0; position: relative; z-index: 5; margin-top: -14px;
  display: flex; flex-direction: column;
  background: var(--surface-warm); border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: 0 -6px 20px rgba(46,42,32,.10); padding: 0 14px 10px;
}
.ai-sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 8px auto 6px; flex: 0 0 auto; }
.query-bar {
  display: flex; align-items: center; gap: 8px; flex: 0 0 auto; margin-bottom: 6px;
  padding: 7px 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-pill); font-size: var(--fs-sm);
}
.query-bar .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.query-bar .x { color: var(--text-3); font-size: var(--fs-md); }
.think { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: var(--fs-xs); color: var(--text-3); }
.remind { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); }
.remind b { font-size: var(--fs-sm); color: var(--ink); }
.remind ol { margin: 5px 0 0; padding-left: 17px; list-style: decimal; font-size: var(--fs-xs); line-height: 1.75; color: var(--text-2); }
.source { margin-top: 8px; }
.source-body { margin-top: 5px; padding: 7px 9px; background: var(--surface-2); border-radius: var(--r-ctl); font-size: var(--fs-xs); color: var(--text-3); line-height: 1.6; }
.followup { text-align: right; margin: 2px 0 10px; }
.followup span {
  display: inline-block; padding: 7px 11px; background: var(--pine); color: #fff;
  border-radius: var(--r-card) var(--r-card) var(--r-sm) var(--r-card); font-size: var(--fs-sm);
}
.ai-sheet .thread { padding: 6px 2px 8px 0; }
.ai-sheet .msg-ai .bubble { padding: 11px; font-size: var(--fs-sm); line-height: 1.7; }
.ai-sheet .composer { padding: 8px 0 0; }
.ai-sheet .foot { padding: 8px 0 2px; border-top: 0; }
/* 追问后地图同步重排：路线重绘 + DAY 标签脉冲，不跳离当前页 */
.ai-map.is-rerouting .route { animation: reroute 900ms ease both; }
.ai-map.is-rerouting .daytag { animation: tagpulse 900ms ease both; }
@keyframes reroute {
  0%   { opacity: .2; stroke-dashoffset: 0; }
  45%  { opacity: 1;  stroke-dashoffset: 22; }
  100% { opacity: .85; stroke-dashoffset: 0; }
}
@keyframes tagpulse {
  0%, 100% { background: var(--pine-soft); color: var(--pine-hover); }
  40%      { background: var(--clay-soft); color: var(--clay); }
}

@media (max-width: 900px) { .board { padding: 24px 12px; gap: 32px; } }
/* 窄屏直接看设计展示板时，手机框跟着视口收，不再产生横向滚动 */
@media (max-width: 640px) {
  .board { padding: 20px 12px 60px; gap: 28px; }
  .unit { width: 100%; max-width: 375px; }
  .phone { width: 100%; max-width: 375px; }
}

/* 图标化后的控件微调：返回与新建按钮保持 20px 触点内图形 */
.back svg.ico, .plus svg.ico { width: 20px; height: 20px; }
</style>
</head>

  <!-- 05 行程详情 · 地图 -->
  <figure class="unit" id="step5">

      <header class="appbar"><span class="back"><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg></span><h2>武当山四日</h2><span class="sp mini">4 个点位</span></header>
      <div class="tabs" role="tablist">
        <button type="button" aria-selected="false" data-mode="list">列表</button>
        <button type="button" aria-selected="true" data-mode="map">地图</button>
        <button type="button" aria-selected="false" data-mode="cal">日历</button>
      </div>
      <div class="map-wrap">
        <div id="map-mobile" class="map-real"></div>
        <svg class="map-bg" viewBox="0 0 375 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="375" height="620" fill="#EFEAE0" />
          <g stroke="#DED7C9" stroke-width="1">
            <path d="M0 80h375M0 160h375M0 240h375M0 320h375M0 400h375M0 480h375M0 560h375" />
            <path d="M60 0v620M130 0v620M200 0v620M270 0v620M340 0v620" />
          </g>
          <g fill="none" stroke="#C4BAA6" stroke-width="2" stroke-dasharray="5 6">
            <path d="M92 470C128 410 150 350 186 300s54-90 82-130" />
            <path d="M186 300c34 30 56 66 76 96" />
          </g>
          <text x="20" y="596" font-size="11" fill="#8A8577">未配置 AK · 示意底图</text>
        </svg>
        <button class="pin pin-sm" data-spot="1" style="left:78px;top:452px" type="button"><span>1</span></button>
        <button class="pin pin-sm is-verified" data-spot="2" style="left:112px;top:392px" type="button"><span>2</span></button>
        <button class="pin pin-sm" data-spot="3" style="left:176px;top:286px" type="button"><span>3</span></button>
        <button class="pin pin-sm" data-spot="4" style="left:250px;top:180px" type="button"><span>4</span></button>
        <button class="pin pin-sm" data-spot="5" style="left:252px;top:386px" type="button"><span>5</span></button>
        <div class="map-legend"><span><i style="background:var(--pine)"></i>待核验</span><span><i style="background:var(--ok)"></i>已核验</span><span id="map-mode-mobile">示意底图</span></div>
      </div>
      <div class="peek" id="peek5"><b>选中：玉虚宫</b><span>已核验 · 步行 15 分钟</span><span class="sp"><button class="btn btn-quiet btn-sm" type="button" data-mode="list">看列表 <svg class="ico" aria-hidden="true"><use href="#i-list"/></svg></button></span></div>
      <nav class="tabbar" aria-label="主导航">
        <span class="t" aria-current="page"><svg class="ico" aria-hidden="true"><use href="#i-list"/></svg>行程</span><span class="t"><svg class="ico" aria-hidden="true"><use href="#i-candidate"/></svg>待规划</span>
        <button class="plus" type="button" data-sheet="open" aria-label="新建行程"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <span class="t"><svg class="ico" aria-hidden="true"><use href="#i-ai"/></svg>消息</span><span class="t"><svg class="ico" aria-hidden="true"><use href="#i-collab"/></svg>我的</span>
      </nav>
    </div>
    <div class="toast" id="toast5"></div></div>
    <figcaption>05 地图模式</figcaption>
  </figure>

  <!-- 06 待定与协作：底部滑出抽屉 -->
  <figure class="unit" id="step6">
    <div class="phone"><div class="screen">
      <header class="appbar"><h2>武当山四日</h2><span class="sp mini">行程已保存</span></header>
      <div class="scroll">
        <div class="card" style="padding:14px;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px"><h3>今天要处理</h3><span class="st st-pending">1 项</span></div>
          <div class="kv" style="margin-top:8px"><span>第 2 天下午候选</span><span class="v">2 : 2 平票</span></div>
          <div class="kv"><span>票价待核</span><span class="v" style="color:var(--warn)">2 处</span></div>
          <div class="vote-row"><button class="btn btn-primary btn-sm" type="button" data-sheet="open">打开待定抽屉</button></div>
        </div>
        <div class="blk-title"><span>行程概览</span><span>同一份数据</span></div>
        <div class="card" style="padding:14px">
          <div class="kv"><span>逐日安排</span><span class="v">3 天 / 5 个点位</span></div>
          <div class="kv"><span>成员</span><span class="v">3 人</span></div>
          <div class="kv"><span>费用合计（仅已核验）</span><span class="v">¥1,740</span></div>
          <div class="kv"><span>时间冲突</span><span class="v" style="color:var(--ok)">0 项</span></div>
        </div>
        <div class="blk-title" style="margin-top:14px"><span>随时能改</span></div>
        <div class="panel" style="padding:12px">
          <p class="mini">跟 AI 说一句「下雨了，改成室内路线」就能当场重排；删掉一个点位，后续行程会自动顺延。信息从头到尾不用来回搬运。</p>
          <div class="vote-row"><button class="btn btn-outline btn-sm" type="button" data-next="2">回 AI 对话</button><button class="btn btn-quiet btn-sm" type="button">导出行程单</button></div>
        </div>
      </div>
      <nav class="tabbar" aria-label="主导航">
        <span class="t" aria-current="page"><svg class="ico" aria-hidden="true"><use href="#i-list"/></svg>行程</span><span class="t"><svg class="ico" aria-hidden="true"><use href="#i-candidate"/></svg>待规划</span>
        <button class="plus" type="button" data-sheet="open" aria-label="新建行程"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <span class="t"><svg class="ico" aria-hidden="true"><use href="#i-ai"/></svg>消息</span><span class="t"><svg class="ico" aria-hidden="true"><use href="#i-collab"/></svg>我的</span>
      </nav>
    </div>
    <div class="sheet-mask" id="sheet6"><div class="sheet" style="max-height:74%;overflow-y:auto">
      <h3>待你定</h3><p class="mini" style="margin-bottom:10px">并列时系统不替你决定，需要成员自己定</p>
      <div class="blk-title"><span>第 2 天下午 · 2 个候选</span><span id="tally6">2 : 2 并列</span></div>
      <div class="card cand">
        <div class="top"><b>南岩宫</b><span class="st st-pending">并列</span></div>
        <p class="meta">悬空栈道 · 步行 40 分钟 · guest_b 提出</p>
        <div class="kv"><span>支持 <b id="vA6">2</b> · 反对 0 · 弃权 1</span><span class="mini">已投可改票</span></div>
        <div class="vote-row"><button class="btn btn-primary btn-sm" type="button" data-vote="a">支持</button><button class="btn btn-outline btn-sm" type="button" data-vote="a-no">反对</button><button class="btn btn-quiet btn-sm" type="button" data-vote="a-del">撤回</button></div>
      </div>
      <div class="card cand">
        <div class="top"><b>紫霄宫</b><span class="st st-pending">并列</span></div>
        <p class="meta">道教建筑群 · 台阶平缓 · master 提出</p>
        <div class="kv"><span>支持 <b id="vB6">2</b> · 反对 0 · 弃权 1</span><span class="mini">已投可改票</span></div>
        <div class="vote-row"><button class="btn btn-outline btn-sm" type="button" data-vote="b">支持</button><button class="btn btn-outline btn-sm" type="button" data-vote="b-no">反对</button></div>
      </div>
      <div class="blk-title"><span>待规划地点</span></div>
      <div class="panel" style="padding:4px 12px">
        <div class="pool"><span>太子坡</span><span class="sp"><button class="btn btn-quiet btn-sm" type="button" data-add="第 1 天">加入第 1 天</button></span></div>
        <div class="pool"><span>琼台三观</span><span class="sp"><button class="btn btn-quiet btn-sm" type="button" data-add="第 3 天">加入第 3 天</button></span></div>
      </div>
    </div></div>
    <div class="toast" id="toast6"></div></div>
    <figcaption>06 待定与协作</figcaption>
  </figure>

</main>

<script>
(function () {
  'use strict';
  var NAMES = { 1:'十堰东站', 2:'玉虚宫', 3:'索道上行 · 金顶', 4:'南岩宫 或 紫霄宫', 5:'紫霄宫' };
  var STATE = { 1:'已出票', 2:'已核验 · 步行 15 分钟', 3:'票价未知 · 3 小时', 4:'待投票', 5:'票价未知' };
  var current = '2';

  function toast(n, msg) {
    var el = document.getElementById('toast' + n);
    if (!el) return;
    el.textContent = msg; el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  /* 一处选中，列表与地图同步；切视图不重置上下文 */
  function selectSpot(id) {
    current = id;
    document.querySelectorAll('[data-spot]').forEach(function (el) {
      el.classList.toggle('is-active', el.getAttribute('data-spot') === id);
    });
    ['peek4', 'peek5'].forEach(function (pid) {
      var p = document.getElementById(pid);
      if (!p) return;
      p.querySelector('b').textContent = '选中：' + NAMES[id];
      p.querySelector('span').textContent = STATE[id];
    });
  }
  document.querySelectorAll('[data-spot]').forEach(function (el) {
    el.addEventListener('click', function () { selectSpot(el.getAttribute('data-spot')); });
  });
  selectSpot(current);

  /* 底部弹层 */
  document.querySelectorAll('[data-sheet="open"]').forEach(function (b) {
    b.addEventListener('click', function () {
      var m = b.closest('.phone').querySelector('.sheet-mask');
      if (m) m.classList.add('open');
    });
  });
  document.querySelectorAll('.sheet-mask').forEach(function (m) {
    m.addEventListener('click', function (e) { if (e.target === m) m.classList.remove('open'); });
  });

  /* 流程跳转：同一份数据在页面间的连续状态 */
  document.querySelectorAll('[data-next]').forEach(function (b) {
    b.addEventListener('click', function () {
      var n = b.getAttribute('data-next');
      var target = document.getElementById('step' + n);
      var phone = b.closest('.phone');
      var mask = phone && phone.querySelector('.sheet-mask');
      if (mask) mask.classList.remove('open');
      if (target) {
        var p = target.querySelector('.phone');
        p.classList.add('is-linked');
        target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        setTimeout(function () { p.classList.remove('is-linked'); }, 2200);
      }
      if (n === '3') toast(2, '草案已生成（未写库）');
      if (n === '4' && b.id === 'saveBtn') {
        b.textContent = '已保存到行程'; b.disabled = true;
        toast(3, '已创建行程并写入每日安排');
      }
    });
  });

  /* 追问后：地图留在上半屏，路线就地重绘，DAY 2 标记减量 */
  var rerouteCount2 = 0;
  function rerouteMap2() {
    var mp = document.getElementById('aiMap2');
    if (!mp) return;
    rerouteCount2 += 1;
    var main = document.getElementById('routeMain2');
    var branch = document.getElementById('routeBranch2');
    if (main) main.setAttribute('d', rerouteCount2 % 2
      ? 'M78 250C108 214 132 176 160 140s44-52 66-74'
      : 'M78 250C104 208 126 166 158 128s48-58 70-80');
    if (branch) branch.setAttribute('d', rerouteCount2 % 2
      ? 'M160 140c24 26 44 50 62 68'
      : 'M158 128c28 22 48 48 68 66');
    var tag = mp.querySelector('.daytag[data-day="2"]');
    if (tag) tag.textContent = 'DAY 2 · 4km（已减量）';
    var meta = document.getElementById('mapPillMeta2');
    if (meta) meta.textContent = '· 路线已重排';
    mp.classList.remove('is-rerouting'); void mp.offsetWidth; mp.classList.add('is-rerouting');
    setTimeout(function () { mp.classList.remove('is-rerouting'); }, 950);
  }

  /* AI 对话：发送 / 快捷建议都追加到同一条会话 */
  function appendUser(text) {
    var th = document.getElementById('thread2');
    if (!th) return;
    var fu = document.createElement('div');
    fu.className = 'followup';
    fu.innerHTML = '<span></span>';
    fu.querySelector('span').textContent = text;
    th.appendChild(fu);
    var think = document.createElement('div');
    think.className = 'think';
    think.innerHTML = '<svg class="ico" aria-hidden="true"><use href="#i-think"/></svg><span>深度思考完成（AI 生成）</span>';
    th.appendChild(think);
    var ai = document.createElement('div');
    ai.className = 'msg msg-ai';
    ai.innerHTML = '<div class="bubble"><p></p></div>';
    ai.querySelector('p').textContent = '收到，已按「' + text + '」重排：地图路线同步更新，候选不足的天仍留空，不补景点、不改已锁定的点位。';
    th.appendChild(ai);
    th.scrollTop = th.scrollHeight;
    rerouteMap2();
    toast(2, '路线已重排（未写库）');
  }
  var qc2 = document.getElementById('queryClear2');
  if (qc2) qc2.addEventListener('click', function () {
    document.getElementById('queryText2').textContent = '说一句想去哪、几天、和谁、多少预算';
    toast(2, '已清除当前问题');
  });
  var sb2 = document.getElementById('sourceBtn2');
  if (sb2) sb2.addEventListener('click', function () {
    var b = document.getElementById('sourceBody2'); b.hidden = !b.hidden;
  });
  var mic2 = document.getElementById('mic2');
  if (mic2) mic2.addEventListener('click', function () { toast(2, '语音输入（演示占位，未接讯飞）'); });

  var send2 = document.getElementById('send2');
  var prompt2 = document.getElementById('prompt2');
  if (send2) send2.addEventListener('click', function () {
    var t = (prompt2.value || '').trim();
    if (!t) { toast(2, '先说一句，或点上面的建议'); return; }
    appendUser(t); prompt2.value = '';
  });
  if (prompt2) prompt2.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') send2.click();
  });
  document.querySelectorAll('[data-quick]').forEach(function (b) {
    b.addEventListener('click', function () { appendUser(b.dataset.quick); });
  });

  /* 补问 chips */
  document.querySelectorAll('.chip-group').forEach(function (g) {
    g.querySelectorAll('.chip').forEach(function (c) {
      c.addEventListener('click', function () {
        g.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        c.setAttribute('aria-pressed', 'true');
        toast(2, '已补：' + c.textContent.trim());
      });
    });
  });

  /* 检查项定位 + 折叠 */
  document.querySelectorAll('.check[data-jump]').forEach(function (c) {
    c.addEventListener('click', function () {
      var d = document.getElementById(c.dataset.jump);
      if (!d) return;
      d.scrollIntoView({ behavior: 'smooth', block: 'center' });
      d.style.boxShadow = '0 0 0 2px var(--pine-line)';
      setTimeout(function () { d.style.boxShadow = ''; }, 1600);
    });
  });
  var foldBtn = document.getElementById('foldBtn');
  if (foldBtn) foldBtn.addEventListener('click', function () {
    var rest = document.getElementById('foldRest');
    var open = rest.hidden;
    rest.hidden = !open;
    foldBtn.querySelector('span').textContent = open ? '收起检查提示' : '展开其余 2 项检查提示';
  });

  /* 列表 / 地图切换保留选中项 */
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.addEventListener('click', function () {
      var mode = b.dataset.mode;
      if (mode === 'cal') { toast(4, '日历视角：按日期查看全程'); return; }
      var target = document.getElementById('step' + (mode === 'map' ? '5' : '4'));
      if (target) {
        var p = target.querySelector('.phone');
        p.classList.add('is-linked');
        target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        setTimeout(function () { p.classList.remove('is-linked'); }, 1800);
      }
      selectSpot(current);
      toast(mode === 'map' ? 4 : 5, '已切换视图，选中项保持：' + NAMES[current]);
    });
  });

  /* 投票改票 */
  var a = 2, b2 = 2;
  function tally() {
    var l = document.getElementById('tally6');
    if (l) l.textContent = a + ' : ' + b2 + (a === b2 ? ' 并列' : (a > b2 ? ' 南岩领先' : ' 紫霄领先'));
  }
  document.querySelectorAll('[data-vote]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var k = btn.dataset.vote;
      if (k === 'a') { a += 1; toast(6, '已投「南岩宫 · 支持」'); }
      else if (k === 'a-del') { a = Math.max(0, a - 1); toast(6, '已撤回你的票'); }
      else if (k === 'a-no') toast(6, '已投「南岩宫 · 反对」');
      else if (k === 'b') { b2 += 1; toast(6, '已投「紫霄宫 · 支持」'); }
      else toast(6, '已投「紫霄宫 · 反对」');
      document.getElementById('vA6').textContent = a;
      document.getElementById('vB6').textContent = b2;
      tally();
    });
  });
  document.querySelectorAll('[data-add]').forEach(function (btn) {
    btn.addEventListener('click', function () { toast(6, '已加入' + btn.dataset.add + '，站间耗时已重算'); });
  });

  /* 百度地图 BMapGL：AK 从 window.BAIDU_MAP_AK 或 ?ak= 读取 */
  var params = new URLSearchParams(location.search);
  var AK = window.BAIDU_MAP_AK || params.get('ak') || '';
  var POINTS = [
    { lng: 111.0489, lat: 32.5471, tag: '1' }, { lng: 111.0043, lat: 32.4013, tag: '2' },
    { lng: 111.0247, lat: 32.4276, tag: '3' }, { lng: 111.0361, lat: 32.4510, tag: '4' }
  ];
  function initMap() {
    if (!window.BMapGL) return;
    var el = document.getElementById('map-mobile');
    if (!el) return;
    var map = new BMapGL.Map(el);
    map.centerAndZoom(new BMapGL.Point(111.026, 32.47), 12);
    map.enableScrollWheelZoom(false);
    POINTS.forEach(function (p) {
      var label = new BMapGL.Label(p.tag, {
        position: new BMapGL.Point(p.lng, p.lat), offset: new BMapGL.Size(-12, -12)
      });
      label.setStyle({
        width: '24px', height: '24px', lineHeight: '24px', borderRadius: '50%',
        background: '#1E4A3E', color: '#FCFAF5', border: '2px solid #FCFAF5',
        fontSize: '11px', textAlign: 'center', padding: '0'
      });
      map.addOverlay(label);
    });
    var badge = document.getElementById('map-mode-mobile');
    if (badge) badge.textContent = '实时地图';
  }
  if (!AK) {
    console.info('[地图] 未配置 AK，保留示意底图。可追加 ?ak=你的AK 或设置 window.BAIDU_MAP_AK。');
  } else {
    window.__initBaiduMap = initMap;
    var s = document.createElement('script');
    s.src = 'https://api.map.baidu.com/api?v=1.0&type=webgl&ak=' + encodeURIComponent(AK) + '&callback=__initBaiduMap';
    s.onerror = function () { console.warn('[地图] 脚本加载失败，保留示意底图。'); };
    document.head.appendChild(s);
  }
})();
</script>
