server:
  port: ${SERVER_PORT:8080}
  # 优雅停机：收到 SIGTERM 后先拒新请求、放行在途请求再退出，配合容器/反代滚动重启不丢请求。
  shutdown: graceful
  servlet:
    # 强制请求/响应 UTF-8：静态页面（含大量中文）与 JSON 响应都会带上 charset，
    # 避免客户端按 ISO-8859-1 解码导致乱码。
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        # 本地演示走 HTTP，默认 false 才能种上会话 Cookie；生产经 HTTPS 终止后必须置 true
        # （SESSION_COOKIE_SECURE=true），否则 Cookie 会随明文请求泄漏。见部署说明 P5。
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  application:
    name: travel-assistant
  lifecycle:
    # 优雅停机每阶段最长等待，超时强制退出；与 server.shutdown=graceful 配套。
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
travel:
  # 仅供本地模拟助手联调；精确授权一个 http://127.0.0.1:端口/路径，默认关闭。
  agent-local-mock-endpoint: ${TRAVEL_AGENT_LOCAL_MOCK_ENDPOINT:}
  data-directory: ${TRAVEL_DATA_DIR:./data}
  # 景点精简索引库（Python 离线构建产物，Java 只读加载，不覆盖）
  attraction-kb-path: ${ATTRACTION_KB_PATH:${travel.data-directory}/attractions_index.json}
  # 官方购票入口白名单（人工维护，只读）. 文件不存在即视为「没有经核验的入口」，
  # 系统不会因此生成任何猜测链接。
  ticket-rule-file: ${TICKET_RULE_FILE:${travel.data-directory}/ticket_rules.json}
  ticket-channel-file: ${TICKET_CHANNEL_FILE:${travel.data-directory}/ticket_channels.json}
  # Provider 管理端点独立令牌（F1）：reload/probe/shadow/activate/admission 只认此令牌，
  # 与用户注册/会话解耦。留空即 fail-closed，所有管理请求 403；生产经环境变量注入，勿写入仓库。
  agent:
    admin-token: ${AGENT_ADMIN_TOKEN:}
    # 单次 run 的调用预算（F11）：模型/工具调用次数上限，超时仍由契约 timeoutMs 边界切断。
    # 默认值与编排层既有行为一致（plan 1/4、vote 2/8），经环境变量可调，无需改码。
    budget:
      plan-max-model-calls: ${AGENT_PLAN_MAX_MODEL_CALLS:1}
      plan-max-tool-calls: ${AGENT_PLAN_MAX_TOOL_CALLS:4}
      vote-max-model-calls: ${AGENT_VOTE_MAX_MODEL_CALLS:2}
      vote-max-tool-calls: ${AGENT_VOTE_MAX_TOOL_CALLS:8}
  # 登录/注册速率限制（F7）：进程内滑动窗口，登录按账号+IP、注册按 IP 计数，超限返回 429。
  # 单实例内存方案，重启归零；多实例部署需换共享存储。置于反代后须先配置 forwarded headers 再按真实 IP 限流。
  rate-limit:
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MIN:8}
    register-per-minute: ${RATE_LIMIT_REGISTER_PER_MIN:20}
  # 高德 Web 服务密钥。留空则地点/天气/路线查询整体停用，接口返回 503 并说明原因；
  # 行程、景点、预算、协作等本地能力不受影响。
  amap:
    key: ${AMAP_KEY:${AMAP_API_KEY:}}
    timeout-ms: ${AMAP_TIMEOUT_MS:4000}
  # 百度地图第二数据源。控制台按 IP 白名单授权时无需 SN；AK 缺失时餐饮链路自动降级，
  # 不编造 POI。SK 仅供 Python 侧 SN 校验使用，Java 服务不读取。
  baidu:
    ak: ${BAIDU_AK:}
    timeout-ms: ${BAIDU_TIMEOUT_MS:4000}
  # DeepSeek 密钥。留空则 Agent 规划接口返回 503 并说明原因（工具层仍可独立测试）。
  ai:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    # 读超时。原值 20000 与 ChatAgent 自给的 45 秒总预算互相冲突：模型一旦想得久一点，
    # 单个请求就在 20 秒被取消，整条链路降级成规则兜底，用户看到的是「信息有限」。
    # 提到 60 秒，让单次调用走完再判失败；真要限时由 ChatAgent 的总预算兜。
    timeout-ms: ${DEEPSEEK_TIMEOUT_MS:60000}
    # 调用预算（max-tool-calls / max-model-calls）随 Agent Provider SPI 落地时再引入：
    # 此前该键在源码里零引用，留着只会让人误以为限流已生效。
