<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 616" width="1000" height="616" style="max-width:100%;height:auto" role="img" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>知识库目标分层架构</title>
<desc>三类输入源进入五层流水线：获取、比对、提案、闸门、应用发布；L0 契约层竖向贯穿所有层；底部是事实层接口、灵感层接口与门禁总线三个消费者。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="1000" height="616" fill="#f1f5f9"/>
<text x="40" y="30" font-size="13" fill="#475569">知识库分层架构 · 数据与契约分离</text>

<g>
<rect x="40" y="48" width="290" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="48" width="3" height="56" rx="1.5" fill="#2563eb"/>
<text x="58" y="70" font-size="13" font-weight="600" fill="#0f172a">官方与政府公告</text>
<text x="58" y="90" font-size="11" fill="#64748b">事实层唯一可写入源 · 人工导入</text>
</g>
<g>
<rect x="355" y="48" width="290" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="355" y="48" width="3" height="56" rx="1.5" fill="#2563eb"/>
<text x="373" y="70" font-size="13" font-weight="600" fill="#0f172a">高德 POI · OSM · Wikidata</text>
<text x="373" y="90" font-size="11" fill="#64748b">候选发现与事实补充 · 有限额</text>
</g>
<g>
<rect x="670" y="48" width="290" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="670" y="48" width="3" height="56" rx="1.5" fill="#16a34a"/>
<text x="688" y="70" font-size="13" font-weight="600" fill="#0f172a">Wikivoyage · 内容灵感层</text>
<text x="688" y="90" font-size="11" fill="#64748b">CC BY-SA 署名 · 不进入事实层</text>
</g>

<path d="M185 104 L185 124" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M500 104 L500 124" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M815 104 L815 124" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="40" y="124" width="76" height="388" rx="6" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/>
<text x="78" y="290" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">L0</text>
<text x="78" y="312" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">契约层</text>
<text x="78" y="334" font-size="11" fill="#475569" text-anchor="middle">贯穿各层</text>

<path d="M116 158 L132 158" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
<path d="M116 238 L132 238" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
<path d="M116 318 L132 318" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
<path d="M116 398 L132 398" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
<path d="M116 478 L132 478" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>

<g>
<rect x="132" y="124" width="828" height="68" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="132" y="124" width="4" height="68" rx="2" fill="#2563eb"/>
<text x="152" y="150" font-size="13" font-weight="600" fill="#2563eb">L1 获取层</text>
<text x="152" y="172" font-size="11" fill="#64748b">白名单源适配器</text>
<text x="340" y="163" font-size="12" fill="#0f172a">声明 license / rateLimit / writableFields，失败即降级</text>
<text x="700" y="163" font-size="11" fill="#475569" font-family="'SFMono-Regular', Consolas, monospace">sources/ 快照</text>
</g>
<g>
<rect x="132" y="204" width="828" height="68" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="132" y="204" width="4" height="68" rx="2" fill="#2563eb"/>
<text x="152" y="230" font-size="13" font-weight="600" fill="#2563eb">L2 比对层</text>
<text x="152" y="252" font-size="11" fill="#64748b">三路差异计算</text>
<text x="340" y="243" font-size="12" fill="#0f172a">字段级 · 治理级 · 发布级，每条差异保留旧值</text>
<text x="700" y="243" font-size="11" fill="#475569" font-family="'SFMono-Regular', Consolas, monospace">diff.json</text>
</g>
<g>
<rect x="132" y="284" width="828" height="68" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="132" y="284" width="4" height="68" rx="2" fill="#2563eb"/>
<text x="152" y="310" font-size="13" font-weight="600" fill="#2563eb">L3 提案层</text>
<text x="152" y="332" font-size="11" fill="#64748b">只读，零写入</text>
<text x="340" y="323" font-size="12" fill="#0f172a">结构化变更提案：字段、旧值、新值、理由、证据</text>
<text x="700" y="323" font-size="11" fill="#475569" font-family="'SFMono-Regular', Consolas, monospace">proposals.json</text>
</g>
<g>
<rect x="132" y="364" width="828" height="68" rx="6" fill="#dc2626" fill-opacity="0.04" stroke="#e2e8f0" stroke-width="1"/>
<rect x="132" y="364" width="4" height="68" rx="2" fill="#dc2626"/>
<text x="152" y="390" font-size="13" font-weight="600" fill="#dc2626">L4 闸门层</text>
<text x="152" y="412" font-size="11" fill="#64748b">唯一写入边界</text>
<text x="340" y="403" font-size="12" fill="#0f172a">证据门槛 · 身份三重校验 · CAS · 人工审核</text>
<text x="700" y="403" font-size="11" fill="#475569" font-family="'SFMono-Regular', Consolas, monospace">decisions.json</text>
</g>
<g>
<rect x="132" y="444" width="828" height="68" rx="6" fill="#16a34a" fill-opacity="0.04" stroke="#e2e8f0" stroke-width="1"/>
<rect x="132" y="444" width="4" height="68" rx="2" fill="#16a34a"/>
<text x="152" y="470" font-size="13" font-weight="600" fill="#16a34a">L5 应用发布层</text>
<text x="152" y="492" font-size="11" fill="#64748b">可回滚</text>
<text x="340" y="483" font-size="12" fill="#0f172a">原子写 · 备份 · 索引重建 · 门禁 · 周报归档</text>
<text x="700" y="483" font-size="11" fill="#475569" font-family="'SFMono-Regular', Consolas, monospace">audit.jsonl</text>
</g>

<path d="M185 512 L185 540" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M500 512 L500 540" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M815 512 L815 540" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="540" width="290" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="58" y="562" font-size="13" font-weight="600" fill="#0f172a">/api/attractions</text>
<text x="58" y="582" font-size="11" fill="#64748b">Java 只读事实层 · 不含灵感字段</text>
</g>
<g>
<rect x="355" y="540" width="290" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="373" y="562" font-size="13" font-weight="600" fill="#0f172a">内容灵感层</text>
<text x="373" y="582" font-size="11" fill="#64748b">独立 DTO · 不参与 verified 统计</text>
</g>
<g>
<rect x="670" y="540" width="290" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="688" y="562" font-size="13" font-weight="600" fill="#0f172a">门禁总线</text>
<text x="688" y="582" font-size="11" fill="#64748b">--check · --strict · gate.sh</text>
</g>
</svg>
