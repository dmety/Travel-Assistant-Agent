<rect x="40" y="608" width="580" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="608" width="4" height="64" rx="2" fill="#16a34a"/>
<text x="60" y="634" font-size="14" font-weight="600" fill="#0f172a">S6 周报与归档</text>
<text x="60" y="656" font-size="12" fill="#64748b">数字对比、欠账销项、提交</text>
<rect x="660" y="608" width="300" height="64" rx="6" fill="#16a34a" fill-opacity="0.04" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
<text x="678" y="646" font-size="12" fill="#475569" font-family="'SFMono-Regular', Consolas, monospace">report.md · Git 提交</text>
