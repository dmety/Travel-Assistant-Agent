# Explicit isolated MySQL lane: mvn -Dspring.profiles.active=mysql-business -Dtest=... test
# MYSQL_TEST_* must point to a dedicated disposable database, never the business database.
travel.persistence=mysql
travel.mysql.import-json=false
spring.datasource.url=${MYSQL_TEST_URL}
spring.datasource.username=${MYSQL_TEST_USER}
spring.datasource.password=${MYSQL_TEST_PASSWORD}
