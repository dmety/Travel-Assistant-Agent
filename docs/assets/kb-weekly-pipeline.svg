<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 692" width="1000" height="692" style="max-width:100%;height:auto" role="img" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>知识库周更流水线六阶段与审核闸门</title>
<desc>上半部为每周自动执行的只读巡检四阶段，中间是人工与证据审核闸门作为唯一写入边界，下半部为受控回写、重建验收与周报归档三阶段；右侧列出每个阶段的产物。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="1000" height="692" fill="#f1f5f9"/>
<text x="40" y="30" font-size="13" fill="#475569">周更流水线 · 自动巡检与受控写入</text>
<text x="660" y="30" font-size="12" fill="#64748b">阶段产物</text>

<g>
<rect x="40" y="48" width="580" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
