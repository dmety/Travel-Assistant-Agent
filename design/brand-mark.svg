<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-labelledby="t d">
  <title id="t">旅行助手</title>
  <desc id="d">一枚右下切角的刻石方印，三道等高线收成山峰，一条赤陶色折线山径穿过印面，末端落在切口内侧的实心落点。</desc>

  <!--
    品牌主标 · 唯一导出源
    ==================================================================
    色值来自 design/tokens.css 的 paper / pine / clay 三项：
      纸   #F7F4EE
      墨绿 #1E4A3E
      赤陶 #B4542A
    这里写字面值而非 CSS 变量，因为 favicon 与 PNG 导出时以 data-URI
    独立渲染，外部变量不会传进去。展示页 design/icon.html 里的
    变量版与此文件同源，改动须两处同步。
    XML 注释内不可出现双连字符，变量名一律省去前缀。

    记忆点：印框右下被 45 度切开；山径用一道纸色宽线把等高线「刻断」，
    形成负空间，末端落点正好停在切口内侧 —— 行程有起点，也留了出口。
  -->

  <defs>
    <!-- 纸色宽线：在等高线上刻出山径的槽，让两条线不相撞 -->
    <path id="ridge" d="M14 16 L22 24 L18 33 L30 38 L40 48"/>
  </defs>

  <!-- 印框：圆角方印，右下 45 度斜切 -->
  <path d="M15 3.5 H49 A11.5 11.5 0 0 1 60.5 15 V40 L40 60.5 H15 A11.5 11.5 0 0 1 3.5 49 V15 A11.5 11.5 0 0 1 15 3.5 Z"
        fill="#F7F4EE" stroke="#1E4A3E" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- 三道等高线：由外向内收拢，线宽与透明度递减 -->
  <g fill="none" stroke="#1E4A3E" stroke-linecap="round">
    <path d="M11 48 C14 32 22 21 31 21 C40 21 48 32 51 48" stroke-width="2.7"/>
    <path d="M18 48 C20 37 25 30 31 30 C37 30 42 37 44 48" stroke-width="2.2" opacity=".82"/>
    <path d="M25 48 C26 42 28 38 31 38 C34 38 36 42 37 48" stroke-width="1.8" opacity=".62"/>
  </g>

  <!-- 切口处的第二道刻线，强调「被切开」而非圆角矩形 -->
  <path d="M44.5 55.5 L55.5 44.5" fill="none" stroke="#1E4A3E" stroke-width="1.3" opacity=".45" stroke-linecap="round"/>

  <!-- 山径：先纸色刻槽，再赤陶细线 -->
  <use href="#ridge" fill="none" stroke="#F7F4EE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#ridge" fill="none" stroke="#B4542A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 起点：空心小环；终点：实心落点 + 纸色内点，与印框呼应 -->
  <circle cx="14" cy="16" r="2.5" fill="#F7F4EE" stroke="#B4542A" stroke-width="1.8"/>
  <circle cx="40" cy="48" r="4.6" fill="#B4542A"/>
  <circle cx="40" cy="48" r="1.6" fill="#F7F4EE"/>
</svg>
