<text x="60" y="74" font-size="14" font-weight="600" fill="#0f172a">S0 触发与基线</text>
<text x="60" y="96" font-size="12" fill="#64748b">周编号、源库哈希、上次 runId</text>
<rect x="660" y="48" width="300" height="64" rx="6" fill="#2563eb" fill-opacity="0.04" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
<text x="678" y="86" font-size="12" fill="#475569" font-family="'SFMono-Regular', Consolas, monospace">run.json + 基线快照</text>
</g>
<path d="M330 112 L330 128" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="128" width="580" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="128" width="4" height="64" rx="2" fill="#2563eb"/>
<text x="60" y="154" font-size="14" font-weight="600" fill="#0f172a">S1 多源获取</text>
<text x="60" y="176" font-size="12" fill="#64748b">白名单源、限速、失败即降级</text>
