<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" style="max-width:100%;height:auto" role="img" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>美食 Agent 附近数据获取链路</title>
<desc>三类锚点先统一到 GCJ-02 坐标系，再分别走在线高德周边检索与本地开放数据底账，两路结果合并去重并完成事实补全后进入 facts；底部标注配额、再分发与内容白名单约束。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="1000" height="520" fill="#f1f5f9"/>
<text x="40" y="30" font-size="13" fill="#475569">附近美食的数据获取链路 · 锚点到 facts</text>

<rect x="40" y="48" width="280" height="96" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="48" width="3" height="96" rx="1.5" fill="#2563eb"/>
<text x="58" y="74" font-size="13" font-weight="600" fill="#0f172a">当日景点 ID</text>
<text x="58" y="98" font-size="11" fill="#64748b">服务端读索引 lat / lon</text>
<text x="58" y="120" font-size="11" fill="#64748b">作为 ATTRACTION fact 下发</text>

<rect x="360" y="48" width="280" height="96" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="360" y="48" width="3" height="96" rx="1.5" fill="#2563eb"/>
<text x="378" y="74" font-size="13" font-weight="600" fill="#0f172a">用户给的地点</text>
<text x="378" y="98" font-size="11" fill="#64748b">geocode/geo 转坐标</text>
<text x="378" y="120" font-size="11" fill="#64748b">Java AmapClient 已实现</text>

<rect x="680" y="48" width="280" height="96" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="680" y="48" width="3" height="96" rx="1.5" fill="#64748b"/>
<text x="698" y="74" font-size="13" font-weight="600" fill="#0f172a">前端实时定位</text>
<text x="698" y="98" font-size="11" fill="#64748b">本期不做，列待决</text>
<text x="698" y="120" font-size="11" fill="#64748b">涉及隐私与权限</text>

<path d="M180 144 L180 168" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M500 144 L500 168" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M820 144 L820 168" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

<rect x="40" y="170" width="920" height="68" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="170" width="3" height="68" rx="1.5" fill="#16a34a"/>
<text x="58" y="196" font-size="13" font-weight="600" fill="#0f172a">坐标归一 · 统一到 GCJ-02</text>
<text x="58" y="220" font-size="11" fill="#64748b">tools/kb/models.py 已有转换函数；索引缺 coordinateSystem，是上线的硬前置。缺锚点请用户选，不按城市中心猜。</text>

<path d="M260 238 L260 268" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M740 238 L740 268" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="40" y="270" width="440" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="270" width="3" height="110" rx="1.5" fill="#2563eb"/>
<text x="58" y="296" font-size="13" font-weight="600" fill="#0f172a">在线 · 高德周边检索</text>
<text x="58" y="320" font-size="11" fill="#64748b">锚点坐标加用户选的半径，一次询问最多 1 次，不翻页</text>
<text x="58" y="344" font-size="11" fill="#64748b">key 未配、超时或配额耗尽时，只走离线并标 DEGRADED</text>
<text x="58" y="368" font-size="11" font-weight="600" fill="#2563eb">参数与配额待按官方文档核对</text>

<rect x="520" y="270" width="440" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="520" y="270" width="3" height="110" rx="1.5" fill="#16a34a"/>
<text x="538" y="296" font-size="13" font-weight="600" fill="#0f172a">本地底账 · 开放数据</text>
<text x="538" y="320" font-size="11" fill="#64748b">城市名菜、老字号、非遗，Haversine 算直线距离</text>
<text x="538" y="344" font-size="11" fill="#64748b">开放许可可本地存储，零配额，可离线复现</text>
<text x="538" y="368" font-size="11" font-weight="600" fill="#2563eb">无 key 时的兜底，只给本地性线索</text>

<path d="M260 380 L260 398" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M740 380 L740 398" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="40" y="400" width="920" height="52" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="58" y="423" font-size="13" font-weight="600" fill="#2563eb">合并去重 → 事实补全 → facts</text>
<text x="58" y="443" font-size="11" fill="#64748b">按 poiId 或名称加 50 m 内坐标去重；evidence 记 sourceKind / sourceId / fetchedAt，一律 unverified。</text>

<rect x="40" y="464" width="920" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="464" width="3" height="40" rx="1.5" fill="#64748b"/>
<text x="58" y="489" font-size="11" fill="#475569">直线距离不是步行时间 · 在线 POI 不落库 · 评分随 POI 返回 · UGC 站点不写采集器，评价由用户点外链查看。</text>
</svg>
