<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>旅行助手 · 登录</title>
<meta name="description" content="旅行助手：以地图为主屏规划行程，登录后进入行程工作台。" />
<link rel="icon" href="/favicon.ico" />
<script>
/* 主题先定后绘，避免首屏闪白 */
(function () {
  try {
    var t = localStorage.getItem('travel.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* 隐私模式忽略 */ }
})();
</script>
<!-- 登录 / 注册页 · 视觉令牌与工作台同源，图标由 tools/design_icons.py wire 注入。
     布局按 design/account.html 实现：左看板娘（浅暖底，无绿色背景）+ 右表单；看板娘正脸资产在 /mascot/（mascot-v4-front-*.png）。 -->
<style>
:root {
  color-scheme: light;
  --paper:#F7F4EE; --paper-2:#EFEAE0; --paper-3:#E7E0D2; --surface-warm:#FCFAF5;
  --ink:#20241E; --text-2:#4A4F46; --text-3:#6E6A5E; --muted-2:#8A8577;
  --line:#DED7C9; --line-strong:#C4BAA6; --field-line:#9C9282;
  --pine:#1E4A3E; --pine-hover:#163A30; --pine-soft:#E4EDE7; --pine-line:#BBD0C4;
  --pine-text:#1E4A3E;
  --clay:#B4542A; --clay-soft:#F6E8DF; --clay-line:#E3C4B1;
  --ok:#2E6B52; --ok-soft:#E7F0EA; --err:#A03A2C; --err-soft:#F8E7E3; --err-line:#E8C6BE;
  --warn:#9A6B1E; --warn-soft:#F7EEDD; --warn-line:#E6D3A8;
  --surface:#FFFFFF; --bg:var(--paper);
  --action-bg:var(--pine); --action-fg:#FFFFFF; --action-bg-hover:var(--pine-hover);
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:25px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px;
  --r-sm:3px; --r-ctl:6px; --r-card:10px; --r-lg:16px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(46,42,32,.06),0 1px 3px rgba(46,42,32,.05);
  --shadow-2:0 4px 14px rgba(46,42,32,.08),0 2px 4px rgba(46,42,32,.04);
  --shadow-3:0 18px 48px rgba(46,42,32,.12),0 6px 12px rgba(46,42,32,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --paper:#171A16; --paper-2:#1F231D; --paper-3:#262B23; --surface-warm:#1C2019;
  --ink:#E8E4D8; --text-2:#C6C1B2; --text-3:#9A9484; --muted-2:#7E7969;
  --line:#333A31; --line-strong:#47503F; --field-line:#5A6455;
  --pine:#4E8C72; --pine-hover:#5C9C81; --pine-soft:#22332C; --pine-line:#3E5C4F;
  --pine-text:#9ACDB4;
  --clay:#D9805A; --clay-soft:#33231B; --clay-line:#4E3628;
  --ok:#6FAF93; --ok-soft:#1F2E27; --err:#E08C7C; --err-soft:#33201C; --err-line:#4E302A;
  --warn:#D9B36B; --warn-soft:#2E2618; --warn-line:#4A3C22;
  --surface:#212620;
  --action-bg:#2F6B57; --action-fg:#F2F7F3; --action-bg-hover:#38795F;
  --shadow-1:0 1px 2px rgba(0,0,0,.42),0 1px 3px rgba(0,0,0,.34);
  --shadow-2:0 4px 14px rgba(0,0,0,.46),0 2px 4px rgba(0,0,0,.30);
  --shadow-3:0 18px 48px rgba(0,0,0,.56),0 6px 12px rgba(0,0,0,.36);
}
@media (prefers-color-scheme:dark) {
  html:not([data-theme="light"]) {
    color-scheme: dark;
    --paper:#171A16; --paper-2:#1F231D; --paper-3:#262B23; --surface-warm:#1C2019;
    --ink:#E8E4D8; --text-2:#C6C1B2; --text-3:#9A9484; --muted-2:#7E7969;
    --line:#333A31; --line-strong:#47503F; --field-line:#5A6455;
    --pine:#4E8C72; --pine-hover:#5C9C81; --pine-soft:#22332C; --pine-line:#3E5C4F;
    --pine-text:#9ACDB4;
    --clay:#D9805A; --clay-soft:#33231B; --clay-line:#4E3628;
    --ok:#6FAF93; --ok-soft:#1F2E27; --err:#E08C7C; --err-soft:#33201C; --err-line:#4E302A;
    --warn:#D9B36B; --warn-soft:#2E2618; --warn-line:#4A3C22;
    --surface:#212620;
    --action-bg:#2F6B57; --action-fg:#F2F7F3; --action-bg-hover:#38795F;
    --shadow-1:0 1px 2px rgba(0,0,0,.42),0 1px 3px rgba(0,0,0,.34);
    --shadow-2:0 4px 14px rgba(0,0,0,.46),0 2px 4px rgba(0,0,0,.30);
    --shadow-3:0 18px 48px rgba(0,0,0,.56),0 6px 12px rgba(0,0,0,.36);
  }
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:var(--fs-sm);line-height:1.7;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--pine-text);text-decoration:none} a:hover{text-decoration:underline}
svg{display:block;max-width:100%}
svg.ico{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex:0 0 auto;
  fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap}

/* ---------- 背景：等高线氛围层，不用图片 ---------- */
.atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.atmo svg{width:100%;height:100%;opacity:.5}
.atmo .grain{opacity:.55}

/* ---------- 顶栏：只留外观切换（品牌交给看板娘） ---------- */
.topbar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:18px 24px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-ctl);
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text-2);font-size:14px}
.iconbtn:hover{border-color:var(--pine);color:var(--pine-text)}

/* ---------- 主区：左右分栏，左看板娘右表单 ---------- */
main{position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:8px 20px 28px}
.auth{width:min(940px,100%);min-height:560px;display:grid;grid-template-columns:1fr 1fr;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-3);overflow:hidden}

/* 左：看板娘（浅暖底，无绿色背景） */
.auth-hero{position:relative;overflow:hidden;
  background:linear-gradient(158deg,var(--paper) 0%,var(--paper-2) 62%,var(--paper-3) 100%);color:var(--ink);
  padding:48px 44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.auth-hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(58% 46% at 30% 16%, rgba(180,84,42,.07), transparent 62%)}

.hero-mascot{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.hero-mascot .mascot-mount{width:230px;height:300px;flex:0 0 auto;cursor:pointer;
  filter:drop-shadow(0 16px 28px rgba(0,0,0,.20))}
.hero-mascot .mascot-cap{max-width:270px;padding:10px 18px;border-radius:var(--r-pill);
  border:1px solid var(--pine-line);background:rgba(30,74,62,.06);
  color:var(--pine);font-size:var(--fs-sm);line-height:1.65}

/* 看板娘组件（与 tokens.css / kanban.html 同源；类名契约 .look-user/.look-pass 不要改名） */
.mascot-svg{position:relative;display:block;width:100%;height:100%}
.mascot-svg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  transition:opacity .24s ease}
.mascot-svg .m-user,.mascot-svg .m-pass{opacity:0}
.mascot-svg.look-user .m-idle{opacity:0}
.mascot-svg.look-user .m-user{opacity:1}
.mascot-svg.look-pass .m-idle{opacity:0}
.mascot-svg.look-pass .m-pass{opacity:1}
@media (prefers-reduced-motion:no-preference){
  @keyframes mgBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes mgNod{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(4px) rotate(2deg)}70%{transform:translateY(-2px) rotate(-1deg)}100%{transform:translateY(0) rotate(0)}}
  .mascot-svg{animation:mgBreath 5.6s ease-in-out infinite}
  .mascot-svg.nod{animation:mgNod .55s cubic-bezier(.16,1,.3,1) both}
}
@media (prefers-reduced-motion:reduce){
  .mascot-svg,.mascot-svg img{animation:none!important;transition:none!important}
}

/* 右：表单 */
.auth-form{padding:48px 44px;display:flex;flex-direction:column}
.auth-form .tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:24px}
.auth-form .tabs button{padding:0 0 12px;font-size:var(--fs-md);color:var(--text-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;background:none}
.auth-form .tabs button[aria-selected="true"]{color:var(--pine);font-weight:600;border-bottom-color:var(--pine)}
.auth-form .tabs button:hover{color:var(--ink)}

form{display:none}
form.active{display:block}
.field{margin-bottom:14px}
.field label{display:block;font-size:var(--fs-xs);color:var(--text-3);margin-bottom:5px}
.field input{width:100%;height:40px;padding:0 12px;background:var(--surface);
  border:1px solid var(--field-line);border-radius:var(--r-ctl);outline:none;font-size:var(--fs-sm);
  transition:border-color .18s ease,box-shadow .18s ease}
.field input:focus{border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
.field input::placeholder{color:var(--muted-2)}
.field input[aria-invalid="true"]{border-color:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
.field .hint{display:block;font-size:11px;color:var(--text-3);margin-top:4px}
.pw{position:relative}
.pw input{padding-right:42px}
.pw .peek{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  min-width:42px;height:26px;padding:0 8px;border-radius:var(--r-ctl);
  color:var(--text-3);font-size:11px;line-height:26px}
.pw .peek:hover{color:var(--pine-text);background:var(--pine-soft)}

.submit{width:100%;min-height:42px;margin-top:6px;border-radius:var(--r-ctl);
  background:var(--action-bg);color:var(--action-fg);font-size:var(--fs-sm);font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .18s ease,box-shadow .18s ease;box-shadow:var(--shadow-1)}
.submit:hover{background:var(--action-bg-hover);transform:translateY(-2px);box-shadow:var(--shadow-2)}
.submit:active{transform:translateY(0)}
.submit:disabled{opacity:.6;cursor:not-allowed;transform:none}

.msg:empty{display:none}
.msg{min-height:0;margin:0 0 14px;font-size:var(--fs-xs);line-height:1.6;color:var(--text-3)}
.msg .bar{display:flex;gap:6px;align-items:flex-start;padding:9px 12px;border-radius:var(--r-ctl);
  border:1px solid var(--line);background:var(--paper-2)}
.msg.err .bar{border-color:var(--err-line);background:var(--err-soft);color:var(--err)}
.msg.ok .bar{border-color:var(--pine-line);background:var(--ok-soft);color:var(--ok)}
.msg .bar svg{margin-top:2px}

.notice-bar{padding:9px 12px;border-radius:var(--r-ctl);background:var(--warn-soft);
  border:1px solid var(--warn-line);color:var(--warn);font-size:var(--fs-xs);margin-top:14px;line-height:1.6}
.alt{text-align:center;font-size:var(--fs-xs);color:var(--text-3);margin-top:16px}
.alt a{color:var(--pine)}

.foot{position:relative;z-index:1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:0 24px 20px;font-size:var(--fs-xs);color:var(--text-3)}
.foot .sep{flex:1}
.foot a{color:var(--text-3)}
.foot a:hover{color:var(--pine-text)}

@media (max-width:760px){
  .auth{grid-template-columns:1fr;min-height:0}
  .auth-hero{padding:40px 28px}
  .auth-form{padding:32px 28px 40px}
}
@media (max-width:520px){
  .topbar{padding:14px 16px}
  main{padding:4px 14px 24px}
  .foot{padding:0 16px 16px;gap:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>

    <path d="M5 9 L12 16 L19 9"/><path d="M9 4.5 H15" opacity=".5"/>

    <path d="M12 2 V3.7 M12 20.3 V22 M2 12 H3.7 M20.3 12 H22"/><path d="M5.4 5.4 L6.6 6.6 M17.4 17.4 L18.6 18.6 M18.6 5.4 L17.4 6.6 M6.6 17.4 L5.4 18.6" opacity=".7"/>

<div class="atmo" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <g fill="none" stroke="var(--line-strong)" stroke-width="1.1" opacity=".55">
      <path d="M-60 760 C220 650 320 780 560 660 S900 470 1160 570 S1400 720 1510 560"/>
      <path d="M-60 700 C230 590 330 720 570 600 S910 410 1170 510 S1410 660 1510 500"/>
      <path d="M-60 640 C240 530 340 660 580 540 S920 350 1180 450 S1420 600 1510 440"/>
      <path d="M-60 300 C200 210 380 340 620 240 S980 140 1220 240 S1440 340 1510 240"/>

    <g fill="none" stroke="var(--pine)" stroke-width="1" opacity=".16">
      <path d="M120 60 C300 140 420 40 600 130 S900 250 1100 130 S1340 90 1440 160"/>

<header class="topbar">
  <div class="right">
    <button class="iconbtn" type="button" id="themeBtn" title="外观：跟随系统" aria-label="切换外观">
      <svg class="ico" id="themeIcon"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="auth">
    <!-- 左：看板娘 -->
    <div class="auth-hero">
      <div class="hero-mascot">
        <span class="mascot-mount" id="mascotMount" role="img" aria-label="看板娘 游小满">
          <div class="mascot-svg" aria-hidden="true">
            <img class="m-idle" src="/mascot/mascot-v4-front-idle.png" alt="">
            <img class="m-user" src="/mascot/mascot-v4-front-idle.png" alt="">
            <img class="m-pass" src="/mascot/mascot-v4-front-shy.png" alt="">
          </div>
        </span>
        <div class="mascot-cap" id="mascotCap" aria-live="polite">嗨，我是小满。告诉我去哪儿、玩几天、和谁一起，剩下的我来排。</div>
      </div>
    </div>

    <!-- 右：表单 -->
    <div class="auth-form">
      <div class="tabs" role="tablist" aria-label="登录或注册">
        <button type="button" role="tab" id="tabLogin" aria-selected="true"
                aria-controls="loginForm" data-tab="login">登录</button>
        <button type="button" role="tab" id="tabRegister" aria-selected="false"
                aria-controls="registerForm" data-tab="register">注册</button>
      </div>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <form id="loginForm" class="active" aria-labelledby="tabLogin" novalidate>
        <div class="field">
          <label for="lUser">用户名</label>
          <input id="lUser" name="username" autocomplete="username" placeholder="输入用户名" required />
        </div>
        <div class="field pw">
          <label for="lPass">密码</label>
          <input id="lPass" name="password" type="password" autocomplete="current-password"
                 placeholder="输入密码" required />
          <button class="peek" type="button" data-peek="lPass" aria-pressed="false">显示</button>
        </div>
        <button class="submit" type="submit">登录</button>
      </form>

      <form id="registerForm" aria-labelledby="tabRegister" novalidate>
        <div class="field">
          <label for="rUser">用户名</label>
          <input id="rUser" name="username" autocomplete="username"
                 placeholder="3–32 位字母、数字或下划线" aria-describedby="rUserHint" required />
          <span class="hint" id="rUserHint">3–32 位，仅字母 / 数字 / 下划线</span>
        </div>
        <div class="field pw">
          <label for="rPass">密码</label>
          <input id="rPass" name="password" type="password" autocomplete="new-password"
                 placeholder="至少 8 位，含字母和数字" aria-describedby="rPassHint" required />
          <button class="peek" type="button" data-peek="rPass" aria-pressed="false">显示</button>
          <span class="hint" id="rPassHint">至少 8 位，且同时包含字母和数字</span>
        </div>
        <button class="submit" type="submit">注册并登录</button>
      </form>

      <div class="notice-bar">安全提示：登录每分钟最多 8 次，注册每分钟最多 20 次；超了会暂时拒绝请求，稍等再试。</div>
      <div class="alt">还没有账号？<a href="#" id="toRegister">立即注册</a></div>
    </div>
  </div>
</main>

<div class="foot">
  <span>本地演示环境 · 会话基于 JSESSIONID</span>
  <span class="sep"></span>
  <a href="/planner.html">行程工作台 →</a>
  <a href="/settings.html">设置 →</a>
  <a href="/food.html">美食 →</a>
  <a href="/api-console.html">接口测试台 →</a>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 主题：跟随系统 → 浅色 → 深色 ---------- */
  var THEME_KEY = 'travel.theme';
  var ORDER = ['auto', 'light', 'dark'];
  var TEXT = { auto: '跟随系统', light: '浅色', dark: '深色' };
  function current() {
    try { var t = localStorage.getItem(THEME_KEY); return ORDER.indexOf(t) >= 0 ? t : 'auto'; }
    catch (e) { return 'auto'; }
  }
  function paintIcon(mode) {
    var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches);
    var svg = $('themeIcon');
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#' + (dark ? 'i-sun' : 'i-moon'));
    svg.appendChild(use);
    $('themeBtn').title = '外观：' + TEXT[mode];
    $('themeBtn').setAttribute('aria-label', '外观：' + TEXT[mode] + '，点击切换');
  }
  function apply(mode) {
    if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* 忽略 */ }
    paintIcon(mode);
  }
  apply(current());
  $('themeBtn').addEventListener('click', function () {
    apply(ORDER[(ORDER.indexOf(current()) + 1) % ORDER.length]);
  });

  /* ---------- 看板娘：台词与三态表情（与 account.html / tokens.css 同源） ---------- */
  var CAP_IDLE = '嗨，我是小满。告诉我去哪儿、玩几天、和谁一起，剩下的我来排。';
  var CAP_USER = '名字记下了，下回我认得你。';
  var CAP_PASS = '我不看，你慢慢输。';
  var heroSvg = document.querySelector('.hero-mascot .mascot-svg');
  var capEl = $('mascotCap');
  function setMood(cls, text) {
    if (heroSvg) {
      heroSvg.classList.remove('look-user', 'look-pass');
      if (cls) heroSvg.classList.add(cls);
    }
    if (capEl) capEl.textContent = text;
  }
  function bindFormMood(form) {
    if (!form) return;
    var u = form.querySelector('input:not([type="password"])');
    var p = form.querySelector('input[type="password"]');
    if (!u || !p) return;
    function mood() {
      if (document.activeElement === p) setMood('look-pass', CAP_PASS);
      else if (document.activeElement === u) setMood('look-user', CAP_USER);
      else setMood(null, CAP_IDLE);
    }
    u.addEventListener('focus', mood); p.addEventListener('focus', mood);
    u.addEventListener('blur', mood); p.addEventListener('blur', mood);
    u.addEventListener('input', function () { setMood('look-user', CAP_USER); });
    p.addEventListener('input', function () { setMood('look-pass', CAP_PASS); });
  }
  bindFormMood($('loginForm'));
  bindFormMood($('registerForm'));
  // 被点一下点个头（设计约定：点击看板娘点头）
  var mount = $('mascotMount');
  if (mount && heroSvg) {
    mount.addEventListener('click', function () {
      heroSvg.classList.remove('nod');
      void heroSvg.getBoundingClientRect();
      heroSvg.classList.add('nod');
    });
    heroSvg.addEventListener('animationend', function (e) {
      if (e.animationName === 'mgNod') heroSvg.classList.remove('nod');
    });
  }

  /* ---------- 只接受同源站内相对路径：URL 解析后校验 origin，挡住 //、/\ 归一与外链 ---------- */
  function safeNext() {
    var v = new URLSearchParams(location.search).get('next');
    if (v && v.charAt(0) === '/') {
      try {
        var u = new URL(v, location.origin);
        if (u.origin === location.origin) return u.pathname + u.search + u.hash;
      } catch (e) { /* 非法 URL 落到默认页 */ }
    }
    return '/planner.html';
  }
  var NEXT = safeNext();

  /* ---------- 提示 ---------- */
  function clearMsg() { $('msg').className = 'msg'; $('msg').textContent = ''; }
  function show(text, kind) {
    var box = $('msg');
    box.className = 'msg ' + (kind || '');
    box.textContent = '';
    var bar = document.createElement('div');
    bar.className = 'bar';
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'ico');
    svg.setAttribute('aria-hidden', 'true');
    var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#' + (kind === 'err' ? 'i-warning' : (kind === 'ok' ? 'i-check' : 'i-think')));
    svg.appendChild(use);
    var span = document.createElement('span');
    span.textContent = text;
    bar.appendChild(svg);
    bar.appendChild(span);
    box.appendChild(bar);
  }
  function markInvalid(node, bad) { node.setAttribute('aria-invalid', bad ? 'true' : 'false'); }
  function lock(form, on, label) {
    var btn = form.querySelector('.submit');
    btn.disabled = on;
    btn.textContent = on ? label : (form.id === 'loginForm' ? '登录' : '注册并登录');
  }

  /* ---------- 选项卡 ---------- */
  function switchTab(name) {
    var isLogin = name !== 'register';
    $('loginForm').classList.toggle('active', isLogin);
    $('registerForm').classList.toggle('active', !isLogin);
    $('tabLogin').setAttribute('aria-selected', isLogin ? 'true' : 'false');
    $('tabRegister').setAttribute('aria-selected', isLogin ? 'false' : 'true');
    clearMsg();
    setMood(null, CAP_IDLE);
    $(isLogin ? 'lUser' : 'rUser').focus();
    try { history.replaceState(null, '', isLogin ? location.pathname + location.search
      : location.pathname + location.search + (location.search ? '&' : '?') + 'mode=register'); }
    catch (e) { /* file:// 忽略 */ }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
    b.addEventListener('click', function () { switchTab(b.dataset.tab); });
  });
  if ($('toRegister')) $('toRegister').addEventListener('click', function (e) { e.preventDefault(); switchTab('register'); });
  if (new URLSearchParams(location.search).get('mode') === 'register') switchTab('register');

  /* ---------- 密码可见性 ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('[data-peek]'), function (b) {
    b.addEventListener('click', function () {
      var input = $(b.dataset.peek);
      var open = input.type === 'password';
      input.type = open ? 'text' : 'password';
      b.textContent = open ? '隐藏' : '显示';
      b.setAttribute('aria-pressed', open ? 'true' : 'false');
      b.setAttribute('aria-label', open ? '隐藏密码' : '显示密码');
    });
  });

  /* ---------- 登录 ---------- */
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = $('lUser').value.trim();
    var p = $('lPass').value;
    markInvalid($('lUser'), !u);
    markInvalid($('lPass'), !p);
    if (!u || !p) { show('请填写用户名和密码', 'err'); return; }

    var form = e.currentTarget;
    lock(form, true, '登录中…');
    clearMsg();
    fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (d) {
        if (res.ok) {
          $('lPass').value = '';
          show('登录成功，正在进入…', 'ok');
          location.replace(NEXT);
          return;
        }
        lock(form, false);
        show('登录失败：' + (d.error || '用户名或密码错误'), 'err');
        markInvalid($('lPass'), true);
        $('lPass').select();
      });
    }).catch(function () {
      lock(form, false);
      show('网络异常，请确认服务已启动后重试', 'err');
    });
  });

  /* ---------- 注册（成功后自动登录） ---------- */
  $('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = $('rUser').value.trim();
    var p = $('rPass').value;
    markInvalid($('rUser'), !u);
    markInvalid($('rPass'), !p);
    if (!u || !p) { show('请填写用户名和密码', 'err'); return; }
    if (!/^[A-Za-z0-9_]{3,32}$/.test(u)) {
      markInvalid($('rUser'), true);
      show('用户名需 3–32 位，仅字母、数字或下划线', 'err');
      $('rUser').focus();
      return;
    }
    if (p.length < 8 || !/[A-Za-z]/.test(p) || !/[0-9]/.test(p)) {
      markInvalid($('rPass'), true);
      show('密码至少 8 位，且同时包含字母和数字', 'err');
      $('rPass').focus();
      return;
    }

    var form = e.currentTarget;
    lock(form, true, '注册中…');
    clearMsg();
    fetch('/api/account/register', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (d) {
        if (!res.ok) {
          lock(form, false);
          show('注册失败：' + (d.error || d.message || ('HTTP ' + res.status)), 'err');
          return;
        }
        return fetch('/api/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p)
        }).then(function (r2) {
          if (r2.ok) {
            show('注册成功，正在进入…', 'ok');
            location.replace(NEXT);
            return;
          }
          lock(form, false);
          switchTab('login');
          $('lUser').value = u;
          show('账号已创建，请直接登录', 'ok');
        });
      });
    }).catch(function () {
      lock(form, false);
      show('网络异常，请确认服务已启动后重试', 'err');
    });
  });

  /* ---------- 已登录就别停在登录页 ---------- */
  fetch('/api/account/me', { credentials: 'same-origin' })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (u) {
      if (u && u.username && !new URLSearchParams(location.search).get('stay')) {
        show('已登录为 ' + u.username + '，正在进入…', 'ok');
        location.replace(NEXT);
      }
    })
    .catch(function () { /* 服务未就绪时停在本页 */ });
})();
</script>
