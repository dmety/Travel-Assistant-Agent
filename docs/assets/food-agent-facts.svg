<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" style="max-width:100%;height:auto" role="img" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>美食 Agent 数据分层与证据绑定</title>
<desc>事实层、本地性层、灵感层、偏好层四类输入进入证据绑定；绑定后的结果分别落入 facts、advice、unknownFields；展示层的评分快照与评价外链只进 value，不进 facts 与 advice；底部标注未知值与 grounding 规则。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="#f1f5f9"/>
<text x="40" y="30" font-size="13" fill="#475569">数据分层与证据绑定</text>

<rect x="40" y="54" width="280" height="84" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="54" width="3" height="84" rx="1.5" fill="#2563eb"/>
<text x="58" y="80" font-size="13" font-weight="600" fill="#0f172a">事实层</text>
<text x="58" y="102" font-size="11" fill="#64748b">官方公示 · 商户公示 · 地图 POI</text>
<text x="58" y="124" font-size="11" fill="#64748b">带核验状态与抓取时间</text>

<rect x="40" y="154" width="280" height="84" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="154" width="3" height="84" rx="1.5" fill="#16a34a"/>
<text x="58" y="180" font-size="13" font-weight="600" fill="#0f172a">本地性层</text>
<text x="58" y="202" font-size="11" fill="#64748b">城市名菜 · 老字号 · 非遗</text>
<text x="58" y="224" font-size="11" fill="#64748b">开放许可可本地存储</text>

<rect x="40" y="254" width="280" height="84" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="254" width="3" height="84" rx="1.5" fill="#16a34a"/>
<text x="58" y="280" font-size="13" font-weight="600" fill="#0f172a">灵感层</text>
<text x="58" y="302" font-size="11" fill="#64748b">Wikivoyage 条目</text>
<text x="58" y="324" font-size="11" fill="#64748b">用户开启才召回，需署名</text>

<rect x="40" y="354" width="280" height="84" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="354" width="3" height="84" rx="1.5" fill="#64748b"/>
<text x="58" y="380" font-size="13" font-weight="600" fill="#0f172a">偏好层</text>
<text x="58" y="402" font-size="11" fill="#64748b">忌口 · 口味 · 筛选</text>
<text x="58" y="424" font-size="11" fill="#64748b">用户可改，不进 facts 与日志</text>

<path d="M320 96 L376 96" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M320 196 L376 196" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<path d="M320 296 L376 296" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<path d="M320 396 L376 396" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

<rect x="380" y="54" width="240" height="384" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="398" y="84" font-size="13" font-weight="600" fill="#2563eb">证据绑定</text>
<text x="398" y="106" font-size="11" fill="#64748b">每条 fact 必带</text>
<path d="M398 118 L602 118" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="398" y="144" font-size="11" fill="#0f172a" font-family="'SFMono-Regular', Consolas, monospace">sourceKind</text>
<text x="398" y="170" font-size="11" fill="#0f172a" font-family="'SFMono-Regular', Consolas, monospace">verificationStatus</text>
<text x="398" y="196" font-size="11" fill="#0f172a" font-family="'SFMono-Regular', Consolas, monospace">fetchedAt</text>
<path d="M398 214 L602 214" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="398" y="240" font-size="12" font-weight="600" fill="#0f172a">外部 facts</text>
<text x="398" y="262" font-size="11" fill="#64748b">一律 unverified</text>
<path d="M398 280 L602 280" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="398" y="306" font-size="12" font-weight="600" fill="#0f172a">本地性线索</text>
<text x="398" y="328" font-size="11" fill="#64748b">打标签，不作候选</text>
<path d="M398 346 L602 346" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="398" y="372" font-size="12" font-weight="600" fill="#0f172a">安全硬约束</text>
<text x="398" y="394" font-size="11" fill="#64748b">忌口命中整条剔除</text>
<text x="398" y="420" font-size="11" fill="#64748b">未知写「未知」，不猜</text>

<path d="M620 96 L676 96" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M620 196 L676 196" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M620 296 L676 296" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M620 396 L676 396" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="680" y="54" width="280" height="84" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="680" y="54" width="3" height="84" rx="1.5" fill="#2563eb"/>
<text x="698" y="80" font-size="13" font-weight="600" fill="#0f172a">facts</text>
<text x="698" y="102" font-size="11" fill="#64748b">候选与字段</text>
<text x="698" y="124" font-size="11" fill="#64748b">每条带 evidence</text>

<rect x="680" y="154" width="280" height="84" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="680" y="154" width="3" height="84" rx="1.5" fill="#2563eb"/>
<text x="698" y="180" font-size="13" font-weight="600" fill="#0f172a">advice</text>
<text x="698" y="202" font-size="11" fill="#64748b">纯文本，最多 2,000 字符</text>
<text x="698" y="224" font-size="11" fill="#64748b">只引用 facts 里的值</text>

<rect x="680" y="254" width="280" height="84" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="680" y="254" width="3" height="84" rx="1.5" fill="#2563eb"/>
<text x="698" y="280" font-size="13" font-weight="600" fill="#0f172a">unknownFields</text>
<text x="698" y="302" font-size="11" fill="#64748b">人均价格 · 营业时段 · 缺项</text>
<text x="698" y="324" font-size="11" fill="#64748b">未知写「未知」，不猜</text>

<rect x="680" y="354" width="280" height="84" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="680" y="354" width="3" height="84" rx="1.5" fill="#2563eb"/>
<text x="698" y="380" font-size="13" font-weight="600" fill="#0f172a">value · 展示层</text>
<text x="698" y="402" font-size="11" fill="#64748b">评分快照 · 评价外链</text>
<text x="698" y="424" font-size="11" fill="#64748b">不进 facts 与 advice</text>

<rect x="40" y="514" width="920" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="514" width="3" height="34" rx="1.5" fill="#64748b"/>
<text x="58" y="536" font-size="11" fill="#475569">实线进 facts，虚线只作线索；本地性层打标签不作候选；展示层只进 value，不进 facts 与 advice。S-03 与 S-05：未知不猜，advice 的值要能在 facts 找到。</text>
</svg>
