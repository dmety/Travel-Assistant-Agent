server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  application:
    name: travel-assistant
travel:
  data-directory: ${TRAVEL_DATA_DIR:./data}
# AI client is a library dependency; no external request is made at startup.
# DEEPSEEK_API_KEY and AMAP_API_KEY will be consumed by their adapters.
