<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" style="max-width:100%;height:auto" role="img" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>美食 Agent 接入位置与契约边界</title>
<desc>Java 编排层经 HTTP 契约边界调用独立的美食 Agent 进程；用户主动发起询问；进程只读四类数据源；评价平台外链由前端渲染，不经过 Provider；用户确认后的写库由前端走既有行程接口，Provider 不参与，也不默认勾选。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="1000" height="500" fill="#f1f5f9"/>
<text x="40" y="30" font-size="13" fill="#475569">美食 Agent 接入位置 · 契约边界</text>

<rect x="40" y="48" width="280" height="252" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="48" width="4" height="252" rx="2" fill="#2563eb"/>
<text x="58" y="76" font-size="13" font-weight="600" fill="#2563eb">Java 编排层</text>
<text x="58" y="96" font-size="11" fill="#64748b">服务端进程内</text>
<path d="M58 110 L302 110" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="58" y="134" font-size="12" font-weight="600" fill="#0f172a">AgentRegistry</text>
<text x="58" y="152" font-size="11" fill="#64748b">按 intent 解析 primary 与 fallback</text>
<text x="58" y="178" font-size="12" font-weight="600" fill="#0f172a">ContractValidator</text>
<text x="58" y="196" font-size="11" fill="#64748b">准入与运行期统一闸门</text>
<text x="58" y="222" font-size="12" font-weight="600" fill="#0f172a">HttpAgentAdapter</text>
<text x="58" y="240" font-size="11" fill="#64748b">出站、超时、体积与熔断</text>
<text x="58" y="266" font-size="12" font-weight="600" fill="#0f172a">统一信封</text>
<text x="58" y="284" font-size="11" fill="#64748b">AgentResult 与 AdmissionReport</text>

<rect x="360" y="48" width="280" height="252" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1" stroke-dasharray="5 4"/>
<text x="378" y="76" font-size="13" font-weight="600" fill="#2563eb">HTTP 契约边界</text>
<text x="378" y="96" font-size="11" fill="#64748b">不支持回调与长连接</text>
<path d="M378 110 L622 110" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="378" y="134" font-size="12" font-weight="600" fill="#0f172a" font-family="'SFMono-Regular', Consolas, monospace">POST /v1/invoke</text>
<text x="378" y="152" font-size="11" fill="#64748b">application/json; charset=UTF-8</text>
<text x="378" y="178" font-size="12" font-weight="600" fill="#0f172a" font-family="'SFMono-Regular', Consolas, monospace">GET /healthz</text>
<text x="378" y="196" font-size="11" fill="#64748b">可用性探测</text>
<text x="378" y="222" font-size="12" font-weight="600" fill="#0f172a">4,000 ms · 64 KiB</text>
<text x="378" y="240" font-size="11" fill="#64748b">超时硬切断，超限整体拒绝</text>
<text x="378" y="266" font-size="12" font-weight="600" fill="#0f172a" font-family="'SFMono-Regular', Consolas, monospace">sideEffect=NONE</text>
<text x="378" y="284" font-size="11" fill="#64748b">不写库、不下单、不发消息</text>

<rect x="680" y="48" width="280" height="252" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="680" y="48" width="4" height="252" rx="2" fill="#16a34a"/>
<text x="698" y="76" font-size="13" font-weight="600" fill="#0f172a">美食 Agent 进程</text>
<text x="698" y="96" font-size="11" fill="#64748b">Python，独立部署</text>
<path d="M698 110 L942 110" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="698" y="134" font-size="12" font-weight="600" fill="#0f172a">六阶段处理</text>
<text x="698" y="152" font-size="11" fill="#64748b">校验 → 召回 → 标注 → 装配</text>
<text x="698" y="178" font-size="12" font-weight="600" fill="#0f172a">本地开放数据底账</text>
<text x="698" y="196" font-size="11" fill="#64748b">本地性线索与来源一起加载</text>
<text x="698" y="222" font-size="12" font-weight="600" fill="#0f172a">只读调用</text>
<text x="698" y="240" font-size="11" fill="#64748b">不持有行程写权限</text>
<text x="698" y="266" font-size="12" font-weight="600" fill="#0f172a">返回合规响应</text>
<text x="698" y="284" font-size="11" fill="#64748b">facts 一律 unverified</text>

<path d="M322 174 L356 174" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M642 174 L676 174" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<text x="40" y="326" font-size="11" fill="#475569">只读数据源</text>
<path d="M820 300 L820 318" fill="none" stroke="#64748b" stroke-width="1.2"/>
<path d="M180 318 L820 318" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2"/>
<path d="M148 318 L148 332" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M383 318 L383 332" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M618 318 L618 332" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M853 318 L853 332" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="838" y="314" font-size="11" fill="#64748b">只读四类源</text>

<rect x="40" y="334" width="215" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="334" width="3" height="104" rx="1.5" fill="#2563eb"/>
<text x="58" y="360" font-size="13" font-weight="600" fill="#0f172a">事实层</text>
<text x="58" y="382" font-size="11" fill="#64748b">官方 · 商户 · 地图 POI</text>
<text x="58" y="402" font-size="11" fill="#64748b">带核验与抓取时间</text>

<rect x="275" y="334" width="215" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="275" y="334" width="3" height="104" rx="1.5" fill="#16a34a"/>
<text x="293" y="360" font-size="13" font-weight="600" fill="#0f172a">本地性层</text>
<text x="293" y="382" font-size="11" fill="#64748b">城市名菜 · 老字号 · 非遗</text>
<text x="293" y="402" font-size="11" fill="#64748b">开放许可可本地存储</text>

<rect x="510" y="334" width="215" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="510" y="334" width="3" height="104" rx="1.5" fill="#16a34a"/>
<text x="528" y="360" font-size="13" font-weight="600" fill="#0f172a">灵感层</text>
<text x="528" y="382" font-size="11" fill="#64748b">Wikivoyage 条目</text>
<text x="528" y="402" font-size="11" fill="#64748b">用户开启才召回，需署名</text>

<rect x="745" y="334" width="215" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="745" y="334" width="3" height="104" rx="1.5" fill="#64748b"/>
<text x="763" y="360" font-size="13" font-weight="600" fill="#0f172a">偏好层</text>
<text x="763" y="382" font-size="11" fill="#64748b">忌口 · 口味 · 筛选</text>
<text x="763" y="402" font-size="11" fill="#64748b">用户可改，不进 facts</text>

<rect x="40" y="452" width="920" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="452" width="3" height="36" rx="1.5" fill="#64748b"/>
<text x="58" y="475" font-size="11" fill="#475569">用户确认后前端走既有行程接口写库，Provider 不默认勾选；评价外链由前端渲染，不经过 Provider，不是第五类数据源。</text>
</svg>
