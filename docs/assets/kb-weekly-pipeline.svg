<g>
<rect x="40" y="208" width="580" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="208" width="4" height="64" rx="2" fill="#2563eb"/>
<text x="60" y="234" font-size="14" font-weight="600" fill="#0f172a">S2 三层比对</text>
<text x="60" y="256" font-size="12" fill="#64748b">字段级 · 治理级 · 发布级</text>
