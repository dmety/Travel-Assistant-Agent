<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>景区购票助手 · 旅行助手</title>
    <style>
      :root {
        color-scheme: light;

        /* 色彩系统：沿用本页既有绿色主题（#246d58 / #18322e / #586c66），只补齐刻度；
           没有套用测试台的蓝色系。§5.2 §1.5.3 */
        --ink: #18322e;
        --muted: #586c66;
        --green: #246d58;
        --green-50: #f3f8f4;
        --green-100: #e4f0e8;
        --green-200: #cfe2d6;
        --green-300: #a8c9b6;
        --green-600: #246d58;
        --green-700: #1b5545;
        --green-800: #143f34;
        --line: #d7e3dc;
        --border-strong: #6f8a7c; /* 白底 3.75:1，非文本对比度达 3:1 §5.6 */
        --focus: #8a5300; /* 白底 6.33:1 / 页底 5.80:1 §5.6 */
        --bg: #f3f6f0;
        --surface: #ffffff;
        --surface-subtle: #f3f8f4;
        --surface-disabled: #e8efe9;
        --warn-bg: #fff4e6;
        --warn-ink: #854417; /* 6.82:1，原值合格，保留 */

        /* 字级：项目无刻度，回退到书后默认（Tailwind）刻度，只取本页用到的档 §4.1 */
        --fs-xs: 12px;
        --fs-sm: 14px;
        --fs-base: 16px;
        --fs-md: 18px;
        --fs-lg: 20px;
        --fs-xl: 30px;

        /* 间距：4/8/12/16/24/32/48，相邻档差 ≥25% §3.2.1 */
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 24px;
        --sp-6: 32px;
        --sp-7: 48px;

        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --radius-pill: 999px;

        /* 光自上而下；五级高程中本页只用三级，按 z 位置分配 §6.1.1 §6.2.1 */
        --shadow-sm: 0 1px 2px rgba(24, 50, 46, 0.1);
        --shadow-md:
          0 1px 2px rgba(24, 50, 46, 0.06),
          0 8px 20px -8px rgba(24, 50, 46, 0.16);
        --shadow-lg: 0 24px 48px -12px rgba(16, 38, 32, 0.3);
        --shadow-inset: inset 0 1px 2px rgba(24, 50, 46, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: var(--fs-base);
        line-height: 1.65;
      }
      header,
      main {
        max-width: 1120px;
        margin: auto;
        padding: var(--sp-5);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--sp-4);
        flex-wrap: wrap; /* §3.3.1 小屏顶栏换行而非挤压 */
        border-bottom: 1px solid var(--line);
      }
      a {
        color: var(--green-600);
        text-underline-offset: 3px;
      }
      a:hover {
        color: var(--green-700);
      }
      header a {
        font-size: var(--fs-sm);
        font-weight: 600;
      }
      h1 {
        font-size: var(--fs-xl);
        line-height: 1.2; /* §4.5.2 大标题收紧行高 */
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: var(--sp-2) 0;
      }
      h2 {
        font-size: var(--fs-lg);
        line-height: 1.35;
        font-weight: 600;
        margin: 0 0 var(--sp-4);
      }
      h3 {
        font-size: var(--fs-md); /* §2.6 结果区 h3 不再继承浏览器默认值 */
        line-height: 1.4;
        font-weight: 600;
        margin: var(--sp-4) 0 var(--sp-2);
      }
      p {
        margin: var(--sp-2) 0;
      }
      .muted,
      small {
        color: var(--muted);
      }
      main > p.muted {
        max-width: 68ch; /* §4.3 行宽 */
        line-height: 1.7;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        background: var(--green-100);
        color: var(--ink);
        padding: 6px var(--sp-3);
        border-radius: var(--radius-pill);
        font-size: var(--fs-xs);
        font-weight: 600;
      }
      .warning {
        color: var(--warn-ink);
        background: var(--warn-bg);
        border-left: 3px solid var(--warn-ink); /* §8.2 警示加语义 accent */
        padding: var(--sp-3) var(--sp-4);
        border-radius: var(--radius-sm);
        font-size: var(--fs-sm);
        line-height: 1.6;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--sp-6); /* 外 32 > 卡内 24 §3.6 */
        align-items: start; /* 右侧短卡不再被拉到与左侧等高 §3.3 */
        margin-top: var(--sp-5);
      }
      .card {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: var(--sp-5);
        box-shadow: var(--shadow-md); /* 用高程代替边框，避免 border+阴影+底色三重叠加 §8.5.1 */
      }
      .card.featured {
        box-shadow:
          inset 0 3px 0 var(--green-600),
          var(--shadow-md); /* §8.2 主流程卡加顶部 accent */
      }
      .flowtag {
        display: inline-block;
        margin-left: var(--sp-2);
        padding: 3px var(--sp-2);
        border-radius: var(--radius-sm);
        background: var(--green-100);
        color: var(--green-700);
        font-size: var(--fs-xs);
        font-weight: 600;
        vertical-align: middle;
      }
      .wide {
        grid-column: 1 / -1;
      }
      label {
        display: block;
        margin: var(--sp-4) 0 var(--sp-1);
        font-size: var(--fs-sm);
        font-weight: 600;
        line-height: 1.45;
      }
      label small {
        display: block;
        margin-top: 2px;
        font-size: var(--fs-xs);
        font-weight: 400;
        line-height: 1.5;
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
        font-size: var(--fs-base);
        border-radius: var(--radius-sm);
        max-width: 100%;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-width: 0;
        padding: 10px var(--sp-3);
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--border-strong); /* 3.75:1，边界可见 §5.6 */
        box-shadow: var(--shadow-inset); /* 输入井：顶部内阴影 §6.1.3 */
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--muted);
        opacity: 1;
      }
      textarea {
        min-height: 120px; /* 容下窄屏占位提示的四行，不出现内滚动条 */
        resize: vertical;
        line-height: 1.6;
      }
      button {
        cursor: pointer;
        padding: 10px var(--sp-4);
        margin: var(--sp-4) var(--sp-2) 0 0;
        background: var(--green-600);
        color: #fff;
        border: 1px solid var(--green-600);
        font-weight: 600;
        box-shadow: var(--shadow-sm);
        transition:
          background-color 0.15s,
          transform 0.15s,
          box-shadow 0.15s;
      }
      button:hover:not(:disabled) {
        background: var(--green-700);
        border-color: var(--green-700);
      }
      button:active:not(:disabled) {
        transform: translateY(1px); /* §6.2.2 按压态 */
        box-shadow: none;
      }
      button.secondary {
        background: var(--surface);
        color: var(--green-600);
        border-color: var(--green-600);
        box-shadow: none;
      }
      button.secondary:hover:not(:disabled) {
        background: var(--green-50);
      }
      button:disabled {
        background: var(--surface-disabled);
        color: var(--muted); /* 4.79:1，明确不可点而非半透明绿 */
        border-color: transparent;
        opacity: 1;
        cursor: not-allowed;
        box-shadow: none;
      }
      .row {
        display: flex;
        gap: var(--sp-3);
      }
      .row > * {
        flex: 1 1 0;
        min-width: 0;
      }
      /* 长选项文字的下拉列多分一点宽度，避免「普通入园／北京通史基本陈列」被截 §3.3.2 */
      .row > .row-wide {
        flex: 1.35 1 0;
      }
      /* 游客四字段由 4 列改 2×2，长中文标签不再折成四行 §3.6 §3.3.1 */
      .visitor {
        background: var(--surface-subtle); /* 一个游客 = 一个分组，靠底色而非分隔线 §8.5 */
        border-radius: var(--radius-md);
        padding: var(--sp-4);
        margin-top: var(--sp-3);
      }
      .visitor .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--sp-3);
      }
      .visitor label {
        display: flex;
        flex-direction: column;
        gap: var(--sp-1);
        margin: 0;
        font-size: var(--fs-sm);
      }
      .visitor button.secondary {
        background: transparent;
        color: var(--green-700);
        border-color: transparent;
        box-shadow: none;
        font-size: var(--fs-sm);
        padding: var(--sp-1) 0;
        margin: var(--sp-2) 0 0;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .visitor button.secondary:hover:not(:disabled) {
        background: transparent;
        color: var(--green-800);
      }
      #visitors:empty {
        display: none;
      }
      #status {
        white-space: pre-wrap;
      }
      #status:empty,
      #savedRecord:empty {
        display: none; /* §8.4 空容器不占白 */
      }
      #status:not(:empty) {
        margin: var(--sp-4) 0 0;
        padding: var(--sp-3) var(--sp-4);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        font-size: var(--fs-sm);
        line-height: 1.6;
      }
      #savedRecord:not(:empty) {
        margin: var(--sp-3) 0;
        padding: var(--sp-2) var(--sp-3);
        background: var(--green-50);
        border-radius: var(--radius-sm);
        font-size: var(--fs-sm);
      }
      #conversation {
        white-space: pre-wrap;
      }
      #conversation:not(:empty) {
        max-height: 230px;
        overflow: auto;
        margin: var(--sp-2) 0 var(--sp-4);
      }
      #conversation:empty::before {
        content: "还没有对话，提交购票问题后会显示在这里。"; /* §8.4 空状态 */
        display: block;
        margin-top: var(--sp-3);
        padding: var(--sp-3) var(--sp-4);
        background: var(--surface-subtle);
        border-radius: var(--radius-sm);
        color: var(--muted);
        font-size: var(--fs-sm);
      }
      .bubble {
        background: var(--surface-subtle);
        border-radius: var(--radius-sm);
        padding: var(--sp-2) var(--sp-3);
        margin: var(--sp-2) 0;
        font-size: var(--fs-sm);
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .empty {
        background: var(--surface-subtle);
        border-radius: var(--radius-md);
        padding: var(--sp-5) var(--sp-4);
      }
      .empty-title {
        margin: 0 0 var(--sp-2);
        font-weight: 600;
        color: var(--ink);
      }
      .empty p {
        margin: 0;
        max-width: 52ch;
        font-size: var(--fs-sm);
        line-height: 1.7;
      }
      #result h3:first-child {
        margin-top: 0;
        font-size: var(--fs-lg); /* §2.1 估算金额是结果区的扫描目标 */
        color: var(--green-700);
      }
      #result p,
      #result ul {
        font-size: var(--fs-sm);
      }
      #result ul {
        margin: var(--sp-3) 0;
        padding-left: var(--sp-5);
      }
      #result li {
        margin: var(--sp-1) 0;
        line-height: 1.6;
      }
      #result a {
        font-size: var(--fs-sm);
        font-weight: 600;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--fs-sm);
      }
      td,
      th {
        text-align: left;
        border-bottom: 1px solid var(--line);
        padding: var(--sp-3);
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      details {
        margin: var(--sp-4) 0 0;
        font-size: var(--fs-sm);
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        padding: var(--sp-1) 0;
      }
      details p {
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      dialog {
        border: none;
        border-radius: var(--radius-lg);
        max-width: min(560px, calc(100vw - var(--sp-6)));
        padding: var(--sp-5);
        box-shadow: var(--shadow-lg); /* 模态用最高一级高程 §6.2 */
        color: var(--ink);
      }
      dialog::backdrop {
        background: rgba(16, 38, 32, 0.42);
      }
      dialog h2 {
        margin-bottom: var(--sp-3);
      }
      dialog pre {
        font-size: var(--fs-sm);
        line-height: 1.6;
        background: var(--surface-subtle);
        padding: var(--sp-3);
        border-radius: var(--radius-sm);
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none !important;
      }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid var(--focus); /* 6.33:1；补齐 select/textarea/summary §15 */
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
      @media (max-width: 760px) {
        header,
        main {
          padding: var(--sp-4);
        }
        h1 {
          font-size: 24px;
        }
        .grid {
          grid-template-columns: minmax(0, 1fr);
          gap: var(--sp-5);
        }
        .wide {
          grid-column: auto;
        }
        .card {
          padding: var(--sp-4);
        }
        /* 小屏每个字段独占一行：下拉选项不再被截断，游客分组也保持完整 §3.3.1 */
        .row,
        .visitor .row {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: var(--sp-3);
        }
        .row > * {
          min-width: 0;
        }
        dialog {
          padding: var(--sp-4);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <span class="muted">旅行助手 / 北京试点</span>
        <h1>景区购票助手</h1>
      </div>
      <a href="/">返回行程与登录</a>
    </header>
    <main>
      <p class="muted">
        八达岭长城 · 首都博物馆 · 中山公园。规则为人工核验快照，来源日期可查。
      </p>
      <p class="badge">余票未核验 · 在官方渠道完成购买</p>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="grid">
        <section class="card featured">
          <h2>告诉我你的计划<span class="flowtag">主流程</span></h2>
          <div id="conversation" aria-live="polite"></div>
          <form id="adviceForm">
            <label for="message">购票问题</label
            ><textarea
              id="message"
              maxlength="1500"
              placeholder="例如：2026-11-21 去八达岭，带一位12岁的孩子，怎么买票？请勿输入姓名或证件号。"
            ></textarea>
            <label for="attraction">景点</label
            ><select id="attraction">
              <option value="">请选择，或在消息中说明</option>
            </select>
            <div class="row">
              <div>
                <label for="date">游览日期</label
                ><input id="date" type="date" />
              </div>
              <div class="row-wide">
                <label for="product">参观产品</label
                ><select id="product">
                  <option value="STANDARD">普通入园／北京通史基本陈列</option>
                  <option value="COMBINED">联票</option>
                  <option value="SPECIAL">特展／活动</option>
                  <option value="TRANSPORT">索道／交通附加项目</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div>
                <label for="startTime">计划到达时间（可选）</label
                ><input id="startTime" type="time" />
              </div>
              <div>
                <label for="endTime">计划结束时间（可选）</label
                ><input id="endTime" type="time" />
              </div>
            </div>
            <label
              >游客条件
              <small>仅收集优惠判断所需信息，年龄按游览日周岁填写</small></label
            >
            <div id="visitors"></div>
            <button type="button" class="secondary" id="addVisitor">
              添加游客</button
            ><button id="ask" type="submit">查看购票建议</button>
          </form>
        </section>
        <section class="card">
          <h2>购票建议</h2>
          <div id="result">
            <div class="empty">
              <p class="empty-title">还没有购票建议</p>
              <p class="muted">
                填好左侧需求后点「查看购票建议」，这里会显示匹配票种、费用与行程提醒。未核实的项目不会按免费处理。
              </p>
            </div>
          </div>
        </section>
        <section class="card wide">
          <h2>关联行程与手动登记</h2>
          <p class="muted">
            选择已有活动可带入日期与时间。没有活动，请先返回行程创建。登记金额不会自动加入费用。
          </p>
          <button id="loadTrips" class="secondary">加载我的行程</button>
          <div class="row">
            <div>
              <label for="trip">行程</label
              ><select id="trip">
                <option value="">不关联行程</option>
              </select>
            </div>
            <div>
              <label for="activity">目标活动</label
              ><select id="activity">
                <option value="">请选择已有活动</option>
              </select>
            </div>
          </div>
          <div id="savedRecord" class="muted"></div>
          <div id="registration">
            <div class="row">
              <div>
                <label for="recordProduct">实际购买产品</label
                ><input
                  id="recordProduct"
                  maxlength="100"
                  placeholder="按购票结果填写"
                />
              </div>
              <div>
                <label for="session">场次（可选）</label
                ><input
                  id="session"
                  maxlength="100"
                  placeholder="如上午场；不填写订单号"
                />
              </div>
              <div>
                <label for="paid">实付总额（元，可留空）</label
                ><input id="paid" type="number" min="0" step="0.01" />
              </div>
            </div>
            <button id="preview" class="secondary">预览自报登记</button>
          </div>
          <p class="warning">
            用户自报已购票／已预约，未经平台核验。这里只记录结果，不下单、不支付、不验证出票。
          </p>
        </section>
      </div>
      <dialog id="confirm">
        <h2>确认写入目标活动</h2>
        <pre id="previewText"></pre>
        <p>用户自报，未经平台核验。</p>
        <button id="save">确认登记</button
        ><button class="secondary" id="cancel">返回修改</button>
      </dialog>
    </main>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      let currentTrip = null,
        lastResult = null,
        pending = null,
        catalog = [];
      const params = new URLSearchParams(location.search);
      let initialTrip = params.get("itineraryId"),
        initialActivity = params.get("activityId");
      function status(text) {
        $("status").textContent = text;
      }
      async function api(path, body, method) {
        const r = await fetch(path, {
          credentials: "same-origin",
          method: method || (body ? "POST" : "GET"),
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!r.ok) {
          let msg = "";
          try {
            msg = (await r.json()).error || "";
          } catch {}
          throw Error(
            r.status === 401
              ? "请先返回主页登录，再加载行程。"
              : r.status === 409
                ? "行程已变化或归档，请重新加载并核对，未保存登记。"
                : msg || "请求失败（" + r.status + "）",
          );
        }
        return r.json();
      }
      function el(tag, text, parent) {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = text;
        if (parent) parent.append(n);
        return n;
      }
      function option(select, value, text) {
        const n = el("option", text, select);
        n.value = value;
      }
      function addVisitor(v = {}) {
        if ($("visitors").children.length >= 30) return;
        const box = el("div", undefined, $("visitors"));
        box.className = "visitor";
        const row = el("div", undefined, box);
        row.className = "row";
        for (const [key, title, type] of [
          ["age", "年龄", "number"],
          ["heightCm", "身高厘米（中山公园）", "number"],
          ["student", "符合全日制本科及以下学生条件", "select"],
          ["chineseEligible", "符合八达岭年龄免票身份条件", "select"],
        ]) {
          const label = el("label", title, row);
          const n = el(
            type === "select" ? "select" : "input",
            undefined,
            label,
          );
          n.dataset.key = key;
          if (type === "select") {
            option(n, "", "待确认");
            option(n, "true", "是");
            option(n, "false", "否");
            n.value = v[key] == null ? "" : String(v[key]);
          } else {
            n.type = "number";
            n.min = key === "age" ? "0" : "30";
            n.max = key === "age" ? "120" : "250";
            n.value = v[key] ?? "";
          }
        }
        const remove = el("button", "移除此游客", box);
        remove.type = "button";
        remove.className = "secondary";
        remove.onclick = () => box.remove();
      }
      function needs() {
        return {
          attraction: $("attraction").value || null,
          date: $("date").value || null,
          product: $("product").value,
          startTime: $("startTime").value || null,
          endTime: $("endTime").value || null,
          visitors: [...$("visitors").children].map((box) =>
            Object.fromEntries(
              [...box.querySelectorAll("[data-key]")].map((n) => [
                n.dataset.key,
                n.value === ""
                  ? null
                  : n.tagName === "SELECT"
                    ? n.value === "true"
                    : Number(n.value),
              ]),
            ),
          ),
        };
      }
      function signature(n) {
        return JSON.stringify([
          n.attraction,
          n.date,
          n.product,
          (n.visitors || []).map((v) => [
            v.age,
            v.heightCm,
            v.student,
            v.chineseEligible,
          ]),
          n.startTime,
          n.endTime,
        ]);
      }
      function applyNeeds(n) {
        const site = catalog.find(
          (s) => s.name === n.attraction || s.id === n.attraction,
        );
        if (site) $("attraction").value = site.name;
        $("date").value = n.date || "";
        $("product").value = n.product;
        $("startTime").value = n.startTime || "";
        $("endTime").value = n.endTime || "";
        if (n.visitors) {
          $("visitors").replaceChildren();
          n.visitors.forEach(addVisitor);
        }
      }
      function render(r) {
        const out = $("result");
        out.replaceChildren();
        if (r.questions.length) {
          el("h3", "还需要确认", out);
          const ul = el("ul", undefined, out);
          r.questions.forEach((q) => el("li", q, ul));
        }
        el(
          "h3",
          "门票估算：" +
            (r.estimatedTotal == null
              ? "未知／资料不全"
              : r.estimatedTotal + " 元"),
          out,
        );
        r.matches.forEach((m) =>
          el(
            "p",
            "游客 " +
              m.visitor +
              " · " +
              m.ticket +
              " · " +
              (m.price == null ? "未知" : m.price + " 元"),
            out,
          ),
        );
        if (r.channels) {
          for (const c of r.channels.channels) {
            if (/^https?:\/\//.test(c.officialUrl)) {
              const a = el("a", c.channelName, out);
              a.href = c.officialUrl;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              el("br", "", out);
            }
          }
          if (!r.channels.channels.length) el("p", r.channels.notice, out);
        }
        const ul = el("ul", undefined, out);
        r.notices.forEach((n) => el("li", n, ul));
        const details = el("details", undefined, out);
        el("summary", "字段来源与核验日期", details);
        for (const [key, f] of Object.entries(r.evidence)) {
          const p = el(
            "p",
            ({
              price: "票价",
              eligibility: "优惠资格",
              hours: "开放与入园时间",
              reservation: "预约要求",
              extras: "附加项目",
              refund: "退改规则",
              notice: "规则说明",
            }[key] || key) +
              "：" +
              (f.value == null ? "未知" : JSON.stringify(f.value)) +
              "；核验 " +
              (f.verifiedAt || "未核验") +
              "；适用 " +
              (f.validFrom || "起始未知") +
              " 至 " +
              (f.validTo || "未注明结束") +
              (f.note ? "；" + f.note : ""),
            details,
          );
          if (f.sourceUrl && /^https:\/\//.test(f.sourceUrl)) {
            const a = el("a", " 查看来源", p);
            a.href = f.sourceUrl;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }
        }
        $("registration").hidden = !r.registrationSuggested;
      }
      $("addVisitor").onclick = () => addVisitor();
      $("adviceForm").onsubmit = async (e) => {
        e.preventDefault();
        $("ask").disabled = true;
        try {
          const message = $("message").value;
          const r = await api("/api/agent/tickets/advice", {
            message,
            needs: needs(),
            itineraryId: currentTrip?.id || null,
            activityId: $("activity").value || null,
          });
          lastResult = r;
          applyNeeds(r.needs);
          render(r);
          if (message)
            el("div", "你：" + message, $("conversation")).className = "bubble";
          el(
            "div",
            "助手：" +
              (r.questions.join("；") ||
                "已按核验规则整理建议，请查看右侧依据。"),
            $("conversation"),
          ).className = "bubble";
          $("message").value = "";
          status("建议已更新，请核对模型提取及表单内容。");
        } catch (e) {
          status(e.message);
        } finally {
          $("ask").disabled = false;
        }
      };
      async function loadTrip(id, activityId) {
        $("savedRecord").textContent = "";
        currentTrip = null;
        lastResult = null;
        $("activity").replaceChildren();
        option($("activity"), "", "请选择已有活动");
        if (!id) return;
        const t = await api("/api/itineraries/" + encodeURIComponent(id));
        currentTrip = t;
        for (const d of t.dailySchedules)
          for (const a of d.activities)
            option($("activity"), a.id, d.date + " · " + a.title);
        if (activityId) $("activity").value = activityId;
        if ($("activity").value) selectActivity();
      }
      function selectActivity() {
        lastResult = null;
        $("registration").hidden = false;
        $("savedRecord").textContent = "";
        const id = $("activity").value;
        for (const d of currentTrip?.dailySchedules || [])
          for (const a of d.activities)
            if (a.id === id) {
              $("date").value = d.date || "";
              $("startTime").value = a.startTime || "";
              $("endTime").value = a.endTime || "";
              const site = catalog.find(
                (s) =>
                  s.name === a.title || s.id === a.ticketRecord?.attractionId,
              );
              $("attraction").value = site?.name || "";
              if (a.ticketRecord) {
                const r = a.ticketRecord;
                $("savedRecord").textContent =
                  "已有登记：用户自报已购票／已预约，未经平台核验 · " +
                  r.product +
                  " · " +
                  r.travelers +
                  "人";
                $("recordProduct").value = r.product;
                $("session").value = r.session || "";
                $("paid").value = r.paidTotal ?? "";
              }
            }
      }
      async function loadTrips() {
        const selectedTrip = initialTrip || currentTrip?.id;
        const selectedActivity = initialActivity || $("activity").value;
        const trips = await api("/api/itineraries");
        $("trip").replaceChildren();
        option($("trip"), "", "不关联行程");
        trips
          .filter((t) => !t.archived)
          .forEach((t) => option($("trip"), t.id, t.title));
        if (selectedTrip) {
          $("trip").value = selectedTrip;
          await loadTrip(selectedTrip, selectedActivity);
          initialTrip = null;
          initialActivity = null;
        }
      }
      $("loadTrips").onclick = () =>
        loadTrips().catch((e) => status(e.message));
      $("trip").onchange = () =>
        loadTrip($("trip").value).catch((e) => status(e.message));
      $("activity").onchange = selectActivity;
      $("preview").onclick = () => {
        try {
          if (!currentTrip || !$("activity").value)
            throw Error("请先选择行程与已有活动");
          if (!lastResult) throw Error("请先获取建议，并核对需求表单");
          const n = needs();
          if (signature(n) !== signature(lastResult.needs))
            throw Error("表单已修改，请重新获取建议");
          if (
            !n.date ||
            !n.visitors?.length ||
            !$("recordProduct").value.trim()
          )
            throw Error("请补齐日期、人数和实际产品");
          if (!$("paid").checkValidity())
            throw Error("实付金额须为非负数，最多两位小数");
          const site = catalog.find((s) => s.name === n.attraction);
          if (!site) throw Error("请选择支持登记的景点");
          pending = {
            attractionId: site.id,
            product: $("recordProduct").value.trim(),
            visitDate: n.date,
            session: $("session").value || null,
            travelers: n.visitors.length,
            paidTotal: $("paid").value === "" ? null : Number($("paid").value),
          };
          $("previewText").textContent =
            currentTrip.title +
            " / " +
            $("activity").selectedOptions[0].textContent +
            "\n" +
            pending.product +
            " / " +
            pending.visitDate +
            " / " +
            (pending.session || "场次未填") +
            " / " +
            pending.travelers +
            "人 / 实付 " +
            (pending.paidTotal ?? "未知");
          $("confirm").showModal();
        } catch (e) {
          status(e.message);
        }
      };
      $("cancel").onclick = () => $("confirm").close();
      $("save").onclick = async () => {
        $("save").disabled = true;
        try {
          currentTrip = await api(
            "/api/itineraries/" +
              encodeURIComponent(currentTrip.id) +
              "/activities/" +
              encodeURIComponent($("activity").value) +
              "/ticket-record?version=" +
              currentTrip.version,
            pending,
            "PUT",
          );
          $("confirm").close();
          selectActivity();
          status("已记录用户自报结果，未经平台核验；费用板块未自动变更。");
        } catch (e) {
          $("confirm").close();
          status(e.message);
        } finally {
          $("save").disabled = false;
        }
      };
      (async () => {
        try {
          catalog = await api("/api/tickets/catalog");
          catalog.forEach((s) => option($("attraction"), s.name, s.name));
          if (initialTrip) await loadTrips();
        } catch (e) {
          status(e.message);
        }
      })();
    </script>
  </body>
</html>
