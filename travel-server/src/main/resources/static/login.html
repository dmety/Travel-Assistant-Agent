<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旅行助手 · 登录测试</title>
  <style>
    :root { --primary: #2563eb; --ok: #16a34a; --err: #dc2626; --bg: #f1f5f9; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
           background: var(--bg); color: #0f172a; display: flex; justify-content: center;
           align-items: flex-start; min-height: 100vh; padding: 48px 16px; }
    .card { background: #fff; width: 100%; max-width: 420px; border-radius: 14px;
            box-shadow: 0 10px 30px rgba(15,23,42,.08); padding: 28px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #64748b; font-size: 13px; margin: 0 0 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { flex: 1; text-align: center; padding: 8px; border-radius: 8px; cursor: pointer;
           background: #e2e8f0; font-size: 14px; user-select: none; }
    .tab.active { background: var(--primary); color: #fff; }
    form { display: none; flex-direction: column; gap: 12px; }
    form.active { display: flex; }
    label { font-size: 13px; color: #475569; }
    input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    button { padding: 11px; border: 0; border-radius: 8px; background: var(--primary);
             color: #fff; font-size: 15px; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 13px;
              display: none; white-space: pre-wrap; word-break: break-all; }
    .status.ok { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .panel { margin-top: 20px; padding: 16px; border-radius: 8px; background: #f8fafc;
             border: 1px solid #e2e8f0; display: none; }
    .panel.active { display: block; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>旅行助手</h1>
    <p class="sub">测试用登录 / 注册页（会话基于 JSESSIONID）</p>

    <div class="tabs">
      <div class="tab active" data-tab="login">登录</div>
      <div class="tab" data-tab="register">注册</div>
    </div>

    <form id="loginForm" class="active">
      <label for="lUser">用户名</label>
      <input id="lUser" name="username" autocomplete="username" required />
      <label for="lPass">密码</label>
      <input id="lPass" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">登录</button>
      <div class="hint">POST /api/login</div>
    </form>

    <form id="registerForm">
      <label for="rUser">用户名（3-20 位）</label>
      <input id="rUser" name="username" autocomplete="username" required />
      <label for="rPass">密码（至少 8 位，含字母和数字）</label>
      <input id="rPass" name="password" type="password" autocomplete="new-password" required />
      <button type="submit">注册</button>
      <div class="hint">POST /api/account/register</div>
    </form>

    <div id="status" class="status"></div>

    <div id="sessionPanel" class="panel">
      <div style="font-weight:600;margin-bottom:8px;">当前会话</div>
      <pre id="meView" style="margin:0;font-size:13px;white-space:pre-wrap;word-break:break-all;"></pre>
      <button id="logoutBtn" class="secondary" style="margin-top:12px;">退出登录</button>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const status = $('status');
    function show(msg, kind) {
      status.textContent = msg;
      status.className = 'status ' + (kind || '');
    }

    // 标签页切换
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        $(tab.dataset.tab + 'Form').classList.add('active');
      });
    });

    function showSession(user) {
      $('sessionPanel').classList.add('active');
      $('meView').textContent = JSON.stringify(user, null, 2);
    }
    function hideSession() {
      $('sessionPanel').classList.remove('active');
      $('meView').textContent = '';
    }

    // 拉取当前登录用户
    async function refreshMe() {
      try {
        const res = await fetch('/api/account/me', { method: 'GET', credentials: 'same-origin' });
        if (res.ok) { showSession(await res.json()); return true; }
        hideSession(); return false;
      } catch (e) { hideSession(); return false; }
    }

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = $('lUser').value.trim();
      const pass = $('lPass').value;
      if (!user || !pass) { show('请填写用户名和密码', 'err'); return; }
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'username=' + encodeURIComponent(user) + '&password=' + encodeURIComponent(pass),
          credentials: 'same-origin'
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          show('登录成功：' + (data.username || user), 'ok');
          await refreshMe();
        } else {
          show('登录失败：' + (data.error || res.status), 'err');
          hideSession();
        }
      } catch (err) { show('请求出错：' + err, 'err'); }
    });

    $('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = $('rUser').value.trim();
      const pass = $('rPass').value;
      try {
        const res = await fetch('/api/account/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass }),
          credentials: 'same-origin'
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok || res.status === 201) {
          show('注册成功，请切换到「登录」标签登录。', 'ok');
          $('lUser').value = user; $('lPass').value = pass;
        } else {
          show('注册失败（' + res.status + '）：' + (data.error || JSON.stringify(data)), 'err');
        }
      } catch (err) { show('请求出错：' + err, 'err'); }
    });

    $('logoutBtn').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
        const data = await res.json().catch(() => ({}));
        show('已退出：' + (data.loggedOut ? '会话已失效' : 'OK'), 'ok');
        hideSession();
      } catch (err) { show('退出出错：' + err, 'err'); }
    });

    // 进入页面时尝试恢复已有会话
    refreshMe();
  </script>
</body>
</html>
