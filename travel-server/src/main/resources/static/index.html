<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 旅行助手</title>
<style>
/* ==================================================================
   旅行助手 · 登录页（站点首页）
   ------------------------------------------------------------------
   单文件原生 HTML + 内联 CSS/JS，无框架、无组件库、无外部依赖。
   沿用 chat.html / api-console.html 的同一套 token，不另起色相：
   主色 #2563eb、slate 中性色阶、12/14/16/20/25 字级、4/8/12 圆角。

   层级：本页只有一个任务——登录。品牌次之，辅助信息（接口地址、
   测试台入口）最末，字号与颜色逐级弱化，不与主操作争夺注意力。
   表单字段边框用 --field-line（对白底 ≥3:1），保证控件边界可辨；
   正文与提示文字全部 ≥4.5:1。
   ================================================================== */
:root{
  --primary:#2563eb; --primary-hover:#1d4ed8;
  --primary-soft:#eff6ff; --primary-line:#bfdbfe;
  --ok:#15803d; --ok-soft:#ecfdf5; --ok-line:#a7f3d0;
  --err:#b91c1c; --err-soft:#fef2f2; --err-line:#fecaca;

  --ink:#0f172a; --text-2:#475569; --text-3:#64748b;
  --line:#e2e8f0; --line-strong:#cbd5e1; --field-line:#7d8ea3;
  --surface:#ffffff; --surface-2:#f8fafc; --bg:#f1f5f9;

  --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:25px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;

  --r-ctl:8px; --r-card:12px; --r-pill:999px;

  --shadow-1:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.08);
  --shadow-2:0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04);
  --shadow-3:0 12px 32px rgba(15,23,42,.12), 0 4px 8px rgba(15,23,42,.05);
}

*{box-sizing:border-box;}
html{height:100%;}
body{
  margin:0; padding:var(--sp-6);
  min-height:100%;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(1200px 600px at 15% -10%, #e8effd 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 110%, #eef6ff 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size:var(--fs-base); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 卡片 ---------- */
.auth{
  width:100%; max-width:404px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-3);
  padding:var(--sp-8) var(--sp-8) var(--sp-6);
}

/* ---------- 品牌 ---------- */
.brand{display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-6);}
.brand .mark{
  width:38px; height:38px; flex:0 0 auto;
  display:grid; place-items:center;
  background:var(--primary); color:#fff;
  border-radius:10px; font-size:var(--fs-md); font-weight:700;
  box-shadow:var(--shadow-1);
}
.brand-txt{min-width:0;}
.brand-txt b{display:block; font-size:var(--fs-md); font-weight:600; letter-spacing:.01em;}
.brand-txt span{display:block; font-size:var(--fs-xs); color:var(--text-3); line-height:1.4;}

h1{font-size:var(--fs-lg); line-height:1.35; margin:0 0 var(--sp-2); font-weight:600; letter-spacing:-.01em;}
.sub{margin:0 0 var(--sp-5); color:var(--text-2); font-size:var(--fs-sm); max-width:34ch;}

/* ---------- 页签 ---------- */
.tabs{
  display:flex; gap:var(--sp-1);
  padding:3px; margin-bottom:var(--sp-5);
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-ctl);
}
.tab{
  flex:1; appearance:none; border:0; cursor:pointer;
  padding:7px var(--sp-3);
  background:transparent; color:var(--text-2);
  font-size:var(--fs-sm); font-weight:600; font-family:inherit;
  border-radius:6px; transition:background .15s, color .15s, box-shadow .15s;
}
.tab:hover{color:var(--ink);}
.tab[aria-selected="true"]{
  background:var(--surface); color:var(--ink);
  box-shadow:var(--shadow-1);
}

/* ---------- 表单 ---------- */
form{display:none; flex-direction:column; gap:var(--sp-3);}
form.active{display:flex;}

.field{display:flex; flex-direction:column; gap:6px;}
label{font-size:var(--fs-sm); font-weight:500; color:var(--text-2);}
input{
  width:100%; padding:9px var(--sp-3);
  border:1px solid var(--field-line); border-radius:var(--r-ctl);
  background:var(--surface); color:var(--ink);
  font-size:var(--fs-base); font-family:inherit; line-height:1.5;
  transition:border-color .15s, box-shadow .15s;
}
input:hover{border-color:var(--text-3);}
input::placeholder{color:var(--text-3);}
input:focus{
  outline:none; border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.16);
}
input[aria-invalid="true"]{border-color:var(--err);}
input[aria-invalid="true"]:focus{box-shadow:0 0 0 3px rgba(185,28,28,.16);}

.field-hint{font-size:var(--fs-xs); color:var(--text-3); line-height:1.5;}

/* ---------- 主按钮 ---------- */
.submit{
  margin-top:var(--sp-2);
  width:100%; padding:10px var(--sp-4);
  border:1px solid var(--primary); border-radius:var(--r-ctl);
  background:var(--primary); color:#fff;
  font-size:var(--fs-base); font-weight:600; font-family:inherit;
  cursor:pointer; box-shadow:var(--shadow-1);
  transition:background .15s, box-shadow .15s;
}
.submit:hover{background:var(--primary-hover); border-color:var(--primary-hover);}
.submit:active{box-shadow:none; transform:translateY(1px);}
.submit:disabled{background:var(--surface-2); border-color:var(--line-strong);
  color:var(--text-3); cursor:not-allowed; box-shadow:none; transform:none;}

/* ---------- 消息条 ---------- */
.msg{
  display:none; margin-top:var(--sp-4);
  padding:var(--sp-2) var(--sp-3);
  border-radius:var(--r-ctl); border:1px solid transparent;
  font-size:var(--fs-sm); line-height:1.5;
}
.msg.show{display:block;}
.msg.ok{background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok);}
.msg.err{background:var(--err-soft); border-color:var(--err-line); color:var(--err);}
.msg.info{background:var(--primary-soft); border-color:var(--primary-line); color:var(--text-2);}

/* ---------- 页脚 ---------- */
.foot{
  margin-top:var(--sp-6); padding-top:var(--sp-4);
  border-top:1px solid var(--line);
  display:flex; flex-wrap:wrap; gap:var(--sp-1) var(--sp-3);
  align-items:center; justify-content:space-between;
  font-size:var(--fs-xs); color:var(--text-3);
}
.foot a{color:var(--text-2); text-decoration:none; border-bottom:1px solid var(--line-strong);}
.foot a:hover{color:var(--primary); border-bottom-color:var(--primary-line);}

/* ---------- 焦点与可达性 ---------- */
:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
.tab:focus-visible, input:focus-visible{outline-offset:2px;}
.visually-hidden{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* ---------- 小屏：卡片贴边、内距收紧，避免 375px 下换行错乱 ---------- */
@media (max-width:480px){
  body{padding:var(--sp-4) var(--sp-3);}
  .auth{padding:var(--sp-6) var(--sp-5); border-radius:var(--r-card); box-shadow:var(--shadow-2);}
  h1{font-size:var(--fs-md);}
  .foot{justify-content:flex-start;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important;}
}
</style>
</head>
<body>

<main class="auth">
  <div class="brand">
    <span class="mark" aria-hidden="true">旅</span>
    <span class="brand-txt">
      <b>旅行助手</b>
      <span>知识库驱动的行程规划</span>
    </span>
  </div>

  <h1>登录后开始规划</h1>
  <p class="sub">登录即可进入对话页，按目的地与偏好生成逐日行程。</p>

  <div class="tabs" role="tablist" aria-label="登录或注册">
    <button class="tab" type="button" role="tab" id="tabLogin"
            aria-selected="true" aria-controls="loginForm" data-tab="login">登录</button>
    <button class="tab" type="button" role="tab" id="tabRegister"
            aria-selected="false" aria-controls="registerForm" data-tab="register">注册</button>
  </div>

  <!-- ===== 登录 ===== -->
  <form id="loginForm" class="active" aria-labelledby="tabLogin" novalidate>
    <div class="field">
      <label for="lUser">用户名</label>
      <input id="lUser" name="username" autocomplete="username"
             placeholder="输入用户名" required />
    </div>
    <div class="field">
      <label for="lPass">密码</label>
      <input id="lPass" name="password" type="password" autocomplete="current-password"
             placeholder="输入密码" required />
    </div>
    <button class="submit" type="submit">登录</button>
  </form>

  <!-- ===== 注册 ===== -->
  <form id="registerForm" aria-labelledby="tabRegister" novalidate>
    <div class="field">
      <label for="rUser">用户名</label>
      <input id="rUser" name="username" autocomplete="username"
             placeholder="3–32 位字母、数字或下划线"
             aria-describedby="rUserHint" required />
      <span class="field-hint" id="rUserHint">3–32 位，仅字母 / 数字 / 下划线</span>
    </div>
    <div class="field">
      <label for="rPass">密码</label>
      <input id="rPass" name="password" type="password" autocomplete="new-password"
             placeholder="至少 8 位，含字母和数字"
             aria-describedby="rPassHint" required />
      <span class="field-hint" id="rPassHint">至少 8 位，且同时包含字母和数字</span>
    </div>
    <button class="submit" type="submit">注册并登录</button>
  </form>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <div class="foot">
    <span>本地演示环境 · 会话基于 JSESSIONID</span>
    <a href="/planner.html">新版行程工作台 →</a>
    <a href="/api-console.html">接口测试台 →</a>
  </div>
</main>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  /* 只接受站内相对路径，避免 ?next=https://evil 造成开放重定向 */
  function safeNext() {
    var v = new URLSearchParams(location.search).get('next');
    if (v && v.charAt(0) === '/' && v.charAt(1) !== '/') return v;
    return '/chat.html';
  }
  var NEXT = safeNext();

  /* ---------- 提示条 ---------- */
  function show(text, kind) {
    var el = $('msg');
    el.textContent = text;
    el.className = 'msg show ' + (kind || 'info');
  }
  function clearMsg() {
    var el = $('msg');
    el.textContent = '';
    el.className = 'msg';
  }

  /* ---------- 页签 ---------- */
  function switchTab(name) {
    var isLogin = name === 'login';
    $('tabLogin').setAttribute('aria-selected', String(isLogin));
    $('tabRegister').setAttribute('aria-selected', String(!isLogin));
    $('loginForm').classList.toggle('active', isLogin);
    $('registerForm').classList.toggle('active', !isLogin);
    clearMsg();
    (isLogin ? $('lUser') : $('rUser')).focus();
  }
  $('tabLogin').addEventListener('click', function () { switchTab('login'); });
  $('tabRegister').addEventListener('click', function () { switchTab('register'); });

  /* ---------- 提交态 ---------- */
  function lock(form, locked, label) {
    var btn = form.querySelector('.submit');
    if (!btn) return;
    if (locked) {
      btn.dataset.label = btn.textContent;
      btn.textContent = label;
      btn.disabled = true;
    } else {
      btn.textContent = btn.dataset.label || btn.textContent;
      btn.disabled = false;
    }
  }

  function markInvalid(input, bad) {
    input.setAttribute('aria-invalid', bad ? 'true' : 'false');
  }

  /* ---------- 登录 ---------- */
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = $('lUser').value.trim();
    var p = $('lPass').value;
    markInvalid($('lUser'), !u);
    markInvalid($('lPass'), !p);
    if (!u || !p) { show('请填写用户名和密码', 'err'); return; }

    var form = e.currentTarget;
    lock(form, true, '登录中…');
    clearMsg();

    fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (d) {
        if (res.ok) {
          $('lPass').value = '';
          show('登录成功，正在进入…', 'ok');
          location.replace(NEXT);
          return;
        }
        lock(form, false);
        show('登录失败：' + (d.error || '用户名或密码错误'), 'err');
        markInvalid($('lPass'), true);
        $('lPass').select();
      });
    }).catch(function () {
      lock(form, false);
      show('网络异常，请确认服务已启动后重试', 'err');
    });
  });

  /* ---------- 注册 ---------- */
  $('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = $('rUser').value.trim();
    var p = $('rPass').value;
    markInvalid($('rUser'), !u);
    markInvalid($('rPass'), !p);

    if (!u || !p) { show('请填写用户名和密码', 'err'); return; }
    if (!/^[A-Za-z0-9_]{3,32}$/.test(u)) {
      markInvalid($('rUser'), true);
      show('用户名需 3–32 位，仅字母、数字或下划线', 'err');
      $('rUser').focus();
      return;
    }
    if (p.length < 8 || !/[A-Za-z]/.test(p) || !/[0-9]/.test(p)) {
      markInvalid($('rPass'), true);
      show('密码至少 8 位，且同时包含字母和数字', 'err');
      $('rPass').focus();
      return;
    }

    var form = e.currentTarget;
    lock(form, true, '注册中…');
    clearMsg();

    fetch('/api/account/register', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (d) {
        if (res.status === 201 || res.ok) {
          /* 注册成功直接复用这套凭据登录，省一次输入 */
          lock(form, false);
          var lf = $('loginForm');
          lock(lf, true, '登录中…');
          fetch('/api/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p)
          }).then(function (r2) {
            if (r2.ok) {
              show('注册成功，正在进入…', 'ok');
              location.replace(NEXT);
              return;
            }
            lock(lf, false);
            $('rPass').value = '';
            $('lUser').value = u;
            switchTab('login');
            show('注册成功，请用刚才的密码登录', 'ok');
          }).catch(function () {
            lock(lf, false);
            switchTab('login');
            $('lUser').value = u;
            show('注册成功，但自动登录失败，请手动登录', 'info');
          });
          return;
        }
        lock(form, false);
        show('注册失败：' + (d.error || ('HTTP ' + res.status)), 'err');
      });
    }).catch(function () {
      lock(form, false);
      show('网络异常，请确认服务已启动后重试', 'err');
    });
  });

  /* ---------- 已登录访问首页：直接进对话页 ---------- */
  fetch('/api/account/me', { credentials: 'same-origin' })
    .then(function (res) {
      if (res.ok) { location.replace(NEXT); }
      else if (res.status === 401) { $('lUser').focus(); }
    })
    .catch(function () { /* 服务未就绪时停在登录页，不制造跳转循环 */ });

  /* 有账号的用户名可直接沿用：?u=name */
  var preset = new URLSearchParams(location.search).get('u');
  if (preset) { $('lUser').value = preset.slice(0, 32); $('lPass').focus(); }
})();
</script>
</body>
</html>
