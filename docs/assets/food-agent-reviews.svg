<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" style="max-width:100%;height:auto" role="img" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>美食 Agent 评价的三条路径与不做的边界</title>
<desc>用户想看分数时给带来源与时间的评分快照，想看别人写了什么时给评价平台官方页面外链，想让系统总结口碑时明确不做；底部列出不抓取、不摘录、不转述、不按评分排序等边界，并说明用户跳转不经过 Provider。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="1000" height="510" fill="#f1f5f9"/>
<text x="40" y="30" font-size="13" fill="#475569">评价怎么给用户看 · 不抓取，只给入口</text>

<rect x="40" y="48" width="230" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="48" width="3" height="110" rx="1.5" fill="#2563eb"/>
<rect x="56" y="64" width="30" height="30" rx="6" fill="#2563eb" fill-opacity="0.10"/>
<text x="71" y="84" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">01</text>
<text x="96" y="84" font-size="13" font-weight="600" fill="#0f172a">想看一个分数</text>
<text x="58" y="116" font-size="11" fill="#64748b">有没有人打过分</text>
<text x="58" y="140" font-size="11" fill="#64748b">一眼能比较几家</text>

<rect x="296" y="48" width="370" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="296" y="48" width="3" height="110" rx="1.5" fill="#2563eb"/>
<text x="314" y="76" font-size="13" font-weight="600" fill="#0f172a">给评分快照</text>
<text x="314" y="102" font-size="11" fill="#64748b">高德 POI 的 biz_ext.rating，随候选一起返回</text>
<text x="314" y="126" font-size="11" fill="#64748b">标来源与抓取时间，一律 unverified</text>
<text x="314" y="148" font-size="11" font-weight="600" fill="#2563eb">项目索引已有 rating，7,745 条里 4,480 条有值</text>

<rect x="692" y="48" width="268" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="692" y="48" width="3" height="110" rx="1.5" fill="#64748b"/>
<text x="710" y="76" font-size="13" font-weight="600" fill="#0f172a">契约落点</text>
<text x="710" y="102" font-size="11" fill="#64748b" font-family="'SFMono-Regular', Consolas, monospace">value.rating</text>
<text x="710" y="126" font-size="11" fill="#64748b">ratingSource / ratingFetchedAt</text>
<text x="710" y="148" font-size="11" fill="#2563eb">不落库，不参与排序</text>
<path d="M272 103 L290 103" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M670 103 L686 103" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="40" y="170" width="230" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="170" width="3" height="110" rx="1.5" fill="#16a34a"/>
<rect x="56" y="186" width="30" height="30" rx="6" fill="#2563eb" fill-opacity="0.10"/>
<text x="71" y="206" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">02</text>
<text x="96" y="206" font-size="13" font-weight="600" fill="#0f172a">想看别人写了什么</text>
<text x="58" y="238" font-size="11" fill="#64748b">点评、笔记、真实体验</text>
<text x="58" y="262" font-size="11" fill="#64748b">用户自己点开看</text>

<rect x="296" y="170" width="370" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="296" y="170" width="3" height="110" rx="1.5" fill="#16a34a"/>
<text x="314" y="198" font-size="13" font-weight="600" fill="#0f172a">给官方页面入口</text>
<text x="314" y="224" font-size="11" fill="#64748b">reviewLinks 最多 4 条，只放 platform / label / url</text>
<text x="314" y="248" font-size="11" fill="#64748b">搜索页兜底，不伪造 POI id；只给链接，不给正文</text>
<text x="314" y="270" font-size="11" font-weight="600" fill="#2563eb">不请求该 URL，不解析页面，不缓存快照</text>

<rect x="692" y="170" width="268" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="692" y="170" width="3" height="110" rx="1.5" fill="#64748b"/>
<text x="710" y="198" font-size="13" font-weight="600" fill="#0f172a">契约落点</text>
<text x="710" y="224" font-size="11" fill="#64748b" font-family="'SFMono-Regular', Consolas, monospace">value.reviewLinks</text>
<text x="710" y="248" font-size="11" fill="#64748b">前端新窗口，带 rel 与第三方标注</text>
<text x="710" y="270" font-size="11" fill="#2563eb">评价正文不进 facts 与 advice</text>
<path d="M272 225 L290 225" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M670 225 L686 225" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="40" y="292" width="230" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="292" width="3" height="110" rx="1.5" fill="#64748b"/>
<rect x="56" y="308" width="30" height="30" rx="6" fill="#64748b" fill-opacity="0.10"/>
<text x="71" y="328" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">03</text>
<text x="96" y="328" font-size="13" font-weight="600" fill="#0f172a">想让系统总结口碑</text>
<text x="58" y="360" font-size="11" fill="#64748b">挑几条好评念给我听</text>
<text x="58" y="384" font-size="11" fill="#64748b">本期不做</text>

<rect x="296" y="292" width="370" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="296" y="292" width="3" height="110" rx="1.5" fill="#64748b"/>
<text x="314" y="320" font-size="13" font-weight="600" fill="#0f172a">不做</text>
<text x="314" y="346" font-size="11" fill="#64748b">生成摘要要先抓评价正文，会踩 robots 与商业授权</text>
<text x="314" y="370" font-size="11" fill="#64748b">摘要里出现分数或店名，还会触发 S-05 grounding</text>
<text x="314" y="392" font-size="11" font-weight="600" fill="#64748b">不替用户读，也不替用户下结论</text>

<rect x="692" y="292" width="268" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="692" y="292" width="3" height="110" rx="1.5" fill="#64748b"/>
<text x="710" y="320" font-size="13" font-weight="600" fill="#0f172a">无落点</text>
<text x="710" y="346" font-size="11" fill="#64748b">advice 不写评价内容</text>
<text x="710" y="370" font-size="11" fill="#64748b">evidence.excerpt 不放正文</text>
<text x="710" y="392" font-size="11" fill="#64748b">不进日志与缓存</text>
<path d="M272 347 L290 347" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<path d="M670 347 L686 347" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

<rect x="40" y="418" width="920" height="48" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="418" width="3" height="48" rx="1.5" fill="#64748b"/>
<text x="58" y="440" font-size="12" font-weight="600" fill="#0f172a">不交给用户的边界</text>
<text x="58" y="458" font-size="11" fill="#475569">不抓取 · 不摘录 · 不转述 · 不按评分排序 · 不用评价内容做模型输入 · 不为做外链去抓站点</text>

<rect x="40" y="474" width="920" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="58" y="493" font-size="11" fill="#475569">虚线表示本期不做；用户点开平台页面是浏览器行为，不经过 Provider，也不进知识库周更链路。</text>
</svg>
