<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>旅行助手 · AI 对话</title>
<style>
/* ==================================================================
   旅行助手 · AI 对话界面
   ------------------------------------------------------------------
   Step 0：单文件原生 HTML + 内联 CSS/JS，无框架、无 Tailwind、无组件库、
   无暗色模式（沿用 api-console.html 的 light + blue 主题）。
   复用 api-console.html 既有 token：主色 #2563eb、slate 中性色阶、
   12/14/16/20/25 字级、4/8/12/16/24/32/48/64 间距、6/8/12 圆角、三级阴影。
   未引入新色相，聊天气泡色由 --primary / --primary-soft 派生。

   约束简报（Workflow B 步骤 1–3 留痕）
   内容排序
     主：对话消息流（用户问 + 助手答），承载全部信息
     次：输入区（本页唯一主操作 =「发送」）
     末：左侧会话历史、顶部标题与状态、推荐问题 chips
   动作排序
     主：发送；次：新对话 / 推荐问题；末：复制、移动端菜单

   token 取用（步骤 4–6）
     间距：消息内 12 / 消息间 24 / 区块间 32；组外 > 组内
     字级：正文 14、气泡标题 16、空状态标题 25、元信息 12
     颜色：正文 --ink；次级 --text-2；元信息 --text-3（白底 4.76:1）
     深度：气泡 --shadow-1、输入区 --shadow-2、侧栏无阴影
   ================================================================== */
:root{
  --primary:#2563eb; --primary-hover:#1d4ed8;
  --primary-soft:#eff6ff; --primary-line:#bfdbfe;
  --ok:#15803d; --ok-soft:#ecfdf5; --ok-line:#a7f3d0;
  --err:#b91c1c;

  --ink:#0f172a; --text-2:#475569; --text-3:#64748b;
  --line:#e2e8f0; --line-strong:#cbd5e1;
  --surface:#ffffff; --surface-2:#f8fafc; --bg:#f1f5f9;

  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:25px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-6:24px; --sp-8:32px; --sp-12:48px; --sp-16:64px;
  --r-sm:6px; --r-ctl:8px; --r-card:12px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(15,23,42,.06);
  --shadow-2:0 1px 2px rgba(15,23,42,.05), 0 8px 24px rgba(15,23,42,.06);
  --shadow-3:0 2px 4px rgba(15,23,42,.06), 0 16px 40px rgba(15,23,42,.10);
  --inset:inset 0 1px 2px rgba(15,23,42,.06);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:var(--fs-sm); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}

/* ---------- 骨架：侧栏 + 主对话区（§3.6 组外 0，两栏由边框分隔）---------- */
.app{
  display:grid; grid-template-columns:264px minmax(0,1fr);
  height:100vh; height:100dvh; overflow:hidden;
}

/* ---------- 侧栏（tertiary，无阴影、低对比）---------- */
.sidebar{
  display:flex; flex-direction:column; min-height:0;
  background:var(--surface-2); border-right:1px solid var(--line);
}
.side-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:var(--sp-2); padding:var(--sp-4) var(--sp-4) var(--sp-3);
}
.brand{display:flex; align-items:center; gap:var(--sp-2); font-weight:600; font-size:var(--fs-md);}
.brand .mark{
  width:26px; height:26px; border-radius:var(--r-ctl); display:grid; place-items:center;
  background:var(--primary); color:#fff; font-size:var(--fs-xs); font-weight:700;
  letter-spacing:.02em;
}
.btn-new{
  display:flex; align-items:center; gap:var(--sp-1);
  margin:0 var(--sp-4) var(--sp-3); padding:var(--sp-2) var(--sp-3);
  border:1px solid var(--line-strong); border-radius:var(--r-ctl);
  background:var(--surface); color:var(--ink);
  font-size:var(--fs-sm); font-weight:500; cursor:pointer;
  box-shadow:var(--shadow-1); transition:background .15s,border-color .15s;
}
.btn-new:hover{background:var(--surface-2); border-color:var(--text-3);}
.btn-new .plus{font-size:var(--fs-md); line-height:1; color:var(--text-2);}

.conv-scroll{flex:1; min-height:0; overflow-y:auto; padding:0 var(--sp-2) var(--sp-3);}
.glabel{
  padding:var(--sp-2) var(--sp-2) var(--sp-1);
  font-size:var(--fs-xs); font-weight:600; color:var(--text-3); letter-spacing:.02em;
}
.conv-row{display:flex; align-items:center; gap:2px; margin-bottom:2px;}
.conv{
  display:flex; align-items:center; gap:var(--sp-2); flex:1; min-width:0;
  padding:var(--sp-2) var(--sp-3);
  border:0; border-radius:var(--r-ctl); background:transparent;
  color:var(--text-2); font-size:var(--fs-sm); text-align:left; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.conv:hover{background:var(--line); color:var(--ink);}
.conv.active{background:var(--surface); color:var(--ink); font-weight:500; box-shadow:var(--shadow-1);}
.conv .ico{flex:0 0 auto; color:var(--text-3); font-size:var(--fs-xs);}
.conv.active .ico{color:var(--primary);}
.conv .txt{overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0;}
/* 删除会话：只在 hover / 键盘聚焦时出现，默认不占视觉层级 */
.conv-del{
  flex:0 0 auto; width:20px; height:20px; display:grid; place-items:center;
  border:0; border-radius:var(--r-sm); background:transparent; color:var(--text-3);
  font-size:var(--fs-sm); line-height:1; cursor:pointer; opacity:0;
  transition:opacity .15s, background .15s, color .15s;
}
.conv-row:hover .conv-del,
.conv-del:focus-visible{opacity:1;}
.conv-del:hover{background:var(--line-strong); color:var(--ink);}
.conv-empty{
  padding:var(--sp-3) var(--sp-2);
  font-size:var(--fs-xs); color:var(--text-3); line-height:1.7;
}

.side-foot{
  border-top:1px solid var(--line); padding:var(--sp-3) var(--sp-4);
  display:flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-xs); color:var(--text-2);
}
.side-foot .dot{width:7px; height:7px; border-radius:50%; background:var(--ok); flex:0 0 auto;}
.foot-link{
  margin-left:auto; flex:0 0 auto; color:var(--text-3); text-decoration:none;
  border-bottom:1px solid var(--line-strong); font-size:var(--fs-xs);
}
.foot-link:hover{color:var(--primary); border-bottom-color:var(--primary-line);}

/* ---------- 主对话区 ---------- */
.chat{display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--surface);}

.chat-head{
  display:flex; align-items:center; gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-6); border-bottom:1px solid var(--line);
  background:var(--surface);
}
.menu-btn{
  display:none; align-items:center; justify-content:center;
  width:36px; height:36px; border:1px solid var(--line-strong); border-radius:var(--r-ctl);
  background:var(--surface); color:var(--ink); cursor:pointer; font-size:var(--fs-md);
}
.head-txt{min-width:0;}
.head-txt .t{font-size:var(--fs-md); font-weight:600; line-height:1.4;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.head-txt .s{font-size:var(--fs-xs); color:var(--text-3); line-height:1.5;}
.head-spacer{flex:1;}
.chip-status{
  display:inline-flex; align-items:center; gap:6px; flex:0 0 auto;
  padding:4px var(--sp-3); border:1px solid var(--primary-line); border-radius:var(--r-pill);
  background:var(--primary-soft); color:var(--primary); font-size:var(--fs-xs); font-weight:600;
}
.chip-status .dot{width:6px; height:6px; border-radius:50%; background:var(--ok);}

/* 已登录用户与退出：弱化处理，不与「发送」争层级 */
.head-user{display:inline-flex; align-items:center; gap:var(--sp-2); flex:0 0 auto;}
.head-user .who{
  max-width:120px; font-size:var(--fs-xs); color:var(--text-2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.head-user .quit{
  appearance:none; cursor:pointer;
  padding:4px var(--sp-2); border:1px solid var(--line-strong); border-radius:var(--r-ctl);
  background:var(--surface); color:var(--text-2);
  font-size:var(--fs-xs); font-family:inherit; line-height:1.5;
  transition:border-color .15s, color .15s;
}
.head-user .quit:hover{border-color:var(--text-3); color:var(--ink);}
.head-user .quit:disabled{color:var(--text-3); cursor:not-allowed;}

/* ---------- 消息流 ---------- */
.messages{
  flex:1; min-height:0; overflow-y:auto; scroll-behavior:smooth;
  padding:var(--sp-8) var(--sp-6) var(--sp-6);
}
.stream{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:var(--sp-6); min-height:100%;}

.msg{display:flex; gap:var(--sp-3); align-items:flex-start; animation:rise .22s ease-out;}
@keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.msg.user{flex-direction:row-reverse;}

.avatar{
  flex:0 0 auto; width:32px; height:32px; border-radius:50%;
  display:grid; place-items:center; font-size:var(--fs-xs); font-weight:700;
  background:var(--primary-soft); color:var(--primary); border:1px solid var(--primary-line);
}
.msg.user .avatar{background:var(--surface-2); color:var(--text-2); border-color:var(--line-strong);}

.body{min-width:0; max-width:min(78%, 620px); display:flex; flex-direction:column; gap:6px;}
.msg.user .body{align-items:flex-end;}

.bubble{
  padding:var(--sp-3) var(--sp-4); border-radius:var(--r-card);
  font-size:var(--fs-sm); line-height:1.7; overflow-wrap:anywhere;
}
.msg.assistant .bubble{
  background:var(--surface); border:1px solid var(--line);
  border-top-left-radius:var(--r-sm); box-shadow:var(--shadow-1);
}
.msg.user .bubble{
  background:var(--primary); color:#fff;
  border-top-right-radius:var(--r-sm);
}
.bubble p{margin:0;}
.bubble p + p{margin-top:var(--sp-2);}
.bubble b{font-weight:600;}
/* 模型输出排版：空行留白、列表用小圆点，不引入 ul 的默认缩进 */
.bubble .gap{height:6px;}
.bubble .li{padding-left:14px; position:relative;}
.bubble .li::before{
  content:'·'; position:absolute; left:3px; top:0;
  color:var(--text-3); font-weight:700;
}

.msg-meta{
  display:flex; align-items:center; gap:var(--sp-2);
  padding:0 var(--sp-1); font-size:var(--fs-xs); color:var(--text-3);
}
.msg.user .msg-meta{justify-content:flex-end;}
.copy-btn{
  border:0; background:transparent; color:var(--text-3); cursor:pointer;
  font-size:var(--fs-xs); padding:2px 6px; border-radius:var(--r-sm);
  opacity:0; transition:opacity .15s, background .15s;
}
.msg:hover .copy-btn{opacity:1;}
.copy-btn:hover{background:var(--surface-2); color:var(--text-2);}
.copy-btn:focus-visible{opacity:1; outline:2px solid var(--primary); outline-offset:2px;}

/* ---------- 结构化行程卡（助手富内容）---------- */
.plan{
  border:1px solid var(--line); border-radius:var(--r-card);
  background:var(--surface); box-shadow:var(--shadow-1); overflow:hidden;
}
.plan-head{
  display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2);
  padding:var(--sp-3) var(--sp-4); background:var(--surface-2);
  border-bottom:1px solid var(--line);
}
.plan-title{font-size:var(--fs-sm); font-weight:600;}
.plan-tag{
  font-size:var(--fs-xs); font-weight:600; color:var(--primary);
  background:var(--primary-soft); border:1px solid var(--primary-line);
  border-radius:var(--r-pill); padding:1px var(--sp-2);
}
.day{
  display:flex; gap:var(--sp-3); padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--line);
}
.day:last-child{border-bottom:0;}
.day-no{
  flex:0 0 auto; width:34px; height:22px; border-radius:var(--r-sm);
  display:grid; place-items:center; background:var(--primary-soft);
  color:var(--primary); font-size:var(--fs-xs); font-weight:700;
}
.day-txt{min-width:0;}
.day-txt b{display:block; font-size:var(--fs-sm); font-weight:600; line-height:1.5;}
.day-txt span{display:block; font-size:var(--fs-xs); color:var(--text-2); line-height:1.6; margin-top:1px;}
.plan-foot{
  padding:var(--sp-2) var(--sp-4) var(--sp-3);
  font-size:var(--fs-xs); color:var(--text-3); background:var(--surface-2);
}
/* 编排层收敛：次要候选、检查项、投票明细默认折叠，点开才占屏 */
.fold-btn{
  display:block; width:100%; text-align:left; cursor:pointer;
  border:0; border-top:1px solid var(--line); background:var(--surface-2);
  color:var(--primary); font-size:var(--fs-xs); font-weight:600;
  padding:var(--sp-2) var(--sp-4);
}
.fold-btn:hover{background:var(--primary-soft);}
.fold-btn:focus-visible{outline:2px solid var(--primary); outline-offset:-2px;}
.fold-body[hidden]{display:none;}
.plan-empty{padding:var(--sp-3) var(--sp-4); font-size:var(--fs-xs); color:var(--text-2);}
.day-meta{color:var(--text-3);}

/* ---------- 候选景点（真实知识库结果）---------- */
.cands{
  border:1px solid var(--line); border-radius:var(--r-card);
  background:var(--surface); box-shadow:var(--shadow-1); overflow:hidden;
}
.cands-head{
  padding:var(--sp-2) var(--sp-4); background:var(--surface-2);
  border-bottom:1px solid var(--line);
  font-size:var(--fs-xs); font-weight:600; color:var(--text-2);
}
.cand{
  display:flex; align-items:baseline; gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-4); border-bottom:1px solid var(--line);
}
.cand:last-child{border-bottom:0;}
.cand b{font-size:var(--fs-sm); font-weight:600; flex:0 0 auto; max-width:46%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cand span{font-size:var(--fs-xs); color:var(--text-2); line-height:1.5; min-width:0;}

/* ---------- 待补信息（结构化补问）---------- */
.qa{
  border:1px solid var(--primary-line); border-radius:var(--r-card);
  background:var(--primary-soft); overflow:hidden;
}
.qa-head{
  padding:var(--sp-2) var(--sp-4); border-bottom:1px solid var(--primary-line);
  font-size:var(--fs-xs); font-weight:600; color:var(--primary);
}
.qa-row{padding:var(--sp-2) var(--sp-4); border-bottom:1px solid var(--primary-line);}
.qa-row:last-child{border-bottom:0;}
.qa-q{font-size:var(--fs-sm); color:var(--ink); line-height:1.6;}
.qa-h{font-size:var(--fs-xs); color:var(--text-2); line-height:1.6; margin-top:1px;}

/* ---------- 只说了一个地名时的补充选项（点一次提交，不逐条追问）---------- */
.opts{
  border:1px solid var(--line); border-radius:var(--r-card);
  background:var(--surface); box-shadow:var(--shadow-1); overflow:hidden;
}
.opts-head{
  display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-4); background:var(--surface-2);
  border-bottom:1px solid var(--line);
  font-size:var(--fs-xs); font-weight:600; color:var(--text-2);
}
.opts-body{padding:var(--sp-3) var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-3);}
.opt-label{
  display:block; margin-bottom:6px;
  font-size:var(--fs-xs); font-weight:600; color:var(--text-2);
}
.opt-label .req{color:var(--err);}
.opt-row{display:flex; flex-wrap:wrap; gap:var(--sp-2);}
.opt{
  padding:6px var(--sp-3); border:1px solid var(--line-strong); border-radius:var(--r-pill);
  background:var(--surface); color:var(--ink);
  font-size:var(--fs-sm); line-height:1.5; cursor:pointer;
  transition:border-color .15s, background .15s, color .15s;
}
.opt:hover{border-color:var(--primary-line); background:var(--primary-soft); color:var(--primary);}
.opt[aria-pressed="true"]{
  border-color:var(--primary); background:var(--primary); color:#fff; font-weight:600;
}
.opts-foot{
  display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap;
  padding:var(--sp-3) var(--sp-4); border-top:1px solid var(--line); background:var(--surface-2);
}
.opt-go{
  flex:0 0 auto; padding:6px var(--sp-4);
  border:1px solid var(--primary); border-radius:var(--r-ctl);
  background:var(--primary); color:#fff; font-size:var(--fs-sm); font-weight:600; cursor:pointer;
  transition:background .15s, border-color .15s;
}
.opt-go:hover{background:var(--primary-hover); border-color:var(--primary-hover);}
.opt-go:disabled{
  background:var(--surface); border-color:var(--line-strong); color:var(--text-3); cursor:not-allowed;
}
.opts-tip{font-size:var(--fs-xs); color:var(--text-3); line-height:1.5;}
/* 日历选择器：日期用原生控件点，不用手打 YYYY-MM-DD */
.opt-date{
  padding:5px var(--sp-2); border:1px solid var(--line-strong);
  border-radius:var(--r-ctl); background:var(--surface); color:var(--ink);
  font-size:var(--fs-sm); font-family:inherit;
}
.opt-date:focus{outline:2px solid var(--primary-line); outline-offset:1px; border-color:var(--primary);}
/* 卡片里混排的只读提示行（遇到没有对应控件的补问项时降级成文字） */
.opts-body .qa-q{font-size:var(--fs-sm); color:var(--ink);}
.opts-body .qa-h{font-size:var(--fs-xs); color:var(--text-2); margin-top:2px;}
/* 不想选天数时的出口：只看候选景点 */
.opt-skip{
  flex:0 0 auto; margin-left:auto;
  border:0; border-bottom:1px solid var(--line-strong); background:transparent;
  color:var(--text-2); font-size:var(--fs-xs); line-height:1.5;
  padding:2px 0; cursor:pointer;
}
.opt-skip:hover{color:var(--primary); border-bottom-color:var(--primary-line);}
.opt-skip:disabled{color:var(--text-3); border-bottom-color:var(--line); cursor:not-allowed;}

/* ---------- 草案检查：高危提示用边框与文字双重信号 ---------- */
.warn{
  padding:var(--sp-2) var(--sp-3); border-radius:var(--r-ctl);
  font-size:var(--fs-xs); line-height:1.6;
  border-left:3px solid var(--line-strong); background:var(--surface-2); color:var(--text-2);
}
.warn.high{border-left-color:var(--err); background:#fef2f2; color:#991b1b;}
.warn.med{border-left-color:#b45309; background:#fffbeb; color:#92400e;}

/* ---------- 天气 / 景点这类小表格：数据是查回来的，排版只求一眼读完 ---------- */
.wx{border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; background:var(--surface);}
.wx-h{
  padding:var(--sp-2) var(--sp-3); background:var(--surface-2);
  border-bottom:1px solid var(--line); font-size:var(--fs-xs); color:var(--text-2);
}
.wx-row{
  display:grid; grid-template-columns:64px minmax(0,1fr) auto; gap:var(--sp-2);
  align-items:center; padding:var(--sp-2) var(--sp-3); border-top:1px solid var(--line);
  font-size:var(--fs-sm);
}
.wx-row:first-of-type{border-top:0;}
.wx-row .d{color:var(--text-2); font-size:var(--fs-xs); font-variant-numeric:tabular-nums;}
.wx-row .t{color:var(--text-2); font-size:var(--fs-xs); text-align:right; font-variant-numeric:tabular-nums;}
/* 景点卡专用：名字占主列，评分与票价各一列；票价原文可 hover 查看全文 */
.places .wx-row{grid-template-columns:minmax(0,1fr) auto minmax(0,38%); align-items:start;}
.places .wx-row .d{color:var(--text); font-size:var(--fs-sm); font-variant-numeric:normal; line-height:1.45;}
.places .wx-row .d .sub{display:block; margin-top:2px; color:var(--text-3); font-size:var(--fs-xs);}
.places .wx-row .rate{color:var(--primary); font-size:var(--fs-xs); white-space:nowrap; padding-top:2px;}
.places .wx-row .t{white-space:normal; word-break:break-word; line-height:1.45;}
.places .wx-row .t.unknown{color:var(--text-3);}
.places .wx-row .t .tk-badge{
  display:inline-block; margin-right:4px; padding:0 4px; border-radius:3px;
  font-size:10px; line-height:1.5; vertical-align:1px;
  color:var(--text-3); border:1px solid var(--line);
}
.places .wx-row .t .tk-badge.ok{color:var(--primary); border-color:var(--primary);}
.route .route-sum{padding:8px 12px 2px; font-size:var(--fs-sm); line-height:1.5;}
.route .route-step{display:flex; gap:8px; padding:5px 12px; border-top:1px solid var(--line); align-items:baseline;}
.route .route-step .route-ix{flex:1 1 auto; min-width:0; font-size:var(--fs-xs); color:var(--text-2); line-height:1.5;}
.route .route-step .route-meta{flex:0 0 auto; font-size:var(--fs-xs); color:var(--text-3); white-space:nowrap;}
/* 评价数可点开：说明评分来源，并给地图官方评论页入口（评论正文不在本系统） */
.places .wx-row .d .sub .review-toggle{
  border:0; background:none; padding:0; margin:0; cursor:pointer;
  color:var(--primary); font:inherit; text-decoration:underline; text-underline-offset:2px;
}
.places .review-panel{
  padding:var(--sp-2) var(--sp-3); border-top:1px solid var(--line);
  background:var(--surface-2); font-size:var(--fs-xs); color:var(--text-2); line-height:1.6;
}
.places .review-panel[hidden]{display:none;}
.places .review-panel .rp-line{color:var(--text);}
.places .review-panel .rp-note{color:var(--text-3);}
.places .review-panel a{
  display:inline-block; margin-top:var(--sp-1); color:var(--primary);
  text-decoration:underline; text-underline-offset:2px;
}
.places .wx-link{padding:var(--sp-1) var(--sp-3); font-size:var(--fs-xs); color:var(--primary);}
.places .wx-link a{color:inherit; text-decoration:underline; text-underline-offset:2px;}
.wx-tip{
  padding:var(--sp-2) var(--sp-3); border-top:1px solid var(--line);
  background:var(--surface-2); font-size:var(--fs-xs); color:var(--text-3);
}

/* ---------- 评委投票 ---------- */
.vote{border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; background:var(--surface);}
.vote-h{
  padding:var(--sp-2) var(--sp-3); background:var(--surface-2);
  border-bottom:1px solid var(--line); font-size:var(--fs-xs); color:var(--text-2);
}
.vote-win{
  padding:var(--sp-2) var(--sp-3); font-size:var(--fs-sm); font-weight:600;
  color:var(--primary); background:var(--primary-soft);
}
.vote-row{
  display:grid; grid-template-columns:56px minmax(0,1fr); gap:var(--sp-2);
  align-items:center; padding:var(--sp-2) var(--sp-3); border-top:1px solid var(--line);
  font-size:var(--fs-sm);
}
.vote-row:first-of-type{border-top:0;}
.vote-row .d{color:var(--text-2); font-size:var(--fs-xs); font-variant-numeric:tabular-nums;}
.vote-tip{
  padding:var(--sp-2) var(--sp-3); border-top:1px solid var(--line);
  background:var(--surface-2); font-size:var(--fs-xs); color:var(--text-3);
}

/* ---------- 追问 chips ---------- */
.chips{display:flex; flex-wrap:wrap; gap:var(--sp-2); margin-top:2px;}
.chip{
  padding:6px var(--sp-3); border:1px solid var(--line-strong); border-radius:var(--r-pill);
  background:var(--surface); color:var(--text-2); font-size:var(--fs-xs); cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
}
.chip:hover{border-color:var(--primary-line); background:var(--primary-soft); color:var(--primary);}

/* ---------- 打字指示 ---------- */
.typing{display:inline-flex; align-items:center; gap:5px; padding:var(--sp-4) var(--sp-4);}
.typing span{
  width:7px; height:7px; border-radius:50%; background:var(--text-3);
  animation:blink 1.2s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:.18s;}
.typing span:nth-child(3){animation-delay:.36s;}
@keyframes blink{0%,80%,100%{opacity:.25; transform:translateY(0);} 40%{opacity:1; transform:translateY(-2px);}}

/* ---------- 空状态（首页即功能，非事后补）---------- */
.empty{
  max-width:680px; margin:0 auto; padding:var(--sp-6) 0; flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
}
.empty .mark-lg{
  width:56px; height:56px; border-radius:var(--r-card); display:grid; place-items:center;
  background:var(--primary); color:#fff; font-size:var(--fs-lg); font-weight:700;
  box-shadow:var(--shadow-2); margin-bottom:var(--sp-6);
}
.empty h1{font-size:var(--fs-xl); font-weight:600; line-height:1.35; margin:0 0 var(--sp-2);}
.empty p{font-size:var(--fs-sm); color:var(--text-2); line-height:1.7;
  max-width:46ch; margin:0 0 var(--sp-8);}
.suggests{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); width:100%;}
.suggest{
  text-align:left; padding:var(--sp-3) var(--sp-4);
  border:1px solid var(--line); border-radius:var(--r-card); background:var(--surface);
  cursor:pointer; box-shadow:var(--shadow-1); transition:border-color .15s, box-shadow .15s, transform .15s;
}
.suggest:hover{border-color:var(--primary-line); box-shadow:var(--shadow-2); transform:translateY(-1px);}
.suggest b{display:block; font-size:var(--fs-sm); font-weight:600; margin-bottom:2px;}
.suggest span{font-size:var(--fs-xs); color:var(--text-3); line-height:1.6;}

/* ---------- 输入区（本页唯一主操作）---------- */
.composer{
  border-top:1px solid var(--line); background:var(--surface);
  padding:var(--sp-3) var(--sp-6) var(--sp-4);
}
.composer-inner{max-width:760px; margin:0 auto;}
.input-box{
  display:flex; align-items:flex-end; gap:var(--sp-2);
  border:1px solid var(--line-strong); border-radius:var(--r-card);
  background:var(--surface); padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3);
  box-shadow:var(--inset); transition:border-color .15s, box-shadow .15s;
}
.input-box:focus-within{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft), var(--inset);
}
#input{
  flex:1; min-width:0; border:0; background:transparent; resize:none;
  padding:var(--sp-2) 0; font-size:var(--fs-sm); line-height:1.6; color:var(--ink);
  font-family:inherit; outline:none; max-height:168px;
}
#input::placeholder{color:var(--text-3);}
.send{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:var(--sp-1);
  padding:var(--sp-2) var(--sp-4); border:1px solid var(--primary);
  border-radius:var(--r-ctl); background:var(--primary); color:#fff;
  font-size:var(--fs-sm); font-weight:600; cursor:pointer;
  transition:background .15s, border-color .15s, opacity .15s;
}
.send:hover{background:var(--primary-hover); border-color:var(--primary-hover);}
.send:disabled{
  background:var(--surface-2); border-color:var(--line-strong); color:var(--text-3);
  cursor:not-allowed;
}
.composer-hint{
  display:flex; justify-content:space-between; gap:var(--sp-2);
  margin-top:var(--sp-2); padding:0 var(--sp-1);
  font-size:var(--fs-xs); color:var(--text-3);
}
.composer-hint .grad{color:var(--text-3);}

/* ---------- 移动端遮罩 ---------- */
.overlay{
  display:none; position:fixed; inset:0; background:rgba(15,23,42,.35); z-index:40;
}
.overlay.show{display:block;}

/* ---------- 响应式（§3.7 断点 860）---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr;}
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; width:280px; z-index:50;
    transform:translateX(-100%); transition:transform .22s ease;
    box-shadow:var(--shadow-3);
  }
  .sidebar.open{transform:none;}
  .menu-btn{display:inline-flex;}
  .chat-head{padding:var(--sp-3) var(--sp-4);}
  .messages{padding:var(--sp-6) var(--sp-4) var(--sp-4);}
  .composer{padding:var(--sp-3) var(--sp-4) var(--sp-4);}
  .body{max-width:84%;}
  .empty{padding:var(--sp-4) 0;}
  .empty h1{font-size:var(--fs-lg);}
  .suggests{grid-template-columns:1fr;}
  .composer-hint .grad{display:none;}
  /* 窄屏候选行改两行：名称独占一行，元信息换行，避免名称被截成省略号 */
  .cand{flex-wrap:wrap; gap:2px;}
  .cand b{max-width:100%;}
  /* 窄屏只留退出，用户名与在线标记让位给标题 */
  .chip-status{display:none;}
  .head-user .who{display:none;}
  /* 选项卡底部：按钮与「先看看景点」同一行，提示独占一行放最底，少占一行高度 */
  .opts-foot{row-gap:var(--sp-2);}
  .opt-go{order:1;}
  .opt-skip{order:2;}
  .opts-tip{order:3; flex:1 1 100%;}
}

/* ---------- 焦点可见（键盘可达）---------- */
:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
button:focus:not(:focus-visible){outline:none;}
.visually-hidden{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
</style>
</head>
<body>
<div class="app">
  <div class="overlay" id="overlay"></div>

  <!-- ============ 侧栏 ============ -->
  <aside class="sidebar" id="sidebar" aria-label="会话历史">
    <div class="side-head">
      <div class="brand"><span class="mark">旅</span>旅行助手</div>
    </div>
    <button class="btn-new" id="newChat" type="button"><span class="plus">＋</span>新对话</button>
    <div class="conv-scroll">
      <div class="glabel">最近对话</div>
      <div id="convList"></div>
      <div class="conv-empty" id="convEmpty">还没有对话。问一句「武汉两天怎么玩」就开始。</div>
    </div>
    <div class="side-foot">
      <span class="dot" aria-hidden="true"></span>
      <span>知识库 · 7745 个景点</span>
      <a class="foot-link" href="/api-console.html">接口测试台</a>
    </div>
  </aside>

  <!-- ============ 主对话区 ============ -->
  <main class="chat">
    <header class="chat-head">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="打开会话列表">☰</button>
      <div class="head-txt">
        <div class="t" id="chatTitle">新的对话</div>
        <div class="s">基于景区知识库 + 实时地图的行程规划</div>
      </div>
      <div class="head-spacer"></div>
      <span class="chip-status"><span class="dot" aria-hidden="true"></span>在线</span>
      <div class="head-user">
        <span class="who" id="whoName"></span>
        <button class="quit" id="logoutBtn" type="button">退出</button>
      </div>
    </header>

    <div class="messages" id="messages" aria-live="polite">
      <div class="stream" id="stream">
        <!-- 空状态：首页即功能 -->
        <div class="empty" id="empty">
          <div class="mark-lg" aria-hidden="true">旅</div>
          <h1>今天想去哪儿？</h1>
          <p>告诉我目的地、天数或偏好，我会结合景区知识库与实时路况，给出可执行的每日行程。</p>
          <div class="suggests" id="suggests">
            <button class="suggest" type="button" data-q="帮我规划云南 5 天行程">
              <b>云南 5 天行程</b><span>昆明 · 大理 · 丽江，含每日安排</span>
            </button>
            <button class="suggest" type="button" data-q="武汉周末两天怎么玩">
              <b>武汉两日游</b><span>黄鹤楼、东湖与本地小吃</span>
            </button>
            <button class="suggest" type="button" data-q="黄鹤楼开放时间和门票">
              <b>查景点信息</b><span>开放时间、门票与坐标核验</span>
            </button>
            <button class="suggest" type="button" data-q="带老人小孩，行程别太赶">
              <b>定制节奏</b><span>按人群调整强度与通勤</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <div class="input-box">
          <label class="visually-hidden" for="input">输入你的旅行需求</label>
          <textarea id="input" rows="1" placeholder="说说目的地、天数和偏好…"></textarea>
          <button class="send" id="send" type="button" disabled>发送</button>
        </div>
        <div class="composer-hint">
          <span>Enter 发送 · Shift + Enter 换行</span>
          <span class="grad">行程建议仅供参考，门票与开放时间以景区公告为准</span>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
/* ==================================================================
   交互：发送 → POST /api/agent/invoke（L1 编排层）→ 打字输出 → 渲染真实草案
   页面不内置任何演示回复；会话与消息落在 localStorage。
   ================================================================== */
(function(){
  var stream   = document.getElementById('stream');
  var empty    = document.getElementById('empty');
  var messages = document.getElementById('messages');
  var input    = document.getElementById('input');
  var sendBtn  = document.getElementById('send');
  var newChat  = document.getElementById('newChat');
  var chatTitle= document.getElementById('chatTitle');
  var sidebar  = document.getElementById('sidebar');
  var overlay  = document.getElementById('overlay');
  var menuBtn  = document.getElementById('menuBtn');
  var convList = document.getElementById('convList');
  var convEmpty= document.getElementById('convEmpty');

  var busy = false;
  var currentId = null;

  /* ================================================================
     一、自然语言 → 后端 destination
     后端按「城市 / 省份」索引检索（cityIndex 收录省份别名），
     所以省份也能直接当目的地，且覆盖面更广。这里只做确定性收敛，
     识别不出地名就如实问一句，不猜城市。
     ================================================================ */
  var REGIONS = ['内蒙古','黑龙江','香港','澳门','北京','天津','上海','重庆','河北','山西',
    '辽宁','吉林','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东',
    '广西','海南','四川','贵州','云南','西藏','陕西','甘肃','青海','宁夏','新疆','台湾'];

  var CITIES = ['呼和浩特','乌鲁木齐','哈尔滨','石家庄','秦皇岛','张家界','景德镇','西双版纳',
    '香格里拉','呼伦贝尔','凤凰','曲阜','泰安','洛阳','开封','敦煌','桂林','阳朔','北海',
    '三亚','海口','腾冲','大理','丽江','昆明','贵阳','荔波','安顺','成都','乐山','峨眉山',
    '都江堰','九寨沟','西安','延安','兰州','西宁','银川','喀什','拉萨','林芝','武汉','宜昌',
    '襄阳','长沙','株洲','岳阳','常德','广州','深圳','珠海','佛山','惠州','中山','江门',
    '汕头','湛江','南宁','厦门','福州','泉州','青岛','济南','烟台','威海','郑州','南京',
    '苏州','无锡','常州','扬州','镇江','徐州','杭州','宁波','绍兴','嘉兴','湖州','舟山',
    '黄山','合肥','南昌','九江','上饶','太原','大同','平遥','沈阳','大连','长春','绵阳','宜宾',
    // 湖北全部地市州：知识库里都有条目，之前漏配会让「十堰」这类地名被误判为识别不出
    '十堰','恩施','荆州','孝感','黄冈','咸宁','随州','鄂州','黄石','荆门','神农架',
    // 其他常见旅游城市补充
    '唐山','保定','承德','焦作','安阳','南阳','信阳','淄博','潍坊','济宁','临沂',
    '吐鲁番','库尔勒','克拉玛依','张掖','嘉峪关','天水','酒泉','中卫','格尔木'];

  /* 常见景区 → 所在城市：用户很少直接说城市名 */
  var SPOT_ALIAS = {
    '黄鹤楼':'武汉','东湖':'武汉','户部巷':'武汉','湖北省博物馆':'武汉','楚河汉街':'武汉',
    '西湖':'杭州','灵隐寺':'杭州','千岛湖':'杭州','拙政园':'苏州','周庄':'苏州','乌镇':'嘉兴',
    '故宫':'北京','天安门':'北京','颐和园':'北京','八达岭':'北京','长城':'北京',
    '外滩':'上海','豫园':'上海','迪士尼':'上海','兵马俑':'西安','大雁塔':'西安','华清池':'西安',
    '鼓浪屿':'厦门','曾厝垵':'厦门','洱海':'大理','苍山':'大理','双廊':'大理',
    '玉龙雪山':'丽江','束河':'丽江','泸沽湖':'丽江','乐山大佛':'乐山','漓江':'桂林',
    '亚龙湾':'三亚','天涯海角':'三亚','张家界国家森林公园':'张家界','布达拉宫':'拉萨',
    '泰山':'泰安','三孔':'曲阜','云冈石窟':'大同','青海湖':'西宁','茶卡盐湖':'西宁',
    '莫高窟':'敦煌','鸣沙山':'敦煌','黄果树':'安顺','小七孔':'荔波',
    '武当山':'十堰','太极湖':'十堰','明显陵':'荆门','神农架':'神农架'
  };

  /**
   * 静态表命中：景区别名 → 城市 → 省份，取最长匹配（更具体的优先）。
   * 表里没配到的地名不再直接判「识别不出」，交给 resolvePlace 问后端。
   */
  function pickPlaceStatic(text){
    var t = text || '';
    var aliasHit = null;
    Object.keys(SPOT_ALIAS).forEach(function(k){
      if(t.indexOf(k) >= 0 && (!aliasHit || k.length > aliasHit.length)) aliasHit = k;
    });
    if(aliasHit) return { name: SPOT_ALIAS[aliasHit], via: aliasHit };
    var cityHit = longestHit(t, CITIES);
    if(cityHit) return { name: cityHit, via: cityHit };
    var regionHit = longestHit(t, REGIONS);
    if(regionHit) return { name: regionHit, via: regionHit };
    return null;
  }
  function longestHit(t, list){
    var hit = null;
    for(var i=0;i<list.length;i++){
      if(t.indexOf(list[i]) >= 0 && (!hit || list[i].length > hit.length)) hit = list[i];
    }
    return hit;
  }

  /* 去掉语气、动词和已解析的数量词，留下的片段才可能是地名。长词放前面，避免被短词先切掉。
     末尾的「玩 / 游 / 耍」必须一起剥：否则「恩施玩」会拿整串去查，永远查不到。 */
  var PLACE_NOISE = /(帮我|麻烦|请问|请|我想要|我想|我要|我们|我|打算|计划|准备|想去|要去|去|到|在|从|出发|游玩|旅游|旅行|度假|逛逛|看看|转转|走走|好玩|行程|安排|规划|推荐|一下|怎么|如何|几天|周末|自驾|老人|小孩|一家人|一家老小|玩|游|耍)/g;

  /** 从整句里猜出 1~3 个候选地名片段，交给后端核实。 */
  function placeCandidates(text){
    var s = String(text || '')
      .replace(/\d+\s*(天|日|晚)/g, ' ')
      .replace(/\d+\s*(人|位)/g, ' ')
      .replace(/预算[^，。！？\s]*/g, ' ')
      .replace(PLACE_NOISE, ' ')
      .replace(/[，。！？、,.!?；;：:\s]+/g, ' ')
      .trim();
    if(!s) return [];
    var out = [];
    s.split(' ').forEach(function(seg){
      seg = seg.trim().replace(/^[去到在从]/, '').replace(/[玩游耍了的呢吗吧呀啊嘛]+$/, '');
      if(seg.length < 2) return;
      [seg, seg.replace(/(市|省|县|区|景区|风景区)$/, '')].forEach(function(v){
        if(v.length >= 2 && v.length <= 10 && out.indexOf(v) < 0) out.push(v);
      });
    });
    return out.slice(0, 3);
  }

  function fetchAttractions(param, value){
    var q = param + '=' + encodeURIComponent(value) + '&limit=1';
    return fetch('/api/attractions?' + q, { credentials:'same-origin' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });
  }

  /**
   * 美食推荐需要一个带坐标的锚点（Provider 不按城市中心兜底）。
   * 取该城市景点库第一条的 id 交给编排层，由后端从索引里取坐标；
   * 拿不到就返回 null，界面会如实说「没有可用锚点」，不编地址。
   */
  async function foodAnchor(city){
    var r = await fetchAttractions('city', city);
    return (r && r.items && r.items.length && r.items[0].id) ? r.items[0].id : null;
  }

  /**
   * 前端静态表只是个快速路径，知识库才是唯一事实源：
   * 先按城市查，再按景点名查并取它所在的城市（「武当山」→ 十堰）。
   * 两条都查不到再交给后端做第三级判断（模型在已知城市清单里归类，
   * 「黄梅」→ 黄冈），最后才如实追问 —— 不猜城市，也不让用户重打字。
   */
  async function resolvePlace(text){
    var hit = pickPlaceStatic(text);
    if(hit) return hit;
    var cands = placeCandidates(text);
    for(var i=0;i<cands.length;i++){
      var c = cands[i];
      var byCity = await fetchAttractions('city', c);
      if(byCity && byCity.matched > 0 && byCity.items && byCity.items.length){
        var a = byCity.items[0];
        return { name: a.city || c, via: c };
      }
      var byName = await fetchAttractions('name', c);
      if(byName && byName.matched > 0 && byName.items && byName.items.length){
        var b = byName.items[0];
        return { name: b.city || b.province || c, via: c };
      }
    }
    var guess = await askPlace(text, cands);
    if(guess && guess.resolved && guess.city){
      return {
        name: guess.city,
        via: guess.spot || (cands[0] || String(text || '').trim()),
        note: guess.note || '',
        source: guess.source || 'llm'
      };
    }
    return {
      miss: true,
      tried: cands,
      alternatives: (guess && guess.alternatives) || [],
      note: (guess && guess.note) || ''
    };
  }

  /** 第三级：后端按「知识库 → 模型判断 → 字面相近」给结论。 */
  function askPlace(text, cands){
    return fetch('/api/places/resolve', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: String(text || '').slice(0, 120),
        candidates: (cands || []).slice(0, 5)
      })
    }).then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });
  }

  var CN_NUM = {'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};

  function parseDays(t){
    var m = t.match(/(\d+)\s*天/);
    if(m){ var n = parseInt(m[1], 10); return (n > 0 && n <= 30) ? n : null; }
    m = t.match(/([一两二三四五六七八九十])\s*天/);
    if(m) return CN_NUM[m[1]] || null;
    if(/一周|一个星期/.test(t)) return 7;
    if(/周末/.test(t)) return 2;
    return null;
  }
  /** 人数只认显式写法，不按「带老人小孩」推断。 */
  function parseTravelers(t){
    var m = t.match(/(\d+)\s*(?:人|位)/);
    if(m){ var n = parseInt(m[1], 10); return (n > 0 && n <= 30) ? n : null; }
    if(/两个人|二人|情侣|夫妻/.test(t)) return 2;
    return null;
  }
  function parseBudget(t){
    var m = t.match(/预算\s*(?:是|为|在|不超过|控制在|大概)?\s*(\d{2,6})/);
    return m ? parseInt(m[1], 10) : null;
  }
  var PREF_RULES = [
    [/人文|历史|博物馆|古迹|古镇|文化/, '人文'],
    [/自然|山水|风景|看海|爬山|登山|森林|草原/, '自然'],
    [/亲子|小孩|孩子|儿童|带娃/, '亲子'],
    [/美食|小吃|好吃|火锅|餐厅/, '美食'],
    [/摄影|拍照|出片/, '摄影'],
    [/购物|逛街|免税/, '购物'],
    [/夜景|夜游/, '夜游'],
    [/温泉|泡汤/, '温泉'],
    [/海岛|沙滩|潜水/, '海岛'],
    [/慢|不赶|轻松|悠闲/, '慢节奏']
  ];
  function parsePrefs(t){
    var out = [];
    PREF_RULES.forEach(function(r){ if(r[0].test(t) && out.indexOf(r[1]) < 0) out.push(r[1]); });
    return out;
  }

  /* ================================================================
     一·补、只说了一个地名时的选项
     用户打「武当山」这种纯地名，天数、人数、偏好全都缺。直接扔一堆候选
     会让人不知道下一步做什么，所以先给一组可点选的按钮，选完拼成一句
     新消息重新提交 —— 不新增后端接口，对话记录里也是正常的人话。
     ================================================================ */
  var CHOICE_GROUPS = [
    { key:'days', label:'玩几天', required:true, multi:false,
      options:[
        { v:1, t:'1 天' }, { v:2, t:'2 天' }, { v:3, t:'3 天' },
        { v:5, t:'5 天' }, { v:7, t:'7 天' }
      ] },
    { key:'travelers', label:'同行人', required:false, multi:false,
      options:[
        { v:1, t:'一个人' }, { v:2, t:'两个人' },
        { v:3, t:'三个人' }, { v:4, t:'四个人' }
      ] },
    { key:'prefs', label:'偏好（可不选，也能多选）', required:false, multi:true,
      options:[
        { v:'自然', t:'自然风光' }, { v:'人文', t:'人文古迹' },
        { v:'美食', t:'本地美食' }, { v:'慢节奏', t:'节奏慢一点' },
        { v:'亲子', t:'带娃出游' }, { v:'摄影', t:'拍照出片' }
      ] }
  ];
  /* 选项值 → 拼进消息里的说法（说法本身要能被 parsePrefs 的规则命中） */
  var PREF_TEXT = { '自然':'自然风光','人文':'人文古迹','美食':'本地美食',
                    '慢节奏':'节奏慢一点','亲子':'带娃出游','摄影':'拍照出片' };

  /* 是否要先弹选项卡，由后端解析出的 days 决定（见 respond），不再用正则判断：
     「玩四天」「下周六出发」这类说法正则认不出来。 */

  /* ================================================================
     二、会话存储（localStorage）
     只存裁剪后的草案字段，避免候选全文把配额撑爆。
     ================================================================ */
  var STORE_KEY = 'travel.chat.sessions.v1';
  var MAX_SESSIONS = 30;
  var MAX_MESSAGES = 60;

  function loadSessions(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return [];
      var d = JSON.parse(raw);
      if(!d || !Array.isArray(d.sessions)) return [];
      // 旧版本或异常数据兜底：没有 messages 数组的条目直接丢弃
      return d.sessions.filter(function(s){
        return s && s.id && Array.isArray(s.messages);
      });
    }catch(e){ return []; }
  }
  function saveSessions(){
    var payload = JSON.stringify({ v:1, sessions: sessions.slice(0, MAX_SESSIONS) });
    try{
      localStorage.setItem(STORE_KEY, payload);
    }catch(e){
      // 配额满：只留最近 8 条再试，仍失败就放弃本次写入（页面照常可用）
      try{ localStorage.setItem(STORE_KEY, JSON.stringify({ v:1, sessions: sessions.slice(0,8) })); }
      catch(e2){ /* 忽略 */ }
    }
  }

  var sessions = loadSessions();

  function uuid(){
    return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function currentSession(){
    for(var i=0;i<sessions.length;i++){ if(sessions[i].id === currentId) return sessions[i]; }
    return null;
  }
  function createSession(){
    var s = { id: uuid(), title: '新的对话', createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
    sessions.unshift(s);
    // 清掉之前的空会话：反复点「新对话」只保留最新这一条空条目
    sessions = sessions.filter(function(x){
      return x.id === s.id || (x.messages && x.messages.length);
    });
    if(sessions.length > MAX_SESSIONS) sessions.length = MAX_SESSIONS;
    currentId = s.id;
    renderConvList();
    saveSessions();
    return s;
  }
  function addMessage(s, msg){
    s.messages.push(msg);
    if(s.messages.length > MAX_MESSAGES) s.messages.shift();
    s.updatedAt = Date.now();
    if(msg.role === 'user' && (!s.title || s.title === '新的对话')){
      s.title = msg.text.slice(0, 18);
    }
    // 最近更新的排最前，侧栏随之刷新
    sessions.sort(function(a, b){ return b.updatedAt - a.updatedAt; });
    renderConvList();
    saveSessions();
  }
  function removeSession(id){
    sessions = sessions.filter(function(s){ return s.id !== id; });
    saveSessions();
    if(currentId === id){ currentId = null; resetToEmpty(); }
    renderConvList();
  }

  /* ================================================================
     三、草案 → 视图
     后端给的是「事实 + 规则判断」，这里只排版，不改写结论、不补数字。
     ================================================================ */
  function fmt(v){
    return (v === null || v === undefined || v === '' || v === '暂无') ? '未知' : String(v);
  }

  /** 票价与开放时间原文可能上百字，卡片里只留能读的一截。 */
  function trunc(s, n){
    var t = String(s == null ? '' : s);
    return t.length > n ? t.slice(0, n) + '…' : t;
  }

  /** 票价常带一长串括号说明，优先在分号/括号处断开，避免截成半句。 */
  function brief(s, n){
    var t = String(s == null ? '' : s);
    var head = t.split(/[；;(（]/)[0];
    if(head && head.trim().length >= 2) t = head.trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
  }

  /**
   * 票价原文一律整段显示，不截断也不在括号处分句。
   * 票价里「旺季」「成人票」这类词后面紧跟的就是数字，切一刀只剩下标签没有价格：
   * 例如「旺季(1-11月)25元/淡季(12月)20元」按括号切完只剩「旺季」两个字。
   */
  function ticketText(v){
    var t = String(v == null ? '' : v).trim();
    if(!t || t === '暂无' || t === '未知') return '';
    return t.replace(/\s+/g, ' ');
  }

  /** 票价状态只分三种，未收录与未核验不是一回事，不能混成一句话。 */
  function ticketState(row){
    if(ticketText(row.ticket)) return String(row.ticketStatus || '') === 'verified' ? 'verified' : 'raw';
    return (row.ticketStatus === undefined && (row.address !== undefined || row.type !== undefined))
      ? 'map' : 'absent';
  }

  function ticketLabel(row){
    var text = ticketText(row.ticket);
    var state = ticketState(row);
    if(state === 'absent') return '票价未收录，以景区公告为准';
    if(state === 'map') return '地图不提供票价，以景区公告为准';
    return text;
  }

  function ticketBadge(row){
    var state = ticketState(row);
    if(state === 'verified') return '人工核验';
    if(state === 'raw') return '原文未核验';
    return '';
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  /** 打字机用的纯文本：去掉 Markdown 记号，避免 `**` 裸露。 */
  function plainText(s){
    return String(s == null ? '' : s)
      .replace(/\*\*/g, '')
      .replace(/^\s*[-*]\s+/gm, '· ');
  }

  /**
   * 轻量格式化：只认粗体、换行与「- 」列表，其余全部先转义。
   * 模型输出属于外部内容，不能直接塞进 innerHTML。
   */
  function formatRich(text){
    var lines = escapeHtml(text).split(/\r?\n/);
    var html = '';
    lines.forEach(function(line){
      var t = line.trim();
      if(!t){ html += '<div class="gap"></div>'; return; }
      t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      if(/^[-*]\s+/.test(t)){
        html += '<div class="li">' + t.replace(/^[-*]\s+/, '') + '</div>';
      } else {
        html += '<div>' + t + '</div>';
      }
    });
    return html;
  }

  function slimDraft(d){
    if(!d) return null;
    return {
      advice: d.advice || null,
      // 请求天数 / 实际排出天数 / 收敛掉的天数：只用来显示一条说明，不铺空天
      dayScope: d.dayScope || null,
      notices: (d.notices || []).slice(0, 5),
      sources: d.sources || [],
      questions: (d.questions || []).map(function(q){
        return { code:q.code, field:q.field, question:q.question, hint:q.hint };
      }),
      checks: (d.checks || []).map(function(c){
        return { code:c.code, severity:c.severity, message:c.message, suggestion:c.suggestion };
      }),
      // 景点 record 的 JSON 键是 open_time（@JsonProperty），不是 openTime
      candidates: (d.candidates || []).slice(0, 8).map(function(a){
        return { name:a.name, city:a.city, level:a.level, rating:a.rating,
                 ticket:a.ticket, openTime:a.open_time };
      }),
      dailySchedules: (d.dailySchedules || []).map(function(x){
        return {
          dayIndex: x.dayIndex, date: x.date, note: x.note,
          items: (x.items || []).map(function(i){
            return { name:i.name, city:i.city, ticket:i.ticket,
                     openTime:i.openTime, unknowns:i.unknowns || [] };
          })
        };
      }),
      budgetEstimate: d.budgetEstimate || null,
      generatedAt: d.generatedAt || null
    };
  }

  /** 没有模型建议时，用检索结果拼一句如实的开场，不虚构行程内容。 */
  function headline(view, place){
    if(view.advice) return view.advice;
    var parts = [];
    if(view.candidates.length){
      parts.push('已从景区知识库检索到「' + place + '」的 ' + view.candidates.length +
                 ' 个候选景点，按等级与评分排序。');
    } else {
      parts.push('知识库里没有检索到「' + place + '」的景点记录。');
    }
    if(view.dailySchedules.length){
      parts.push('按 ' + view.dailySchedules.length + ' 天给出逐日草案，只排有可查景点的天；' +
                 '具体游览时刻没有依据，留给你确认。');
      var trimmed = ((view.dayScope || {}).trimmedDays) || 0;
      if(trimmed) parts.push('还有 ' + trimmed + ' 天没有可查景点，没有硬凑空天。');
    } else {
      parts.push('这轮没有可排的候选，告诉我玩几天、或换个目的地再试。');
    }
    var warn = view.checks.filter(function(c){ return c.severity === 'HIGH'; });
    if(warn.length) parts.push('有 ' + warn.length + ' 项需要先处理（见下方提示）。');
    return parts.join('');
  }

  /** 通用折叠：次要信息不默认占屏，点开才显示（DOM 已建好，只是 hidden）。 */
  function foldBlock(box, label, render){
    var body = el('div','fold-body');
    body.hidden = true;
    render(body);
    var btn = el('button','fold-btn');
    btn.type = 'button';
    btn.setAttribute('aria-expanded','false');
    btn.textContent = label + ' ▾';
    btn.addEventListener('click', function(){
      var open = body.hidden;
      body.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.textContent = label + (open ? ' ▴' : ' ▾');
    });
    box.appendChild(btn);
    box.appendChild(body);
  }

  /**
   * 逐日草案：编排层已只给有候选的天，这里再兜一层（历史消息可能仍带空天）。
   * 票价与开放时间压成一行小字，长篇 note 不逐天重复；收敛掉的天合并成一条说明。
   */
  function planCard(days, view){
    var all = days || [];
    var filled = all.filter(function(d){ return d && d.items && d.items.length; });
    var emptyDays = all.length - filled.length;
    var trimmed = Number(((view && view.dayScope) || {}).trimmedDays || 0);
    var box = el('div','plan');
    var head = el('div','plan-head');
    var title = el('span','plan-title');
    title.textContent = '逐日草案';
    var tag = el('span','plan-tag');
    tag.textContent = filled.length + ' 天';
    head.appendChild(title);
    head.appendChild(tag);
    box.appendChild(head);

    if(!filled.length){
      var none = el('div','plan-empty');
      none.textContent = '本轮没有可排的候选景点，未生成空天。';
      box.appendChild(none);
    }
    filled.forEach(function(d){
      var row = el('div','day');
      var no = el('span','day-no');
      no.textContent = 'D' + d.dayIndex;
      row.appendChild(no);

      var txt = el('div','day-txt');
      var b = el('b');
      b.textContent = d.items.map(function(i){ return i.name; }).join(' · ');
      txt.appendChild(b);

      if(d.items.length){
        // 一个景点一行：窄屏下把几个景点挤在「；」分隔的一行里很难读。
        // 票价整段显示，不在括号或分号处截断——截断后会只剩「旺季」这类标签而没有价格。
        d.items.forEach(function(i){
          var line = el('span');
          var parts = ['票价 ' + (ticketText(i.ticket) || '未收录')];
          var open = brief(fmt(i.openTime), 20);
          if(open !== '未知') parts.push('开放 ' + open);
          line.textContent = i.name + '：' + parts.join('，');
          txt.appendChild(line);
        });
        if(d.date){
          var dd = el('span');
          dd.textContent = d.date;
          txt.appendChild(dd);
        }
      }
      row.appendChild(txt);
      box.appendChild(row);
    });
    var left = trimmed + emptyDays;
    if(left > 0){
      var foot = el('div','plan-foot');
      foot.textContent = '另有 ' + left + ' 天没有可查景点，未硬凑空天；'
        + '可以把天数缩短到 ' + filled.length + ' 天，或补一个周边城市再排。';
      box.appendChild(foot);
    }
    return box;
  }

  /** 候选景点默认只列排序最前的 3 个，其余折叠，避免一次刷一长串。 */
  function candCard(cands){
    var box = el('div','cands');
    var head = el('div','cands-head');
    head.textContent = '候选景点 · 共 ' + cands.length + ' 个';
    box.appendChild(head);
    function addRow(target, a){
      var row = el('div','cand');
      var name = el('b');
      name.textContent = a.name;
      var meta = el('span');
      var bits = [];
      if(a.city) bits.push(a.city);
      if(a.level) bits.push(a.level);
      if(a.rating) bits.push('评分 ' + a.rating);
      bits.push('票价 ' + (ticketText(a.ticket) || '未收录'));
      meta.textContent = bits.join(' · ');
      row.appendChild(name);
      row.appendChild(meta);
      target.appendChild(row);
    }
    var shown = cands.slice(0, 3);
    shown.forEach(function(a){ addRow(box, a); });
    if(cands.length > shown.length){
      foldBlock(box, '展开其余 ' + (cands.length - shown.length) + ' 个候选', function(body){
        cands.slice(shown.length).forEach(function(a){ addRow(body, a); });
      });
    }
    return box;
  }

  /* ================================================================
     美食推荐：意图是「吃什么」时走 FOOD_RECOMMEND，渲染餐馆而不是行程。
     fact 的 value 里只有已查到的字段（名称、人均、距离、评分），
     没有门店详情与点评链接，因此这里只展示这些，不编造。
     ================================================================ */
  function foodFromEnvelope(env){
    var payload = (env && env.result) ? env.result : null;
    if(!payload) return null;
    var items = [];
    (payload.facts || []).forEach(function(f){
      if(!f || f.type !== 'CONTENT' || !f.value || f.value.category !== 'FOOD') return;
      var v = f.value;
      items.push({
        name: v.name || '',
        slot: v.mealSlot || '',
        price: v.pricePerPersonCny,
        distance: v.distanceMeters,
        rating: v.rating,
        tags: (v.tags || []).slice(0, 3)
      });
    });
    return {
      items: items,
      advice: payload.advice || null,
      notices: (payload.notices || []).slice(0, 5),
      agent: {
        providerId: env.providerId || payload.providerId || '',
        status: env.status || payload.status || '',
        attempts: env.attempts || []
      }
    };
  }

  function foodCard(items, total){
    var box = el('div','cands');
    var head = el('div','cands-head');
    head.textContent = '可以去的餐馆 · 来自地图 POI';
    box.appendChild(head);
    // 一次列三十家没人看：只展开离得最近的前几家，其余在末尾说明
    var shown = items.slice(0, 8);
    shown.forEach(function(it){
      var row = el('div','cand');
      var name = el('b');
      name.textContent = it.name;
      var meta = el('span');
      var bits = [];
      if(it.slot) bits.push(it.slot);
      if(it.price) bits.push('人均 ' + it.price + ' 元');
      if(it.distance) bits.push(Math.round(it.distance) + ' 米');
      if(it.rating) bits.push('评分 ' + it.rating);
      if(it.tags.length) bits.push(it.tags.join('/'));
      meta.textContent = bits.length ? bits.join(' · ') : '暂无更多信息';
      row.appendChild(name);
      row.appendChild(meta);
      box.appendChild(row);
    });
    if(total > shown.length){
      var more = el('div','cand');
      more.textContent = '另有 ' + (total - shown.length) + ' 家未展开，可以缩小范围再问，比如「东湖附近有什么好吃的」';
      box.appendChild(more);
    }
    return box;
  }

  /** 通用可点卡片：标题 + 一排按钮，点一下就把那句话发出去（闲聊开场、换目的地都用它）。 */
  function chipCard(title, items){
    var box = el('div','opts');
    var head = el('div','opts-head');
    head.appendChild(document.createTextNode(title));
    box.appendChild(head);
    var bodyBox = el('div','opts-body');
    var row = el('div','opt-row');
    items.forEach(function(it){
      var b = el('button','opt');
      b.type = 'button';
      b.textContent = it.text;
      b.addEventListener('click', function(){
        if(busy) return;
        Array.prototype.forEach.call(box.querySelectorAll('button'), function(x){ x.disabled = true; });
        sendText(it.send || it.text);
      });
      row.appendChild(b);
    });
    bodyBox.appendChild(row);
    box.appendChild(bodyBox);
    return box;
  }

  /* ================================================================
     补问卡片：缺什么就给什么控件
     后端的 questions 自带 field（departDate / returnDate / days /
     travelers / budget），按字段渲染成按钮与日历——日期用原生日期控件
     点选，不要求用户手打「YYYY-MM-DD」。字段没覆盖到的补问项降级成文字，
     不硬造控件。
     ================================================================ */
  var QA_KINDS = {
    departDate:{ label:'出发日期', kind:'date' },
    returnDate:{ label:'返回日期', kind:'date' },
    days:{ label:'玩几天', kind:'choice', unit:' 天', options:[1, 2, 3, 5, 7] },
    travelers:{ label:'同行人数', kind:'choice', unit:' 人', options:[1, 2, 3, 4] },
    budget:{ label:'预算上限', kind:'choice', unit:' 元', options:[2000, 5000, 10000, 15000] }
  };

  function isoDate(d){
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
  }
  function shortDate(d){
    var m = d.getMonth() + 1, day = d.getDate();
    return m + '-' + (day < 10 ? '0' + day : day);
  }
  function addDays(d, n){
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  }
  /** 本周六（今天就到周六则取今天），用于「周末出发」这类高频选择。 */
  function nextSaturday(d){
    var delta = (6 - d.getDay() + 7) % 7;
    return addDays(d, delta);
  }
  function parseISO(s){
    var p = String(s || '').split('-');
    if(p.length !== 3) return null;
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return isNaN(d.getTime()) ? null : d;
  }

  function qaCard(questions, ctx){
    var baseText = (ctx && ctx.baseText) || '';
    var box = el('div','opts');
    var head = el('div','opts-head');
    head.appendChild(document.createTextNode('补上这几项，行程就能排到具体日期'));
    var tag = el('span','plan-tag');
    tag.textContent = '点选即可';
    head.appendChild(tag);
    box.appendChild(head);

    var bodyBox = el('div','opts-body');
    var picks = {};
    // 上一轮已经说过的信息预填回来：用户在补问卡里点过的日期不该再问一次
    var dateOut = String(baseText || '').match(/(\d{4}-\d{2}-\d{2})\s*出发/);
    if(dateOut) picks.departDate = dateOut[1];
    var dateBack = String(baseText || '').match(/(\d{4}-\d{2}-\d{2})\s*返回/);
    if(dateBack) picks.returnDate = dateBack[1];
    var budgetHit = String(baseText || '').match(/预算\s*(\d{2,6})/);
    if(budgetHit) picks.budget = parseInt(budgetHit[1], 10);
    var dateInputs = {};
    var returnRow = null;

    function refresh(){
      // 统一按 data-field / data-v 回填选中态，重建行也不会留下失效引用
      Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(b){
        var f = b.getAttribute('data-field');
        if(!f) return;
        var v = b.getAttribute('data-v');
        b.setAttribute('aria-pressed', String(picks[f]) === v ? 'true' : 'false');
      });
      if(dateInputs.returnDate && picks.departDate){
        dateInputs.returnDate.min = picks.departDate;
      }
      if(go) go.disabled = busy;
    }

    function dateChips(field, row){
      var today = new Date();
      var chips;
      if(field === 'returnDate'){
        if(!picks.departDate) return;   // 没有出发日就不猜返程
        var base = parseISO(picks.departDate);
        chips = [
          { t:'当天返程', d:base },
          { t:'第 2 天返', d:addDays(base, 1) },
          { t:'第 3 天返', d:addDays(base, 2) },
          { t:'第 4 天返', d:addDays(base, 3) }
        ];
      } else {
        var sat = nextSaturday(today);
        chips = [
          { t:'今天', d:today },
          { t:'明天', d:addDays(today, 1) },
          { t:'本周六', d:sat },
          { t:'下周六', d:addDays(sat, 7) }
        ];
      }
      chips.forEach(function(c){
        var v = isoDate(c.d);
        var b = el('button','opt');
        b.type = 'button';
        b.setAttribute('data-field', field);
        b.setAttribute('data-v', v);
        b.textContent = c.t + ' ' + shortDate(c.d);
        b.addEventListener('click', function(){
          picks[field] = (picks[field] === v) ? null : v;
          if(field === 'departDate' && returnRow) fillDateRow('returnDate', returnRow);
          refresh();
        });
        row.appendChild(b);
      });
    }

    function fillDateRow(field, row){
      row.innerHTML = '';
      dateChips(field, row);
      var input = document.createElement('input');
      input.type = 'date';
      input.className = 'opt-date';
      input.title = '也可以直接在日历里选';
      input.min = (field === 'returnDate' && picks.departDate) ? picks.departDate : isoDate(new Date());
      input.value = picks[field] || '';
      input.addEventListener('change', function(){
        picks[field] = input.value || null;
        if(field === 'departDate' && returnRow) fillDateRow('returnDate', returnRow);
        refresh();
      });
      dateInputs[field] = input;
      row.appendChild(input);
      refresh();
    }

    questions.forEach(function(q){
      var spec = QA_KINDS[q.field];
      var wrap = el('div','opt-group');
      if(!spec){
        // 没有对应控件的补问项：保留原文与提示，不硬造选项
        var title = el('div','qa-q');
        title.textContent = q.question || q.code || '';
        wrap.appendChild(title);
        if(q.hint){
          var hint = el('div','qa-h');
          hint.textContent = q.hint;
          wrap.appendChild(hint);
        }
        bodyBox.appendChild(wrap);
        return;
      }

      var label = el('span','opt-label');
      label.textContent = spec.label + (spec.unit && spec.kind === 'choice' ? '（' + spec.unit.trim() + '）' : '');
      wrap.appendChild(label);

      var row = el('div','opt-row');
      if(spec.kind === 'date'){
        if(q.field === 'returnDate') returnRow = row;
        wrap.appendChild(row);
        fillDateRow(q.field, row);
      } else {
        spec.options.forEach(function(o){
          var b = el('button','opt');
          b.type = 'button';
          b.setAttribute('data-field', q.field);
          b.setAttribute('data-v', String(o));
          b.textContent = spec.unit ? o + spec.unit : String(o);
          b.addEventListener('click', function(){
            picks[q.field] = (picks[q.field] === o) ? null : o;
            refresh();
          });
          row.appendChild(b);
        });
        wrap.appendChild(row);
      }
      bodyBox.appendChild(wrap);
    });
    box.appendChild(bodyBox);

    var foot = el('div','opts-foot');
    var go = el('button','opt-go');
    go.type = 'button';
    go.textContent = '按这些重排';
    var tip = el('span','opts-tip');
    tip.textContent = '日期点日历就行，其余可以只选你清楚的。';
    var close = el('button','opt-skip');
    close.type = 'button';
    close.textContent = '先不填';
    foot.appendChild(go);
    foot.appendChild(tip);
    foot.appendChild(close);
    box.appendChild(foot);

    function compose(){
      var bits = [];
      var head0 = String(baseText || '').replace(/[，,。！？!?\s]+$/, '');
      if(picks.days){
        // 原话里已有天数时替换掉，避免「2 天…3 天」自相矛盾
        if(/\d+\s*天/.test(head0)) head0 = head0.replace(/\d+\s*天/, picks.days + ' 天');
        else bits.push(picks.days + ' 天');
      }
      if(picks.travelers) bits.push(picks.travelers + ' 人');
      if(picks.departDate) bits.push(picks.departDate + ' 出发');
      if(picks.returnDate) bits.push(picks.returnDate + ' 返回');
      if(picks.budget) bits.push('预算 ' + picks.budget);
      return head0 + (bits.length ? '，' + bits.join('，') : '');
    }

    function extraOf(){
      var extra = {};
      ['days','travelers','budget','departDate','returnDate'].forEach(function(k){
        if(picks[k]) extra[k] = picks[k];
      });
      return extra;
    }

    go.addEventListener('click', function(){
      if(busy) return;
      if(picks.departDate && picks.returnDate && picks.returnDate < picks.departDate){
        tip.textContent = '返回日期早于出发日期，改一下再排。';
        return;
      }
      go.disabled = true;
      go.textContent = '已提交';
      tip.textContent = '正在按这些信息重排…';
      close.disabled = true;
      Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(b){ b.disabled = true; });
      Array.prototype.forEach.call(box.querySelectorAll('.opt-date'), function(b){ b.disabled = true; });
      sendText(compose(), false, extraOf());
    });

    close.addEventListener('click', function(){
      if(busy) return;
      Array.prototype.forEach.call(box.querySelectorAll('button, input'), function(b){ b.disabled = true; });
      tip.textContent = '已跳过，下一句话里补充也可以。';
    });

    refresh();
    return box;
  }

  /**
   * 补充选项卡：天数必选，其余可跳过；已说过的信息会预选上，不重复问。
   * 点「生成行程」把原话 + 选择拼成一句，走正常的发送链路。
   */
  function choiceCard(baseText, place, preset){
    var state = { days:null, travelers:null, prefs:[] };
    if(preset){
      if(preset.travelers) state.travelers = preset.travelers;
      (preset.prefs || []).forEach(function(p){
        if(PREF_TEXT[p] && state.prefs.indexOf(p) < 0) state.prefs.push(p);
      });
    }

    var box = el('div','opts');
    var head = el('div','opts-head');
    head.appendChild(document.createTextNode('还差几个信息 · 按 ' + place.name + ' 规划'));
    var tag = el('span','plan-tag');
    tag.textContent = (place.via && place.via !== place.name) ? place.via : '补充信息';
    head.appendChild(tag);
    box.appendChild(head);

    var bodyBox = el('div','opts-body');
    var groups = [];
    CHOICE_GROUPS.forEach(function(g){
      var wrap = el('div','opt-group');
      var label = el('span','opt-label');
      label.innerHTML = g.label + (g.required ? '<span class="req">（必选）</span>' : '');
      wrap.appendChild(label);

      var row = el('div','opt-row');
      var btns = [];
      g.options.forEach(function(o){
        var b = el('button','opt');
        b.type = 'button';
        b.textContent = o.t;
        b.addEventListener('click', function(){
          if(g.multi){
            var i = state.prefs.indexOf(o.v);
            if(i >= 0) state.prefs.splice(i, 1); else state.prefs.push(o.v);
          } else {
            // 再点一次取消，避免点错后无法回到未选状态
            state[g.key] = (state[g.key] === o.v) ? null : o.v;
          }
          sync();
        });
        btns.push({ b:b, o:o });
        row.appendChild(b);
      });
      groups.push({ g:g, btns:btns });
      wrap.appendChild(row);
      bodyBox.appendChild(wrap);
    });
    box.appendChild(bodyBox);

    var foot = el('div','opts-foot');
    var go = el('button','opt-go');
    go.type = 'button';
    go.textContent = '生成行程';
    var tip = el('span','opts-tip');
    tip.textContent = '选好天数就能生成，其余可以跳过。';
    var skip = el('button','opt-skip');
    skip.type = 'button';
    skip.textContent = '先看看景点';
    skip.title = '不排日程，只列出知识库里的候选景点';
    foot.appendChild(go);
    foot.appendChild(tip);
    foot.appendChild(skip);
    box.appendChild(foot);

    function sync(){
      groups.forEach(function(x){
        x.btns.forEach(function(p){
          var on = x.g.multi ? state.prefs.indexOf(p.o.v) >= 0 : state[x.g.key] === p.o.v;
          p.b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      });
      go.disabled = !state.days;
    }

    function compose(){
      var bits = [];
      if(state.days) bits.push(state.days + ' 天');
      if(state.travelers) bits.push(state.travelers + ' 人');
      state.prefs.forEach(function(p){ bits.push(PREF_TEXT[p] || p); });
      var head0 = String(baseText || '').replace(/[，,。！？!?\s]+$/, '');
      return head0 + (bits.length ? '，' + bits.join('，') : '');
    }

    go.addEventListener('click', function(){
      if(go.disabled || busy) return;
      go.disabled = true;
      go.textContent = '已提交';
      tip.textContent = '正在按你的选择生成行程…';
      skip.disabled = true;
      Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(b){ b.disabled = true; });
      // 结构化值跟着一起带上：偏好词表比选项卡大（购物/夜游/温泉…），只靠拼文字会丢
      sendText(compose(), false, { days: state.days, travelers: state.travelers, prefs: state.prefs });
    });

    // 不排日程、只看候选：绕过补充信息，直接按原话检索
    skip.addEventListener('click', function(){
      if(busy) return;
      go.disabled = true;
      skip.disabled = true;
      skip.textContent = '正在检索…';
      tip.textContent = '先列出知识库里的候选景点。';
      Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(b){ b.disabled = true; });
      // 带上语义再发一次：消息记录里看得出这是一次「只看景点」的请求
      sendText(baseText + '，先看看有哪些景点', true);
    });

    sync();
    return box;
  }

  /**
   * 目的地候选：完全不认识这个地名时的出口。
   * 城市来自后端的字面相近结果（库里有谁就推荐谁，没有写死清单），点一下就换过去，
   * 不用用户把整句话重打一遍。
   */
  function destCard(cities, tried){
    var box = el('div','opts');
    var head = el('div','opts-head');
    head.appendChild(document.createTextNode('换成这些目的地试试'));
    var tag = el('span','plan-tag');
    // 未识别时 tried 可能是整句话，标签只放短词，别把整段塞进小角标
    tag.textContent = brief(tried || '未识别', 6);
    head.appendChild(tag);
    box.appendChild(head);

    var bodyBox = el('div','opts-body');
    var row = el('div','opt-row');
    cities.forEach(function(city){
      var b = el('button','opt');
      b.type = 'button';
      b.textContent = city;
      b.addEventListener('click', function(){
        if(busy) return;
        Array.prototype.forEach.call(box.querySelectorAll('button'), function(x){ x.disabled = true; });
        sendText(city);
      });
      row.appendChild(b);
    });
    bodyBox.appendChild(row);
    box.appendChild(bodyBox);
    return box;
  }

  function warnNodes(checks){
    return checks
      .filter(function(c){ return c.severity === 'HIGH' || c.severity === 'MEDIUM'; })
      .map(function(c){
        var n = el('div', 'warn ' + (c.severity === 'HIGH' ? 'high' : 'med'));
        n.textContent = c.message + (c.suggestion ? '｜' + c.suggestion : '');
        return n;
      });
  }

  /* ---------- DOM helpers ---------- */
  function el(tag, cls, html){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(html != null) n.innerHTML = html;
    return n;
  }
  function scrollBottom(){
    messages.scrollTop = messages.scrollHeight;
  }
  function hideEmpty(){
    if(empty && empty.parentNode){ empty.remove(); empty = null; }
  }
  function nowTime(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    return (h<10?'0'+h:h) + ':' + (m<10?'0'+m:m);
  }

  /* ---------- 构建消息 ---------- */
  function userMsg(text){
    var wrap = el('div','msg user');
    wrap.appendChild(el('div','avatar','我'));
    var body = el('div','body');
    var b = el('div','bubble');
    b.textContent = text;
    body.appendChild(b);
    body.appendChild(el('div','msg-meta', nowTime()));
    wrap.appendChild(body);
    return wrap;
  }

  function assistantShell(){
    var wrap = el('div','msg assistant');
    wrap.appendChild(el('div','avatar','旅'));
    var body = el('div','body');
    var b = el('div','bubble');
    body.appendChild(b);
    wrap.appendChild(body);
    return {wrap:wrap, body:body, bubble:b};
  }

  function typingMsg(){
    var wrap = el('div','msg assistant');
    wrap.appendChild(el('div','avatar','旅'));
    var body = el('div','body');
    var b = el('div','bubble typing');
    b.innerHTML = '<span></span><span></span><span></span>';
    body.appendChild(b);

  }

  function copyBtn(target){
    var b = el('button','copy-btn');
    b.type = 'button';
    b.textContent = '复制';
    b.setAttribute('aria-label','复制这条回复');
    b.addEventListener('click', function(){
      var t = target.innerText || '';
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){
          b.textContent = '已复制';
          setTimeout(function(){ b.textContent = '复制'; }, 1400);
        }).catch(function(){});
      }
    });
    return b;
  }

  /* ---------- 逐字输出 ---------- */
  function typeText(node, text){
    return new Promise(function(resolve){
      var i = 0;
      node.textContent = '';
      (function step(){
        if(i >= text.length){ resolve(); return; }
        node.textContent += text.slice(i, i + 2);
        i += 2;
        scrollBottom();
        setTimeout(step, 16);
      })();
    });
  }

  /* ================================================================
     四、调 L1 编排层 POST /api/agent/invoke（intent=PLAN_DRAFT / FOOD_RECOMMEND）
     ================================================================ */

  /* ================================================================
     五、对话 Agent（模型自己决定查什么）
     前端只做两件事：把上下文带上去，把结果画出来。
     不再按意图写分支——「有没有小馆子」「你家是哪的」「那明天呢」
     这类话由模型看着工具清单自己决定去查什么。
     ================================================================ */

  /**
   * 组上下文：最近 10 条对话 + 本轮已确认的槽位。
   * 当前这句话在 sendText 里已经存进会话，这里去掉末尾重复的一条。
   */
  function historyOf(session, skipText){
    var out = [];
    var msgs = (session && session.messages) || [];
    for(var i=0;i<msgs.length;i++){
      var m = msgs[i];
      if(!m || !m.text) continue;
      out.push({ role:(m.role === 'user' ? 'user' : 'assistant'), text:String(m.text).slice(0, 240) });
    }
    if(out.length && skipText){
      var last = out[out.length - 1];
      if(last.role === 'user' && last.text === String(skipText).slice(0, 240)) out.pop();
    }
    return out.slice(-10);
  }

  function stateOf(session){
    var s = session && session.state;
    if(!s) return null;
    var out = {};
    if(s.city) out.city = s.city;
    if(s.days) out.days = s.days;
    if(s.travelers) out.travelers = s.travelers;
    if(s.budget) out.budget = s.budget;
    if(s.preferences && s.preferences.length) out.preferences = s.preferences;
    return Object.keys(out).length ? out : null;
  }

  function saveState(session, next){
    if(!session || !next) return;
    session.state = next;
    saveSessions();
  }

  /** 调对话 Agent；接口不可用（老后端、模型未配置）返回 null，由 respond 回落旧链路。 */
  async function chatAgent(text, session){
    try{
      var res = await fetch('/api/chat', {
        method:'POST',
        credentials:'same-origin',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          message: String(text || '').slice(0, 300),
          history: historyOf(session, text),
          state: stateOf(session)
        })
      });
      if(res.status === 401){
        location.replace('/?next=' + encodeURIComponent('/chat.html'));
        return null;
      }
      if(!res.ok) return null;
      return await res.json();
    }catch(e){ return null; }
  }

  /** 天气卡：逐日一行，右上角是温度区间与风。数据是高德预报，不是实况。 */
  /**
   * 路线卡：距离与耗时是路径规划接口的预估值，卡片里如实标注，
   * 不写「一定能到」「大概几点到」这类把预估当承诺的话。
   */
  function routeBlock(data){
    var d = data || {};
    var box = el('div','wx route');
    var head = el('div','wx-h');
    head.textContent = fmt(d.origin) + ' → ' + fmt(d.destination) + ' · ' + fmt(d.modeLabel)
      + (d.source ? ' · 来源' + d.source : '');
    box.appendChild(head);
    var sum = el('div','route-sum');
    sum.appendChild(el('b', null, escapeHtml(d.distanceText || '距离未知') +
      ' · 约 ' + escapeHtml(d.durationText || '耗时未知')));
    box.appendChild(sum);
    var steps = d.steps || [];
    steps.forEach(function(s){
      var row = el('div','route-step');
      row.appendChild(el('span','route-ix', escapeHtml(String(s.instruction || ''))));
      var meta = [];
      if(s.road) meta.push(s.road);
      if(s.distanceMeters != null) meta.push(s.distanceMeters + ' 米');
      if(meta.length) row.appendChild(el('span','route-meta', escapeHtml(meta.join(' · '))));
      box.appendChild(row);
    });
    box.appendChild(el('div','wx-tip','距离与耗时是路径规划接口的预估，不含等车、排队与检票时间，实际以地图 App 与现场为准。'));
    return box;
  }

  function weatherBlock(data){
    var box = el('div','wx');
    var head = el('div','wx-h');
    head.textContent = fmt(data && data.city) + ' · 逐日预报'
      + (data && data.reportTime ? ' · 发布 ' + data.reportTime : '')

        .filter(Boolean).join(' → ');
      row.appendChild(el('div','', escapeHtml(mid || '天气未知')));

  /**
   * 投票卡片：默认只给「胜出 + 一句口径」，候选评分、主 Agent 草案、购票入口全部折叠。
   * 用户不想一屏里同时看到多套待候选和重复草案；想核对细节再点开，数据本身不删、不改写。
   */
  function voteBlock(data){
    data = data || {};
    var box = el('div','vote');
    var plans = data.plans || [];
    var ranking = data.ranking || [];
    var notices = data.notices || [];
    var head = el('div','vote-h');
    head.textContent = '评委投票 · 共 ' + plans.length + ' 套候选';
    box.appendChild(head);
    if(data.winner){
      var win = el('div','vote-win');
      var winnerPlan = plans.find(function(p){ return p && p.planId === data.winner; });
      win.textContent = '胜出：' + data.winner
        + (winnerPlan && winnerPlan.title ? ' · ' + winnerPlan.title : '')
        + (winnerPlan && winnerPlan.focus ? '（侧重' + ({COST:'省钱',FOOD:'美食',WALK:'少走路',BALANCED:'均衡'}[winnerPlan.focus] || winnerPlan.focus) + '）' : '');
      box.appendChild(win);
      var tip = el('div','vote-tip');
      tip.textContent = '评分来自评委 Agent 的结构化票，仅供参考；行程安排最终由你决定。';
      box.appendChild(tip);
    } else if(notices.length){
      box.appendChild(el('div','vote-tip', escapeHtml(notices[0] || '本轮没有产生推荐')));
    }

    foldBlock(box, '展开 ' + plans.length + ' 套候选评分与主 Agent 草案', function(fbody){
      ranking.forEach(function(r){
        var row = el('div','vote-row');
        row.appendChild(el('div','d', escapeHtml(r.planId || '')));
        row.appendChild(el('div','', escapeHtml('加权 ' + (r.score || '-') + ' · ' + (r.voterCount || 0) + ' 票有效')));
        fbody.appendChild(row);
      });
      var draft = data.draft || null;
      if(draft){
        var dbox = el('div','');
        dbox.style.marginTop = 'var(--sp-2)';
        dbox.appendChild(el('div','wx-h', '主 Agent 汇总 ' + (data.collectedFactCount || 0)
          + ' 条子 Agent 事实整理的草案'));
        (draft.dailySchedules || []).forEach(function(d){
          if(!d.items || !d.items.length) return;  // 不重复渲染「暂无候选」
          dbox.appendChild(el('div','vote-tip', escapeHtml('D' + d.day + '：' + d.items.join('、'))));
        });
        var trimmed = Number((draft.dayScope || {}).trimmedDays || 0);
        if(trimmed){
          var folded = el('div','vote-tip');
          folded.textContent = '另有 ' + trimmed + ' 天没有可查景点，未硬凑空天。';
          dbox.appendChild(folded);
        }
        var guidanceBox = ticketGuidanceBlock(draft.ticketGuidance);
        if(guidanceBox){
          guidanceBox.style.marginTop = 'var(--sp-2)';
          dbox.appendChild(guidanceBox);
        }
        fbody.appendChild(dbox);
      }
    });
    return box;
  }

  /**
   * 票务子 Agent 的产物：只列经核验的官方入口与购票方法。
   * 不渲染「下单」「支付」按钮——系统不替用户购票，也不生成猜测链接。
   */
  function ticketGuidanceBlock(g){

    var box = el('div','wx');
    box.appendChild(el('div','wx-h','官方购票入口（只给入口与方法，不代下单）'));

    }

      var url = String(c.url || '');

      var row = el('div','wx-row');

      link.setAttribute('href', url);
      link.setAttribute('target', '_blank');

      row.appendChild(link);
      row.appendChild(el('div','t', escapeHtml(c.note || '以官方页面为准')));
      box.appendChild(row);
    });
    box.appendChild(el('div','vote-tip', escapeHtml(channels.length
      ? (g.note || '余票未核验，购票前请以官方页面显示为准。')
      : '暂未收录经核验的官方入口，请自行进入景区官方网站或官方公众号；本系统不生成猜测链接。')));

  /**
   * 景点小表：候选已按真实评分排序；票价只显示数据源原文，缺票价就明说「未核验」
   * 并给出购票方法。人工核验过的官方入口才渲染成链接，绝不拼一个猜测网址。
   */
  /** 只允许地图官方域名，避免卡片数据里混进任意外链。 */
  function officialReviewUrl(u){
    var raw = String(u || '');
    if(!/^https:\/\//i.test(raw)) return '';
    try{
      var host = new URL(raw).hostname.toLowerCase();
      var allowed = ['www.amap.com','ditu.amap.com','uri.amap.com',
                     'map.baidu.com','api.map.baidu.com'];
      return allowed.indexOf(host) >= 0 ? raw : '';
    }catch(e){ return ''; }
  }

  /** 景点小表：名字、评价数（可点开说明）、★评分、票价原文；评论正文只在地图官方页。 */
  function placesBlock(rows){
    var box = el('div','wx places');
    box.appendChild(el('div','wx-h','景点（好评高的在前，点评价看评论入口；票价为数据源原文，人工核验过的另标）'));
    var links = [], seen = {};
    var list = rows || [];
    var shown = list.slice(0, 4);
    function addRow(target, r){
      var row = el('div','wx-row');
      var nameBox = el('div','d', escapeHtml(r.name || ''));
      var hasCount = !(r.commentCount == null || String(r.commentCount) === '');

      toggle.setAttribute('type','button');
      toggle.setAttribute('aria-expanded','false');
      sub.appendChild(toggle);
      if(r.level) sub.appendChild(document.createTextNode(' · ' + String(r.level)));
      nameBox.appendChild(sub);
      row.appendChild(nameBox);
      var rate = (r.rating == null || String(r.rating) === '') ? '' : '★ ' + String(r.rating);
      row.appendChild(el('div','rate', escapeHtml(rate || '暂无评分')));
      var hasTicket = !!ticketText(r.ticket);
      var t = el('div', 't' + (hasTicket ? '' : ' unknown'), escapeHtml(ticketLabel(r)));
      var badge = ticketBadge(r);
      if(badge){
        var tag = el('span', 'tk-badge' + (badge === '人工核验' ? ' ok' : ''));
        tag.textContent = badge;
        t.insertBefore(tag, t.firstChild);
      }
      row.appendChild(t);
      (r.channels || []).forEach(function(c){
        var url = String(c.url || '');
        if(!/^https?:\/\//i.test(url) || seen[url]) return;
        seen[url] = 1;
        links.push({name: String(c.name || '官方购票入口'), url: url, note: String(c.note || '')});
      });
      target.appendChild(row);

      // 展开面板只陈述真实评分与来源：地图 API 不返回评论正文，本系统不存储也不生成评论
      var url = officialReviewUrl(r.reviewUrl);
      var source = String(r.reviewSource || '地图平台');
      var panel = el('div','review-panel');
      panel.hidden = true;
      var ratingLine = (rate || '暂无评分')
          + (hasCount ? ' · ' + String(r.commentCount) + ' 条评价' : '')

      panel.appendChild(el('div','rp-line', escapeHtml(ratingLine)));
      panel.appendChild(el('div','rp-note',
          r.reviewViaSearch
            ? '评论正文由地图平台提供，本系统没有取得评论数据、也不会生成评论。下面是官方地图搜索页，进入后点开该景点即可看真实评价。'
            : '评论正文由地图平台提供，本系统没有取得评论数据、也不会生成评论。点下方按钮到地图官方页面查看其他游客的真实评价。'));
      if(url){
        var a = document.createElement('a');
        a.textContent = r.reviewViaSearch
            ? '在高德地图搜索该景点 ↗' : '查看' + source + '真实评论 ↗';
        a.setAttribute('href', url);
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
        panel.appendChild(a);
      } else {
        panel.appendChild(el('div','rp-note','当前没有可用的官方评论入口，可自行在地图 App 搜索景点名查看。'));
      }
      target.appendChild(panel);
      toggle.addEventListener('click', function(){
        var open = panel.hidden;

    // 一次列十几个景点没人看：好评最高的前 4 个直接给，其余折叠
