<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" style="max-width:100%;height:auto" role="img" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>周更提案状态机与回滚分支</title>
<desc>过期核验进入待审提案，经证据闸门与人工确认后批准，再经 CAS 校验后应用；证据不足、基线冲突与验收失败分别落到拒绝、冲突和回滚三条分支。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="1000" height="300" fill="#f1f5f9"/>
<text x="40" y="30" font-size="13" fill="#475569">提案状态机 · verified 是结论，证据对象是理由</text>

<g>
<rect x="40" y="48" width="200" height="44" rx="6" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1"/>
<text x="140" y="76" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">stale · TTL 到期</text>
</g>
<path d="M140 92 L140 132" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="132" width="200" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="132" width="4" height="64" rx="2" fill="#2563eb"/>
<text x="140" y="158" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">proposed</text>
<text x="140" y="180" font-size="12" fill="#64748b" text-anchor="middle">待审提案 · 零写入</text>
</g>
<path d="M240 164 L280 164" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<g>
<rect x="280" y="132" width="200" height="64" rx="6" fill="#dc2626" fill-opacity="0.04" stroke="#e2e8f0" stroke-width="1"/>
<rect x="280" y="132" width="4" height="64" rx="2" fill="#dc2626"/>
<text x="380" y="158" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">证据闸门</text>
<text x="380" y="180" font-size="12" fill="#64748b" text-anchor="middle">人工确认</text>
</g>
<path d="M480 164 L520 164" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<g>
<rect x="520" y="132" width="200" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="520" y="132" width="4" height="64" rx="2" fill="#16a34a"/>
<text x="620" y="158" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">approved</text>
<text x="620" y="180" font-size="12" fill="#64748b" text-anchor="middle">已批准 · 待 CAS</text>
</g>
<path d="M720 164 L760 164" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

<g>
<rect x="760" y="132" width="200" height="64" rx="6" fill="#16a34a" fill-opacity="0.04" stroke="#e2e8f0" stroke-width="1"/>
<rect x="760" y="132" width="4" height="64" rx="2" fill="#16a34a"/>
<text x="860" y="158" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">applied</text>
<text x="860" y="180" font-size="12" fill="#64748b" text-anchor="middle">已应用 · 可回滚</text>
</g>

<path d="M380 196 L380 232" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M620 196 L620 232" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M860 196 L860 232" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<g>
<rect x="280" y="232" width="200" height="48" rx="6" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
<text x="380" y="260" font-size="12" fill="#475569" text-anchor="middle">rejected · 缺证据</text>
</g>
<g>
<rect x="520" y="232" width="200" height="48" rx="6" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
<text x="620" y="260" font-size="12" fill="#475569" text-anchor="middle">conflict · 基线变动</text>
</g>
<g>
<rect x="760" y="232" width="200" height="48" rx="6" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
<text x="860" y="260" font-size="12" fill="#475569" text-anchor="middle">rolled_back · 验收失败</text>
</g>
</svg>
